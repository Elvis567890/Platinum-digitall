name: Build Platinum Digital App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate all code
        run: |
          set -e

          # Create shared package structure
          mkdir -p shared/lib/models

          cat > shared/pubspec.yaml << 'SHAREDPUB'
          name: shared
          description: Shared
          version: 1.0.0
          environment:
            sdk: ">=3.0.0 <4.0.0"
          dependencies:
            crypto: ^3.0.3
          SHAREDPUB

          cat > shared/lib/announcement.dart << 'ANN'
          class Announcement {
            final String id;
            final String title;
            final String body;
            Announcement({required this.id, required this.title, required this.body});
          }
          ANN

          # Create Admin App
          flutter create --org com.platinum --project-name admin_app admin_app
          mkdir -p admin_app/lib/screens

          cat > admin_app/pubspec.yaml << 'ADMINPUB'
          name: admin_app
          description: Platinum Admin
          version: 1.0.0+1
          environment:
            sdk: ">=3.0.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            shared:
              path: ../shared
          flutter:
            uses-material-design: true
          ADMINPUB

          cat > admin_app/lib/main.dart << 'ADMINMAIN'
          import 'package:flutter/material.dart';
          import 'screens/login.dart';

          void main() => runApp(const PlatinumAdminApp());

          class PlatinumAdminApp extends StatelessWidget {
            const PlatinumAdminApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Platinum Admin',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  primaryColor: const Color(0xFFCC0000),
                  appBarTheme: const AppBarTheme(
                    backgroundColor: Color(0xFFCC0000),
                    foregroundColor: Colors.white,
                  ),
                ),
                home: const LoginScreen(),
              );
            }
          }
          ADMINMAIN

          cat > admin_app/lib/screens/login.dart << 'LOGIN'
          import 'package:flutter/material.dart';
          import 'dashboard.dart';

          class LoginScreen extends StatefulWidget {
            const LoginScreen({super.key});
            @override
            State<LoginScreen> createState() => _LoginScreenState();
          }

          class _LoginScreenState extends State<LoginScreen> {
            final _id = TextEditingController();
            final _pin = TextEditingController();
            String _role = 'teacher';

            void _login() {
              if (_id.text.isEmpty || _pin.text.isEmpty) return;
              Navigator.pushReplacement(context, MaterialPageRoute(
                builder: (_) => DashboardScreen(role: _role, name: _id.text),
              ));
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Padding(
                  padding: const EdgeInsets.all(24),
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      const Text('Platinum Digital App',
                        style: TextStyle(fontSize: 26, fontWeight: FontWeight.bold,
                          color: Color(0xFFCC0000))),
                      const SizedBox(height: 8),
                      const Text('Admin Portal',
                        style: TextStyle(fontSize: 16, color: Colors.grey)),
                      const SizedBox(height: 32),
                      TextField(controller: _id,
                        decoration: const InputDecoration(labelText: 'Staff ID',
                          border: OutlineInputBorder())),
                      const SizedBox(height: 16),
                      TextField(controller: _pin, obscureText: true,
                        decoration: const InputDecoration(labelText: 'PIN',
                          border: OutlineInputBorder())),
                      const SizedBox(height: 16),
                      DropdownButtonFormField<String>(
                        value: _role,
                        decoration: const InputDecoration(labelText: 'Role',
                          border: OutlineInputBorder()),
                        items: const [
                          DropdownMenuItem(value: 'super_admin', child: Text('Super Admin')),
                          DropdownMenuItem(value: 'release_admin', child: Text('Release Admin')),
                          DropdownMenuItem(value: 'admin', child: Text('Admin')),
                          DropdownMenuItem(value: 'teacher', child: Text('Teacher')),
                        ],
                        onChanged: (v) => setState(() => _role = v!),
                      ),
                      const SizedBox(height: 24),
                      SizedBox(width: double.infinity,
                        child: ElevatedButton(
                          style: ElevatedButton.styleFrom(
                            backgroundColor: const Color(0xFFCC0000),
                            foregroundColor: Colors.white,
                            padding: const EdgeInsets.symmetric(vertical: 16),
                          ),
                          onPressed: _login,
                          child: const Text('Login', style: TextStyle(fontSize: 18)),
                        )),
                    ],
                  ),
                ),
              );
            }
          }
          LOGIN

          cat > admin_app/lib/screens/dashboard.dart << 'DASH'
          import 'package:flutter/material.dart';
          import 'announcements.dart';
          import 'coming_soon.dart';

          class DashboardScreen extends StatelessWidget {
            final String role;
            final String name;
            const DashboardScreen({super.key, required this.role, required this.name});

            @override
            Widget build(BuildContext context) {
              final isSuper = role == 'super_admin';
              final isRelease = role == 'release_admin';
              return Scaffold(
                appBar: AppBar(title: Text('Admin - $name')),
                body: GridView.count(
                  crossAxisCount: 2,
                  padding: const EdgeInsets.all(16),
                  mainAxisSpacing: 16,
                  crossAxisSpacing: 16,
                  children: [
                    _tile(context, 'Post Announcement', Icons.campaign, const AnnouncementsScreen()),
                    _tile(context, 'Submit Marks', Icons.edit_note, const ComingSoonScreen(featureName: 'Marks Submission')),
                    _tile(context, 'Generate Reports', Icons.description, const ComingSoonScreen(featureName: 'Report Generation')),
                    _tile(context, 'Release Reports', Icons.lock_open,
                      isRelease ? const ComingSoonScreen(featureName: 'Release Reports') : const ComingSoonScreen(featureName: 'Release Admin Only')),
                    _tile(context, 'Fee Management', Icons.payments, const ComingSoonScreen(featureName: 'Fee Management')),
                    _tile(context, 'Chat Moderation', Icons.chat, const ComingSoonScreen(featureName: 'Chat Moderation')),
                    if (isSuper) _tile(context, 'Manage Admins', Icons.admin_panel_settings, const ComingSoonScreen(featureName: 'Manage Admins')),
                    if (isSuper) _tile(context, 'Manage Clubs', Icons.groups, const ComingSoonScreen(featureName: 'Manage Clubs')),
                  ],
                ),
              );
            }

            Widget _tile(BuildContext context, String title, IconData icon, Widget screen) {
              return InkWell(
                onTap: () => Navigator.push(context, MaterialPageRoute(builder: (_) => screen)),
                child: Container(
                  decoration: BoxDecoration(
                    color: Colors.white,
                    borderRadius: BorderRadius.circular(12),
                    boxShadow: const [BoxShadow(color: Colors.black12, blurRadius: 6)],
                  ),
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Icon(icon, size: 40, color: const Color(0xFFCC0000)),
                      const SizedBox(height: 12),
                      Padding(
                        padding: const EdgeInsets.symmetric(horizontal: 8),
                        child: Text(title, textAlign: TextAlign.center,
                          style: const TextStyle(fontWeight: FontWeight.w600)),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          DASH

          cat > admin_app/lib/screens/announcements.dart << 'ANNSCR'
          import 'package:flutter/material.dart';

          class AnnouncementsScreen extends StatefulWidget {
            const AnnouncementsScreen({super.key});
            @override
            State<AnnouncementsScreen> createState() => _AnnouncementsScreenState();
          }

          class _AnnouncementsScreenState extends State<AnnouncementsScreen> {
            final _title = TextEditingController();
            final _body = TextEditingController();
            String _audience = 'Whole School';

            void _post() {
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(content: Text('Posted to $_audience')));
              _title.clear();
              _body.clear();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Post Announcement')),
                body: Padding(
                  padding: const EdgeInsets.all(16),
                  child: ListView(
                    children: [
                      TextField(controller: _title,
                        decoration: const InputDecoration(labelText: 'Title', border: OutlineInputBorder())),
                      const SizedBox(height: 12),
                      TextField(controller: _body, maxLines: 5,
                        decoration: const InputDecoration(labelText: 'Message', border: OutlineInputBorder())),
                      const SizedBox(height: 12),
                      DropdownButtonFormField<String>(
                        value: _audience,
                        decoration: const InputDecoration(labelText: 'Audience', border: OutlineInputBorder()),
                        items: const [
                          DropdownMenuItem(value: 'Whole School', child: Text('Whole School')),
                          DropdownMenuItem(value: 'Senior Four', child: Text('Senior Four')),
                          DropdownMenuItem(value: 'Senior Three', child: Text('Senior Three')),
                          DropdownMenuItem(value: 'Senior Two', child: Text('Senior Two')),
                          DropdownMenuItem(value: 'Senior One', child: Text('Senior One')),
                          DropdownMenuItem(value: 'Staff Only', child: Text('Staff Only')),
                        ],
                        onChanged: (v) => setState(() => _audience = v!),
                      ),
                      const SizedBox(height: 24),
                      ElevatedButton(
                        style: ElevatedButton.styleFrom(
                          backgroundColor: const Color(0xFFCC0000),
                          foregroundColor: Colors.white,
                          padding: const EdgeInsets.symmetric(vertical: 16),
                        ),
                        onPressed: _post,
                        child: const Text('Post to Students', style: TextStyle(fontSize: 18)),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          ANNSCR

          cat > admin_app/lib/screens/coming_soon.dart << 'CS'
          import 'package:flutter/material.dart';

          class ComingSoonScreen extends StatelessWidget {
            final String featureName;
            const ComingSoonScreen({super.key, required this.featureName});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text(featureName)),
                body: Center(
                  child: Padding(
                    padding: const EdgeInsets.all(32),
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        const Text('Coming Soon',
                          style: TextStyle(fontSize: 28, fontWeight: FontWeight.bold,
                            color: Color(0xFFCC0000))),
                        const SizedBox(height: 12),
                        Text('$featureName is coming soon for Platinum Secondary School Kiteezi.',
                          textAlign: TextAlign.center,
                          style: const TextStyle(fontSize: 16, color: Colors.black54)),
                        const SizedBox(height: 24),
                        const Text('Excellence Is Our Culture',
                          style: TextStyle(fontSize: 14, fontStyle: FontStyle.italic,
                            color: Color(0xFFCC0000))),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          CS

          # Create Student App
          flutter create --org com.platinum --project-name student_app student_app
          mkdir -p student_app/lib/screens

          cat > student_app/pubspec.yaml << 'STUPUB'
          name: student_app
          description: Platinum Student
          version: 1.0.0+1
          environment:
            sdk: ">=3.0.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            shared:
              path: ../shared
          flutter:
            uses-material-design: true
          STUPUB

          cat > student_app/lib/main.dart << 'STUMAIN'
          import 'package:flutter/material.dart';
          import 'screens/home.dart';

          void main() => runApp(const PlatinumStudentApp());

          class PlatinumStudentApp extends StatelessWidget {
            const PlatinumStudentApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Platinum Digital App',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  primaryColor: const Color(0xFFCC0000),
                  appBarTheme: const AppBarTheme(
                    backgroundColor: Color(0xFFCC0000),
                    foregroundColor: Colors.white,
                  ),
                ),
                home: const HomeScreen(),
              );
            }
          }
          STUMAIN

          cat > student_app/lib/screens/home.dart << 'HOME'
          import 'package:flutter/material.dart';
          import 'announcements.dart';
          import 'reports.dart';
          import 'chat.dart';
          import 'clubs.dart';
          import 'coming_soon.dart';

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});
            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            int _index = 0;
            final _pages = const [
              AnnouncementsScreen(),
              ReportsScreen(),
              ChatScreen(),
              ClubsScreen(),
              ComingSoonScreen(featureName: 'School Fees Balance'),
            ];

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: _pages[_index],
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: _index,
                  onTap: (i) => setState(() => _index = i),
                  selectedItemColor: const Color(0xFFCC0000),
                  unselectedItemColor: Colors.grey,
                  type: BottomNavigationBarType.fixed,
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.home), label: 'Home'),
                    BottomNavigationBarItem(icon: Icon(Icons.description), label: 'Reports'),
                    BottomNavigationBarItem(icon: Icon(Icons.chat), label: 'Chat'),
                    BottomNavigationBarItem(icon: Icon(Icons.groups), label: 'Clubs'),
                    BottomNavigationBarItem(icon: Icon(Icons.payments), label: 'Fees'),
                  ],
                ),
              );
            }
          }
          HOME

          cat > student_app/lib/screens/announcements.dart << 'SAN'
          import 'package:flutter/material.dart';

          class AnnouncementsScreen extends StatelessWidget {
            const AnnouncementsScreen({super.key});
            static const _messages = [
              {'title': 'Welcome to Platinum Digital App',
               'body': 'This app is your official school communication tool.',
               'time': 'Just now'},
              {'title': 'Sports Day Friday',
               'body': 'All students report to the main field at 8am.',
               'time': '2 hours ago'},
              {'title': 'Exams Begin',
               'body': 'End of term exams begin next Monday.',
               'time': '1 day ago'},
            ];

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Platinum Digital App')),
                body: ListView.builder(
                  padding: const EdgeInsets.all(12),
                  itemCount: _messages.length,
                  itemBuilder: (_, i) {
                    final m = _messages[i];
                    return Card(
                      margin: const EdgeInsets.only(bottom: 12),
                      child: ListTile(
                        leading: const Icon(Icons.campaign, color: Color(0xFFCC0000)),
                        title: Text(m['title']!, style: const TextStyle(fontWeight: FontWeight.bold)),
                        subtitle: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Text(m['body']!),
                            const SizedBox(height: 4),
                            Text(m['time']!, style: const TextStyle(fontSize: 12, color: Colors.grey)),
                          ],
                        ),
                      ),
                    );
                  },
                ),
              );
            }
          }
          SAN

          cat > student_app/lib/screens/reports.dart << 'REP'
          import 'package:flutter/material.dart';

          class ReportsScreen extends StatefulWidget {
            const ReportsScreen({super.key});
            @override
            State<ReportsScreen> createState() => _ReportsScreenState();
          }

          class _ReportsScreenState extends State<ReportsScreen> {
            final _code = TextEditingController();
            bool _unlocked = false;

            void _unlock() {
              if (_code.text.length >= 4) setState(() => _unlocked = true);
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('My Reports')),
                body: Padding(
                  padding: const EdgeInsets.all(16),
                  child: _unlocked
                    ? const Center(child: Text('Report loaded! (Coming soon)',
                        textAlign: TextAlign.center, style: TextStyle(fontSize: 18)))
                    : Column(
                        mainAxisAlignment: MainAxisAlignment.center,
                        children: [
                          const Icon(Icons.lock, size: 64, color: Color(0xFFCC0000)),
                          const SizedBox(height: 16),
                          const Text('Reports Released',
                            style: TextStyle(fontSize: 22, fontWeight: FontWeight.bold)),
                          const SizedBox(height: 8),
                          const Text('Enter your secret code',
                            style: TextStyle(color: Colors.grey)),
                          const SizedBox(height: 24),
                          TextField(controller: _code,
                            decoration: const InputDecoration(labelText: 'Secret Code',
                              border: OutlineInputBorder()),
                            textAlign: TextAlign.center,
                            style: const TextStyle(fontSize: 24, letterSpacing: 8)),
                          const SizedBox(height: 24),
                          ElevatedButton(
                            style: ElevatedButton.styleFrom(
                              backgroundColor: const Color(0xFFCC0000),
                              foregroundColor: Colors.white,
                              padding: const EdgeInsets.symmetric(horizontal: 48, vertical: 16),
                            ),
                            onPressed: _unlock,
                            child: const Text('Unlock Report', style: TextStyle(fontSize: 18)),
                          ),
                        ],
                      ),
                ),
              );
            }
          }
          REP

          cat > student_app/lib/screens/chat.dart << 'CHAT'
          import 'package:flutter/material.dart';

          class ChatScreen extends StatelessWidget {
            const ChatScreen({super.key});
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Chat')),
                body: ListView(
                  children: const [
                    ListTile(
                      leading: CircleAvatar(child: Icon(Icons.groups)),
                      title: Text('Senior Four Group'),
                      subtitle: Text('12 new messages'),
                      trailing: Icon(Icons.chevron_right),
                    ),
                    ListTile(
                      leading: CircleAvatar(child: Icon(Icons.groups)),
                      title: Text('Whole School'),
                      subtitle: Text('3 new messages'),
                      trailing: Icon(Icons.chevron_right),
                    ),
                  ],
                ),
              );
            }
          }
          CHAT

          cat > student_app/lib/screens/clubs.dart << 'CLUBS'
          import 'package:flutter/material.dart';

          class ClubsScreen extends StatelessWidget {
            const ClubsScreen({super.key});
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Clubs')),
                body: ListView(
                  children: const [
                    ListTile(
                      leading: CircleAvatar(child: Icon(Icons.edit)),
                      title: Text('Writers Club'),
                      subtitle: Text('3 new announcements'),
                      trailing: Icon(Icons.chevron_right),
                    ),
                    ListTile(
                      leading: CircleAvatar(child: Icon(Icons.mic)),
                      title: Text('Debate Club'),
                      subtitle: Text('1 new announcement'),
                      trailing: Icon(Icons.chevron_right),
                    ),
                    ListTile(
                      leading: CircleAvatar(child: Icon(Icons.science)),
                      title: Text('Science Club'),
                      subtitle: Text('No new announcements'),
                      trailing: Icon(Icons.chevron_right),
                    ),
                  ],
                ),
              );
            }
          }
          CLUBS

          cat > student_app/lib/screens/coming_soon.dart << 'CSSTU'
          import 'package:flutter/material.dart';

          class ComingSoonScreen extends StatelessWidget {
            final String featureName;
            const ComingSoonScreen({super.key, required this.featureName});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text(featureName)),
                body: Center(
                  child: Padding(
                    padding: const EdgeInsets.all(32),
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        const Text('Coming Soon',
                          style: TextStyle(fontSize: 28, fontWeight: FontWeight.bold,
                            color: Color(0xFFCC0000))),
                        const SizedBox(height: 12),
                        Text('$featureName is coming soon for Platinum Secondary School Kiteezi.',
                          textAlign: TextAlign.center,
                          style: const TextStyle(fontSize: 16, color: Colors.black54)),
                        const SizedBox(height: 24),
                        const Text('Excellence Is Our Culture',
                          style: TextStyle(fontSize: 14, fontStyle: FontStyle.italic,
                            color: Color(0xFFCC0000))),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          CSSTU

          echo "===== Code generated ====="

      - name: Build Admin APK
        run: |
          cd admin_app
          flutter pub get
          flutter build apk --release

      - name: Build Student APK
        run: |
          cd student_app
          flutter pub get
          flutter build apk --release

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: platinum-apps
          path: |
            admin_app/build/app/outputs/flutter-apk/app-release.apk
            student_app/build/app/outputs/flutter-apk/app-release.apk
