name: Build Platinum Digital App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # JOB 1: Build the Admin App
  build-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Shared and Admin Code
        run: |
          # 1. SMART LOGO FINDER
          mkdir -p admin_app/assets
          LOGO_SOURCE=$(find . -maxdepth 1 -iname "*inshot*.png" | head -n 1)
          if [ -z "$LOGO_SOURCE" ]; then
            LOGO_SOURCE=$(find . -maxdepth 1 -iname "*.png" | head -n 1)
          fi

          if [ -n "$LOGO_SOURCE" ]; then
            echo "Found logo: $LOGO_SOURCE"
            cp "$LOGO_SOURCE" admin_app/assets/logo.png
          else
            echo "Warning: No logo found. Using placeholder."
            echo -n "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > admin_app/assets/logo.png
          fi

          # 2. SHARED MODELS
          mkdir -p shared/lib/models
          cat > shared/pubspec.yaml << 'SHAREDPUB'
          name: shared
          description: Shared
          version: 1.0.0
          environment:
            sdk: ">=3.0.0 <4.0.0"
          dependencies:
            crypto: ^3.0.3
          SHAREDPUB

          cat > shared/lib/announcement.dart << 'ANN'
          class Announcement {
            final String id;
            final String title;
            final String body;
            final String audience;
            final String animationType;
            final DateTime createdAt;
            Announcement({
              required this.id,
              required this.title,
              required this.body,
              required this.audience,
              required this.animationType,
              required this.createdAt,
            });
          }
          ANN

          # 3. ADMIN APP WIRING
          flutter create --org com.platinum --project-name admin_app admin_app
          mkdir -p admin_app/lib/screens

          cat > admin_app/pubspec.yaml << 'ADMINPUB'
          name: admin_app
          description: Platinum Admin
          version: 1.0.0+1
          environment:
            sdk: ">=3.0.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            shared:
              path: ../shared
            intl: ^0.19.0
          flutter:
            uses-material-design: true
            assets:
              - assets/
          ADMINPUB

          cat > admin_app/lib/main.dart << 'ADMINMAIN'
          import 'package:flutter/material.dart';
          import 'screens/login.dart';

          void main() => runApp(const PlatinumAdminApp());

          class PlatinumAdminApp extends StatelessWidget {
            const PlatinumAdminApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Platinum Admin',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  primaryColor: const Color(0xFF0A3D91),
                  appBarTheme: const AppBarTheme(
                    backgroundColor: Color(0xFF0A3D91),
                    foregroundColor: Colors.white,
                  ),
                ),
                home: const LoginScreen(),
              );
            }
          }
          ADMINMAIN

          cat > admin_app/lib/screens/login.dart << 'LOGIN'
          import 'package:flutter/material.dart';
          import 'dashboard.dart';

          class LoginScreen extends StatefulWidget {
            const LoginScreen({super.key});
            @override
            State<LoginScreen> createState() => _LoginScreenState();
          }

          class _LoginScreenState extends State<LoginScreen> {
            final _id = TextEditingController();
            final _pin = TextEditingController();
            String _role = 'teacher';

            void _login() {
              if (_id.text.isEmpty || _pin.text.isEmpty) return;
              Navigator.pushReplacement(context, MaterialPageRoute(
                builder: (_) => DashboardScreen(role: _role, name: _id.text),
              ));
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFFF5F7FA),
                body: SafeArea(
                  child: Padding(
                    padding: const EdgeInsets.all(24),
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        Image.asset('assets/logo.png', height: 120, width: 120, fit: BoxFit.contain),
                        const SizedBox(height: 16),
                        const Text('Welcome Back',
                          style: TextStyle(fontSize: 26, fontWeight: FontWeight.bold,
                            color: Color(0xFF0A3D91))),
                        const SizedBox(height: 8),
                        const Text('Select your role to continue',
                          style: TextStyle(fontSize: 16, color: Colors.grey)),
                        const SizedBox(height: 32),
                        TextField(controller: _id,
                          decoration: const InputDecoration(labelText: 'Staff ID',
                            border: OutlineInputBorder())),
                        const SizedBox(height: 16),
                        TextField(controller: _pin, obscureText: true,
                          decoration: const InputDecoration(labelText: 'PIN',
                            border: OutlineInputBorder())),
                        const SizedBox(height: 16),
                        DropdownButtonFormField<String>(
                          value: _role,
                          decoration: const InputDecoration(labelText: 'Role',
                            border: OutlineInputBorder()),
                          items: const [
                            DropdownMenuItem(value: 'super_admin', child: Text('Super Admin')),
                            DropdownMenuItem(value: 'release_admin', child: Text('Release Admin')),
                            DropdownMenuItem(value: 'admin', child: Text('Admin')),
                            DropdownMenuItem(value: 'teacher', child: Text('Teacher')),
                          ],
                          onChanged: (v) => setState(() => _role = v!),
                        ),
                        const SizedBox(height: 24),
                        SizedBox(width: double.infinity,
                          child: ElevatedButton(
                            style: ElevatedButton.styleFrom(
                              backgroundColor: const Color(0xFF0A3D91),
                              foregroundColor: Colors.white,
                              padding: const EdgeInsets.symmetric(vertical: 16),
                              shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                            ),
                            onPressed: _login,
                            child: const Text('Continue', style: TextStyle(fontSize: 18)),
                          )),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          LOGIN

          cat > admin_app/lib/screens/dashboard.dart << 'DASH'
          import 'package:flutter/material.dart';
          import 'announcements.dart';
          import 'marks_submission.dart';
          import 'validation_engine.dart';
          import 'coming_soon.dart';

          class DashboardScreen extends StatelessWidget {
            final String role;
            final String name;
            const DashboardScreen({super.key, required this.role, required this.name});

            @override
            Widget build(BuildContext context) {
              final isSuper = role == 'super_admin';
              final isRelease = role == 'release_admin';
              
              return Scaffold(
                appBar: AppBar(title: Text('Admin - $name')),
                body: GridView.count(
                  crossAxisCount: 2,
                  padding: const EdgeInsets.all(16),
                  mainAxisSpacing: 16,
                  crossAxisSpacing: 16,
                  children: [
                    _tile(context, 'Broadcast', Icons.campaign, const AnnouncementsScreen()),
                    _tile(context, 'Marks Submission', Icons.edit_note, const MarksSubmissionScreen()),
                    _tile(context, 'Validation Engine', Icons.checklist, const ValidationEngineScreen()),
                    _tile(context, 'Release Reports', Icons.lock_open,
                      isRelease ? const ComingSoonScreen(featureName: 'Release Reports') : const ComingSoonScreen(featureName: 'Release Admin Only')),
                    _tile(context, 'Fee Management', Icons.payments, const ComingSoonScreen(featureName: 'Fee Management')),
                    _tile(context, 'Chat Moderation', Icons.chat, const ComingSoonScreen(featureName: 'Chat Moderation')),
                    if (isSuper) _tile(context, 'Manage Admins', Icons.admin_panel_settings, const ComingSoonScreen(featureName: 'Manage Admins')),
                    if (isSuper) _tile(context, 'Manage Clubs', Icons.groups, const ComingSoonScreen(featureName: 'Manage Clubs')),
                  ],
                ),
              );
            }

            Widget _tile(BuildContext context, String title, IconData icon, Widget screen) {
              return InkWell(
                onTap: () => Navigator.push(context, MaterialPageRoute(builder: (_) => screen)),
                child: Container(
                  decoration: BoxDecoration(
                    color: Colors.white,
                    borderRadius: BorderRadius.circular(12),
                    boxShadow: const [BoxShadow(color: Colors.black12, blurRadius: 6)],
                  ),
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Icon(icon, size: 40, color: const Color(0xFF0A3D91)),
                      const SizedBox(height: 12),
                      Padding(
                        padding: const EdgeInsets.symmetric(horizontal: 8),
                        child: Text(title, textAlign: TextAlign.center,
                          style: const TextStyle(fontWeight: FontWeight.w600)),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          DASH

          cat > admin_app/lib/screens/announcements.dart << 'ANNSCR'
          import 'package:flutter/material.dart';

          class AnnouncementsScreen extends StatefulWidget {
            const AnnouncementsScreen({super.key});
            @override
            State<AnnouncementsScreen> createState() => _AnnouncementsScreenState();
          }

          class _AnnouncementsScreenState extends State<AnnouncementsScreen> {
            final _title = TextEditingController();
            final _body = TextEditingController();
            String _audience = 'Whole School';
            String _animationType = 'Normal';

            void _post() {
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(content: Text('Broadcast sent to $_audience')));
              _title.clear();
              _body.clear();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Broadcast Announcement')),
                body: Padding(
                  padding: const EdgeInsets.all(16),
                  child: ListView(
                    children: [
                      const Text('Audience Selection', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                      const SizedBox(height: 8),
                      DropdownButtonFormField<String>(
                        value: _audience,
                        decoration: const InputDecoration(border: OutlineInputBorder()),
                        items: const [
                          DropdownMenuItem(value: 'Whole School', child: Text('Whole School')),
                          DropdownMenuItem(value: 'Senior Four', child: Text('Senior Four')),
                          DropdownMenuItem(value: 'Senior Three', child: Text('Senior Three')),
                          DropdownMenuItem(value: 'Staff Only', child: Text('Staff Only')),
                        ],
                        onChanged: (v) => setState(() => _audience = v!),
                      ),
                      const SizedBox(height: 16),
                      const Text('Animation Picker', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                      const SizedBox(height: 8),
                      DropdownButtonFormField<String>(
                        value: _animationType,
                        decoration: const InputDecoration(border: OutlineInputBorder()),
                        items: const [
                          DropdownMenuItem(value: 'Normal', child: Text('Normal (Slide-in)')),
                          DropdownMenuItem(value: 'Urgent', child: Text('Urgent (Red Pulse)')),
                          DropdownMenuItem(value: 'Celebration', child: Text('Celebration (Confetti)')),
                        ],
                        onChanged: (v) => setState(() => _animationType = v!),
                      ),
                      const SizedBox(height: 16),
                      TextField(controller: _title,
                        decoration: const InputDecoration(labelText: 'Title', border: OutlineInputBorder())),
                      const SizedBox(height: 12),
                      TextField(controller: _body, maxLines: 4,
                        decoration: const InputDecoration(labelText: 'Message', border: OutlineInputBorder())),
                      const SizedBox(height: 24),
                      ElevatedButton(
                        style: ElevatedButton.styleFrom(
                          backgroundColor: const Color(0xFF0A3D91),
                          foregroundColor: Colors.white,
                          padding: const EdgeInsets.symmetric(vertical: 16),
                        ),
                        onPressed: _post,
                        child: const Text('Broadcast Now', style: TextStyle(fontSize: 18)),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          ANNSCR

          cat > admin_app/lib/screens/marks_submission.dart << 'MARKSUB'
          import 'package:flutter/material.dart';

          class MarksSubmissionScreen extends StatefulWidget {
            const MarksSubmissionScreen({super.key});
            @override
            State<MarksSubmissionScreen> createState() => _MarksSubmissionScreenState();
          }

          class _MarksSubmissionScreenState extends State<MarksSubmissionScreen> {
            bool _ocrEnabled = false;

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Teacher Marks Submission')),
                body: Padding(
                  padding: const EdgeInsets.all(16),
                  child: ListView(
                    children: [
                      Container(
                        padding: const EdgeInsets.all(24),
                        decoration: BoxDecoration(
                          border: Border.all(color: Colors.grey, style: BorderStyle.solid),
                          borderRadius: BorderRadius.circular(12),
                        ),
                        child: Column(
                          children: [
                            const Icon(Icons.photo_camera, size: 48, color: Color(0xFF0A3D91)),
                            const SizedBox(height: 8),
                            const Text('Photo Upload of Mark Sheet', style: TextStyle(fontWeight: FontWeight.bold)),
                            const SizedBox(height: 4),
                            const Text('Tap to upload or take a photo', style: TextStyle(color: Colors.grey)),
                          ],
                        ),
                      ),
                      const SizedBox(height: 20),
                      Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          const Text('OCR Auto-Entry', style: TextStyle(fontWeight: FontWeight.bold)),
                          Switch(value: _ocrEnabled, onChanged: (v) => setState(() => _ocrEnabled = v)),
                        ],
                      ),
                      const SizedBox(height: 20),
                      TextField(decoration: const InputDecoration(labelText: 'Subject', border: OutlineInputBorder())),
                      const SizedBox(height: 12),
                      TextField(decoration: const InputDecoration(labelText: 'Class', border: OutlineInputBorder())),
                      const SizedBox(height: 12),
                      TextField(decoration: const InputDecoration(labelText: 'Student Name', border: OutlineInputBorder())),
                      const SizedBox(height: 12),
                      TextField(decoration: const InputDecoration(labelText: 'Mark (e.g. 78/100)', border: OutlineInputBorder())),
                      const SizedBox(height: 24),
                      ElevatedButton(
                        style: ElevatedButton.styleFrom(
                          backgroundColor: const Color(0xFF0A3D91),
                          foregroundColor: Colors.white,
                          padding: const EdgeInsets.symmetric(vertical: 16),
                        ),
                        onPressed: () {},
                        child: const Text('Submit Marks', style: TextStyle(fontSize: 18)),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          MARKSUB

          cat > admin_app/lib/screens/validation_engine.dart << 'VALENG'
          import 'package:flutter/material.dart';

          class ValidationEngineScreen extends StatelessWidget {
            const ValidationEngineScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Report Validation Engine')),
                body: Padding(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    children: [
                      Container(
                        padding: const EdgeInsets.all(12),
                        decoration: BoxDecoration(color: Colors.red[100], borderRadius: BorderRadius.circular(8)),
                        child: const Row(
                          children: [
                            Icon(Icons.error, color: Colors.red),
                            SizedBox(width: 8),
                            Text('2 Errors Detected', style: TextStyle(color: Colors.red, fontWeight: FontWeight.bold)),
                          ],
                        ),
                      ),
                      const SizedBox(height: 16),
                      Card(
                        child: ListTile(
                          leading: const Icon(Icons.warning, color: Colors.orange),
                          title: const Text('Missing marks: Biology'),
                          subtitle: const Text('S4 East • 5 students missing'),
                          trailing: const Icon(Icons.chevron_right),
                        ),
                      ),
                      Card(
                        child: ListTile(
                          leading: const Icon(Icons.warning, color: Colors.orange),
                          title: const Text('Mark 150 exceeds 100'),
                          subtitle: const Text('Student: Kato J. • Mathematics • Row 12'),
                          trailing: const Icon(Icons.chevron_right),
                        ),
                      ),
                      const Spacer(),
                      SizedBox(
                        width: double.infinity,
                        child: ElevatedButton(
                          style: ElevatedButton.styleFrom(
                            backgroundColor: const Color(0xFF0A3D91),
                            foregroundColor: Colors.white,
                            padding: const EdgeInsets.symmetric(vertical: 16),
                          ),
                          onPressed: () {},
                          child: const Text('Batch Generate Reports', style: TextStyle(fontSize: 18)),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          VALENG

          cat > admin_app/lib/screens/coming_soon.dart << 'CS'
          import 'package:flutter/material.dart';

          class ComingSoonScreen extends StatelessWidget {
            final String featureName;
            const ComingSoonScreen({super.key, required this.featureName});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text(featureName)),
                body: Center(
                  child: Padding(
                    padding: const EdgeInsets.all(32),
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        const Text('Coming Soon',
                          style: TextStyle(fontSize: 28, fontWeight: FontWeight.bold, color: Color(0xFF0A3D91))),
                        const SizedBox(height: 12),
                        Text('$featureName is coming soon for Platinum Secondary School Kiteezi.',
                          textAlign: TextAlign.center, style: const TextStyle(fontSize: 16, color: Colors.black54)),
                        const SizedBox(height: 24),
                        const Text('Excellence Is Our Culture',
                          style: TextStyle(fontSize: 14, fontStyle: FontStyle.italic, color: Color(0xFF0A3D91))),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          CS

      - name: Build Admin APK
        run: |
          cd admin_app
          flutter pub get
          flutter build apk --release

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: admin-app-apk
          path: admin_app/build/app/outputs/flutter-apk/app-release.apk


  # JOB 2: Build the Student App
  build-student:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Shared and Student Code
        run: |
          # 1. SMART LOGO FINDER
          mkdir -p student_app/assets
          LOGO_SOURCE=$(find . -maxdepth 1 -iname "*inshot*.png" | head -n 1)
          if [ -z "$LOGO_SOURCE" ]; then
            LOGO_SOURCE=$(find . -maxdepth 1 -iname "*.png" | head -n 1)
          fi

          if [ -n "$LOGO_SOURCE" ]; then
            echo "Found logo: $LOGO_SOURCE"
            cp "$LOGO_SOURCE" student_app/assets/logo.png
          else
            echo "Warning: No logo found. Using placeholder."
            echo -n "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > student_app/assets/logo.png
          fi

          # 2. SHARED MODELS
          mkdir -p shared/lib/models
          cat > shared/pubspec.yaml << 'SHAREDPUB'
          name: shared
          description: Shared
          version: 1.0.0
          environment:
            sdk: ">=3.0.0 <4.0.0"
          dependencies:
            crypto: ^3.0.3
          SHAREDPUB

          cat > shared/lib/announcement.dart << 'ANN'
          class Announcement {
            final String id;
            final String title;
            final String body;
            final String audience;
            final String animationType;
            final DateTime createdAt;
            Announcement({
              required this.id,
              required this.title,
              required this.body,
              required this.audience,
              required this.animationType,
              required this.createdAt,
            });
          }
          ANN

          # 3. STUDENT APP WIRING
          flutter create --org com.platinum --project-name student_app student_app
          mkdir -p student_app/lib/screens
          mkdir -p student_app/lib/services

          cat > student_app/pubspec.yaml << 'STUPUB'
          name: student_app
          description: Platinum Student
          version: 1.0.0+1
          environment:
            sdk: ">=3.0.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            shared:
              path: ../shared
            sqflite: ^2.3.0
            path: ^1.8.3
            confetti: ^0.7.0
            intl: ^0.19.0
          flutter:
            uses-material-design: true
            assets:
              - assets/
          STUPUB

          cat > student_app/lib/services/database_helper.dart << 'DBHELP'
          import 'package:sqflite/sqflite.dart';
          import 'package:path/path.dart';

          class DatabaseHelper {
            static final DatabaseHelper instance = DatabaseHelper._init();
            static Database? _database;

            DatabaseHelper._init();

            Future<Database> get database async {
              if (_database != null) return _database!;
              _database = await _initDB('platinum_student.db');
              return _database!;
            }

            Future<Database> _initDB(String filePath) async {
              final dbPath = await getDatabasesPath();
              final path = join(dbPath, filePath);
              return await openDatabase(path, version: 1, onCreate: _createDB);
            }

            Future _createDB(Database db, int version) async {
              await db.execute('''
                CREATE TABLE students (
                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                  fullName TEXT NOT NULL,
                  classLevel TEXT NOT NULL,
                  registeredAt TEXT NOT NULL
                )
              ''');
              await db.execute('''
                CREATE TABLE announcements (
                  id TEXT PRIMARY KEY,
                  title TEXT NOT NULL,
                  body TEXT NOT NULL,
                  audience TEXT NOT NULL,
                  animationType TEXT NOT NULL,
                  createdAt TEXT NOT NULL
                )
              ''');
            }
          }
          DBHELP

          cat > student_app/lib/main.dart << 'STUMAIN'
          import 'package:flutter/material.dart';
          import 'screens/registration.dart';
          import 'screens/home.dart';
          import 'services/database_helper.dart';

          void main() => runApp(const PlatinumStudentApp());

          class PlatinumStudentApp extends StatelessWidget {
            const PlatinumStudentApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Platinum Digital App',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  primaryColor: const Color(0xFF0A3D91),
                  appBarTheme: const AppBarTheme(
                    backgroundColor: Color(0xFF0A3D91),
                    foregroundColor: Colors.white,
                  ),
                ),
                home: const StartupScreen(),
              );
            }
          }

          class StartupScreen extends StatefulWidget {
            const StartupScreen({super.key});
            @override
            State<StartupScreen> createState() => _StartupScreenState();
          }

          class _StartupScreenState extends State<StartupScreen> {
            @override
            void initState() {
              super.initState();
              _checkRegistration();
            }

            Future<void> _checkRegistration() async {
              final db = await DatabaseHelper.instance.database;
              final result = await db.query('students', limit: 1);
              if (mounted) {
                if (result.isEmpty) {
                  Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const RegistrationScreen()));
                } else {
                  Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const HomeScreen()));
                }
              }
            }

            @override
            Widget build(BuildContext context) {
              return const Scaffold(body: Center(child: CircularProgressIndicator()));
            }
          }
          STUMAIN

          cat > student_app/lib/screens/registration.dart << 'REG'
          import 'package:flutter/material.dart';
          import '../services/database_helper.dart';
          import 'home.dart';

          class RegistrationScreen extends StatefulWidget {
            const RegistrationScreen({super.key});
            @override
            State<RegistrationScreen> createState() => _RegistrationScreenState();
          }

          class _RegistrationScreenState extends State<RegistrationScreen> {
            final _nameController = TextEditingController();
            String _selectedClass = 'S1';

            void _register() async {
              if (_nameController.text.isEmpty) return;
              final db = await DatabaseHelper.instance.database;
              await db.insert('students', {
                'fullName': _nameController.text,
                'classLevel': _selectedClass,
                'registeredAt': DateTime.now().toIso8601String(),
              });
              if (mounted) {
                Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const HomeScreen()));
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFFF5F7FA),
                body: SafeArea(
                  child: Padding(
                    padding: const EdgeInsets.all(24.0),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        const SizedBox(height: 20),
                        Center(
                          child: Column(
                            children: [
                              Image.asset('assets/logo.png', height: 100, width: 100, fit: BoxFit.contain),
                              const SizedBox(height: 16),
                              const Text('Student Registration',
                                style: TextStyle(fontSize: 24, fontWeight: FontWeight.bold, color: Color(0xFF0A3D91))),
                              const SizedBox(height: 8),
                              Text('Platinum Secondary School Kiteezi', style: TextStyle(color: Colors.grey[600])),
                            ],
                          ),
                        ),
                        const SizedBox(height: 30),
