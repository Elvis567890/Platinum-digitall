import 'package:flutter/material.dart';
import 'announcements.dart';
import 'coming_soon.dart';

class DashboardScreen extends StatelessWidget {
  final String role;
  final String name;
  const DashboardScreen({super.key, required this.role, required this.name});

  @override
  Widget build(BuildContext context) {
    final isSuper = role == 'super_admin';
    final isRelease = role == 'release_admin';

    return Scaffold(
      appBar: AppBar(title: Text('Admin — $name')),
      body: GridView.count(
        crossAxisCount: 2,
        padding: const EdgeInsets.all(16),
        mainAxisSpacing: 16,
        crossAxisSpacing: 16,
        children: [
          _tile(context, 'Post Announcement', Icons.campaign,
            const AnnouncementsScreen()),
          _tile(context, 'Submit Marks', Icons.edit_note,
            const ComingSoonScreen(featureName: 'Marks Submission')),
          _tile(context, 'Generate Reports', Icons.description,
            const ComingSoonScreen(featureName: 'Report Generation')),
          _tile(context, 'Release Reports', Icons.lock_open,
            isRelease ? const ComingSoonScreen(featureName: 'Release Reports')
              : const ComingSoonScreen(featureName: 'Release Admin Only')),
          _tile(context, 'Fee Management', Icons.payments,
            const ComingSoonScreen(featureName: 'Fee Management')),
          _tile(context, 'Chat Moderation', Icons.chat,
            const ComingSoonScreen(featureName: 'Chat Moderation')),
          if (isSuper)
            _tile(context, 'Manage Admins', Icons.admin_panel_settings,
              const ComingSoonScreen(featureName: 'Manage Admins')),
          if (isSuper)
            _tile(context, 'Manage Clubs', Icons.groups,
              const ComingSoonScreen(featureName: 'Manage Clubs')),
        ],
      ),
    );
  }

  Widget _tile(BuildContext context, String title, IconData icon, Widget screen) {
    return InkWell(
      onTap: () => Navigator.push(context, MaterialPageRoute(builder: (_) => screen)),
      child: Container(
        decoration: BoxDecoration(
          color: Colors.white,
          borderRadius: BorderRadius.circular(12),
          boxShadow: const [BoxShadow(color: Colors.black12, blurRadius: 6)],
        ),
        child: Column(
          mainAxisAlignment: MainAxisAlignment.center,
          children: [
            Icon(icon, size: 40, color: const Color(0xFFCC0000)),
            const SizedBox(height: 12),
            Padding(
              padding: const EdgeInsets.symmetric(horizontal: 8),
              child: Text(title, textAlign: TextAlign.center,
                style: const TextStyle(fontWeight: FontWeight.w600)),
            ),
          ],
        ),
      ),
    );
  }
}
