            void _toggleLike() async {
              final doc = FirebaseFirestore.instance.collection('feed_posts').doc(widget.id);
              await FirebaseFirestore.instance.runTransaction((transaction) async {
                final snapshot = await transaction.get(doc);
                List likedBy = List.from(snapshot['likedBy'] ?? []);
                if (likedBy.contains(widget.myName)) {
                  likedBy.remove(widget.myName);
                  transaction.update(doc, {'likes': FieldValue.increment(-1), 'likedBy': likedBy});
                } else {
                  likedBy.add(widget.myName);
                  transaction.update(doc, {'likes': FieldValue.increment(1), 'likedBy': likedBy});
                }
              });
            }

