  # ==========================================
  # JOB 2: BUILD THE STAFF HUB (ADMIN APP - DARK MODE)
  # ==========================================
  build-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Admin App Code
        run: |
          # 1. LOGO & SPLASH SETUP
          mkdir -p admin_app/assets
          LOGO_SOURCE=$(find . -maxdepth 1 -iname "*inshot*" | head -n 1)
          if [ -n "$LOGO_SOURCE" ] && [ -f "$LOGO_SOURCE" ]; then convert "$LOGO_SOURCE" -resize 1024x1024 admin_app/assets/logo.png; else printf "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > admin_app/assets/logo.png; fi

          # 2. CREATE PROJECT & GRADLE SETUP
          flutter create --org com.platinum --project-name admin_app admin_app
          mkdir -p admin_app/lib/screens
          mkdir -p admin_app/lib/services

          sed -i 's/android:label="admin_app"/android:label="Platinum Staff Hub"/g' admin_app/android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"\/>' admin_app/android/app/src/main/AndroidManifest.xml
          sed -i 's/distributionUrl=.*/distributionUrl=https\\:\/\/services.gradle.org\/distributions\/gradle-9.3.1-all.zip/g' admin_app/android/gradle/wrapper/gradle-wrapper.properties
          
          echo "android.newDsl=false" >> admin_app/android/gradle.properties
          echo "android.builtInKotlin=false" >> admin_app/android/gradle.properties

          cat > admin_app/android/app/build.gradle.kts << 'GRADLEKTS'
          plugins {
              id("com.android.application")
              id("dev.flutter.flutter-gradle-plugin")
          }
          configure<com.android.build.api.dsl.ApplicationExtension> {
              namespace = "com.platinum.admin_app"
              compileSdk = 36
              ndkVersion = "27.0.12077973"
              lint { checkReleaseBuilds = false; abortOnError = false }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              defaultConfig { applicationId = "com.platinum.admin_app"; minSdk = 21; targetSdk = 36; versionCode = flutter.versionCode; versionName = flutter.versionName }
              buildTypes { release { signingConfig = signingConfigs.getByName("debug") } }
          }
          flutter { source = "../.." }
          GRADLEKTS

          # 3. DEPENDENCIES
          cd admin_app
          flutter pub add sqflite path image_picker intl google_fonts
          flutter pub add --dev flutter_launcher_icons flutter_native_splash

          cat >> pubspec.yaml << 'ADMINPUB'
          flutter_launcher_icons:
            android: "launcher_icon"
            image_path: "assets/logo.png"
          flutter_native_splash:
            color: "#121212"
            image: assets/logo.png
            web: false
            android_12:
              image: assets/logo.png
              icon_background_color: "#121212"
          ADMINPUB

          # 4. WRITE ADMIN CODE
          cat > lib/services/database_helper.dart << 'DBHELP'
          import 'package:sqflite/sqflite.dart';
          import 'package:path/path.dart';
          class DatabaseHelper {
            static final DatabaseHelper instance = DatabaseHelper._init();
            static Database? _database;
            DatabaseHelper._init();
            Future<Database> get database async { if (_database != null) return _database!; _database = await _initDB('platinum_staff.db'); return _database!; }
            Future<Database> _initDB(String filePath) async { final dbPath = await getDatabasesPath(); return await openDatabase(join(dbPath, filePath), version: 1, onCreate: _createDB); }
            Future _createDB(Database db, int version) async { await db.execute('CREATE TABLE staff (id INTEGER PRIMARY KEY AUTOINCREMENT, staffId TEXT, name TEXT, pin TEXT, role TEXT)'); }
          }
