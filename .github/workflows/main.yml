          import 'package:flutter/material.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'chat.dart';

          class HubScreen extends StatefulWidget {
            final String name;
            const HubScreen({super.key, required this.name});
            @override
            State<HubScreen> createState() => _HubScreenState();
          }

          class _HubScreenState extends State<HubScreen> with SingleTickerProviderStateMixin {
            late TabController _tabController;
            List<String> _subscribed = [];
            bool _loading = true;

            @override
            void initState() {
              super.initState();
              _tabController = TabController(length: 2, vsync: this);
              _loadSubscriptions();
            }

            Future<void> _loadSubscriptions() async {
              final prefs = await SharedPreferences.getInstance();
              setState(() {
                _subscribed = prefs.getStringList('subscribedGroups') ?? ['All'];
                _loading = false;
              });
            }

            Future<void> _toggleSub(String groupName) async {
              final prefs = await SharedPreferences.getInstance();
              setState(() {
                if (_subscribed.contains(groupName)) {
                  _subscribed.remove(groupName);
                } else {
                  _subscribed.add(groupName);
                }
              });
              await prefs.setStringList('subscribedGroups', _subscribed);
            }

            @override
            void dispose() {
              _tabController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              if (_loading) return const Scaffold(body: Center(child: CircularProgressIndicator(color: Color(0xFFD4AF37))));

              return Scaffold(
                appBar: AppBar(
                  title: const Text('Groups Hub', style: TextStyle(fontWeight: FontWeight.bold, color: Color(0xFFD4AF37))),
                  bottom: TabBar(
                    controller: _tabController,
                    indicatorColor: const Color(0xFFD4AF37),
                    labelColor: const Color(0xFFD4AF37),
                    unselectedLabelColor: Colors.grey,
                    tabs: const [Tab(text: 'My Groups'), Tab(text: 'Discover')],
                  ),
                ),
                body: TabBarView(
                  controller: _tabController,
                  children: [
                    _buildMyGroups(),
                    _buildDiscover(),
                  ],
                ),
              );
            }

            Widget _buildMyGroups() {
              if (_subscribed.isEmpty) {
                return const Center(child: Text('You haven\'t joined any groups yet.\nGo to Discover to find groups!', textAlign: TextAlign.center, style: TextStyle(color: Colors.grey)));
              }
              return ListView.builder(
                padding: const EdgeInsets.all(16),
                itemCount: _subscribed.length,
                itemBuilder: (c, i) {
                  final group = _subscribed[i];
                  return Container(
                    margin: const EdgeInsets.only(bottom: 12),
                    decoration: BoxDecoration(
                      color: const Color(0xFF131A26),
                      borderRadius: BorderRadius.circular(16),
                      border: Border.all(color: Colors.white.withOpacity(0.05)),
                    ),
                    child: ListTile(
                      contentPadding: const EdgeInsets.symmetric(horizontal: 16, vertical: 8),
                      leading: CircleAvatar(
                        backgroundColor: const Color(0xFFD4AF37).withOpacity(0.1),
                        child: const Icon(Icons.forum, color: Color(0xFFD4AF37)),
                      ),
                      title: Text(group == 'All' ? 'Whole School Chat' : '$group Chat', style: const TextStyle(fontWeight: FontWeight.bold)),
                      subtitle: Text(group == 'All' ? 'Open Group' : 'Club Group', style: const TextStyle(color: Colors.grey, fontSize: 12)),
                      trailing: ElevatedButton(
                        style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF1A365D), foregroundColor: Colors.white, shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(8))),
                        onPressed: () => Navigator.push(context, MaterialPageRoute(builder: (_) => ChatScreen(room: group, user: widget.name))),
                        child: const Text('Open Chat'),
                      ),
                    ),
                  );
                },
              );
            }

            Widget _buildDiscover() {
              return StreamBuilder<QuerySnapshot>(
                stream: FirebaseFirestore.instance.collection('clubs').snapshots(),
                builder: (c, snapshot) {
                  if (!snapshot.hasData) return const Center(child: CircularProgressIndicator(color: Color(0xFFD4AF37)));
                  
                  final clubs = snapshot.data!.docs.map((d) => d['name'] as String).toList();
                  final allGroups = ['All', 'S1', 'S2', 'S3', 'S4', 'S5', 'S6', ...clubs];

                  return ListView.builder(
                    padding: const EdgeInsets.all(16),
                    itemCount: allGroups.length,
                    itemBuilder: (c, i) {
                      final group = allGroups[i];
                      final isSubscribed = _subscribed.contains(group);
                      final isClass = group.startsWith('S') && group.length == 2;
                      final isSchool = group == 'All';

                      return Container(
                        margin: const EdgeInsets.only(bottom: 12),
                        decoration: BoxDecoration(
                          color: const Color(0xFF131A26),
                          borderRadius: BorderRadius.circular(16),
                          border: Border.all(color: Colors.white.withOpacity(0.05)),
                        ),
                        child: ListTile(
                          contentPadding: const EdgeInsets.symmetric(horizontal: 16, vertical: 8),
                          leading: CircleAvatar(
                            backgroundColor: Colors.white.withOpacity(0.05),
                            child: Icon(isSchool ? Icons.public : (isClass ? Icons.school : Icons.groups), color: Colors.grey),
                          ),
                          title: Text(isSchool ? 'Whole School' : (isClass ? '$group Class Group' : group), style: const TextStyle(fontWeight: FontWeight.bold)),
                          subtitle: Text(isSchool ? 'Public • No teachers' : (isClass ? 'Private • Teacher monitored' : 'Club • Peer-to-peer'), style: const TextStyle(color: Colors.grey, fontSize: 12)),
                          trailing: isSubscribed
                              ? OutlinedButton(
                                  style: OutlinedButton.styleFrom(foregroundColor: Colors.grey, side: const BorderSide(color: Colors.grey)),
                                  onPressed: () => _toggleSub(group),
                                  child: const Text('Subscribed'),
                                )
                              : ElevatedButton(
                                  style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFD4AF37), foregroundColor: Colors.black),
                                  onPressed: () => _toggleSub(group),
                                  child: const Text('Subscribe'),
                                ),
                        ),
                      );
                    },
                  );
                },
              );
            }
          }
