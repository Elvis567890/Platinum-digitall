          cat > lib/screens/manage_timetable.dart << 'EOF'
          import 'package:flutter/material.dart'; import 'package:cloud_firestore/cloud_firestore.dart';
          
          class ManageTimetableScreen extends StatefulWidget { const ManageTimetableScreen({super.key}); @override State<ManageTimetableScreen> createState() => _ManageTimetableScreenState(); }
          class _ManageTimetableScreenState extends State<ManageTimetableScreen> {
            String _selectedClass = 'S1';
            String _selectedDay = 'Monday';
            final _timeCtrl = TextEditingController();
            final _subjectCtrl = TextEditingController();
            bool _loading = false;

            void _addPeriod() async {
              if (_timeCtrl.text.isEmpty || _subjectCtrl.text.isEmpty) return;
              setState(() => _loading = true);
              
              try {
                final existing = await FirebaseFirestore.instance.collection('timetables').doc(_selectedClass).collection('periods')
                    .where('day', isEqualTo: _selectedDay)
                    .where('time', isEqualTo: _timeCtrl.text.trim())
                    .get();
                
                if (existing.docs.isNotEmpty) {
                  throw "A period already exists at $_selectedDay ${_timeCtrl.text.trim()}!";
                }

                await FirebaseFirestore.instance.collection('timetables').doc(_selectedClass).collection('periods').add({
                  'day': _selectedDay,
                  'time': _timeCtrl.text.trim(),
                  'subject': _subjectCtrl.text.trim(),
                  'order': DateTime.now().millisecondsSinceEpoch,
                });
                
                _timeCtrl.clear();
                _subjectCtrl.clear();
                if (mounted) ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Period Added!'), backgroundColor: Colors.green));
              } catch (e) {
                if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(e.toString(), style: const TextStyle(color: Colors.white)), backgroundColor: Colors.red));
              } finally {
                setState(() => _loading = false);
              }
            }

            void _deletePeriod(String docId) async {
              await FirebaseFirestore.instance.collection('timetables').doc(_selectedClass).collection('periods').doc(docId).delete();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Digital Timetable Editor')),
                body: Column(
                  children: [
                    Padding(
                      padding: const EdgeInsets.all(16),
                      child: Column(
                        children: [
                          DropdownButtonFormField<String>(value: _selectedClass, decoration: const InputDecoration(labelText: 'Select Class'), items: ['S1','S2','S3','S4','S5','S6'].map((c) => DropdownMenuItem(value: c, child: Text(c))).toList(), onChanged: (v) => setState(() => _selectedClass = v!)), const SizedBox(height: 16),
                          Row(children: [
                            Expanded(flex: 2, child: DropdownButtonFormField<String>(value: _selectedDay, decoration: const InputDecoration(labelText: 'Day'), items: ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map((c) => DropdownMenuItem(value: c, child: Text(c))).toList(), onChanged: (v) => setState(() => _selectedDay = v!))),
                            const SizedBox(width: 10),
                            Expanded(flex: 2, child: TextField(controller: _timeCtrl, decoration: const InputDecoration(labelText: 'Time (e.g. 8:00 - 9:00)'))),
                          ]), const SizedBox(height: 16),
                          TextField(controller: _subjectCtrl, decoration: const InputDecoration(labelText: 'Subject & Teacher (e.g. Math - Mr. Okello)')), const SizedBox(height: 16),
                          SizedBox(width: double.infinity, height: 50, child: ElevatedButton.icon(style: ElevatedButton.styleFrom(backgroundColor: Colors.green), onPressed: _loading ? null : _addPeriod, icon: const Icon(Icons.add), label: const Text('ADD PERIOD TO TIMETABLE'))),
                        ],
                      ),
                    ),
                    const Divider(color: Colors.grey),
                    Expanded(
                      child: StreamBuilder<QuerySnapshot>(
                        stream: FirebaseFirestore.instance.collection('timetables').doc(_selectedClass).collection('periods').orderBy('order').snapshots(),
                        builder: (c, s) {
                          if (!s.hasData) return const Center(child: CircularProgressIndicator());
                          if (s.data!.docs.isEmpty) return const Center(child: Text('No periods added yet.', style: TextStyle(color: Colors.grey)));
                          
                          return ListView.builder(
                            itemCount: s.data!.docs.length,
                            itemBuilder: (c, i) {
                              final doc = s.data!.docs[i];
                              final d = doc.data() as Map<String, dynamic>;
                              return ListTile(
                                leading: const Icon(Icons.schedule, color: Color(0xFFD4AF37)),
                                title: Text('${d['subject']}', style: const TextStyle(fontWeight: FontWeight.bold)),
                                subtitle: Text('${d['day']} | ${d['time']}'),
                                trailing: IconButton(icon: const Icon(Icons.delete, color: Colors.red), onPressed: () => _deletePeriod(doc.id)),
                              );
                            },
                          );
                        },
                      ),
                    ),
                  ],
                ),
              );
            }
          }
          EOF

