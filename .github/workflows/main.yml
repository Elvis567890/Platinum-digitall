name: Build Platinum Ecosystem (Final Complete Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1: BUILD THE STUDENT APP
  # ==========================================
  build-student:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Student App Code
        run: |
          mkdir -p student_app/assets
          LOGO_SOURCE=$(find . -maxdepth 1 -iname "*inshot*" | head -n 1)
          if [ -n "$LOGO_SOURCE" ] && [ -f "$LOGO_SOURCE" ]; then convert "$LOGO_SOURCE" -resize 1024x1024 student_app/assets/logo.png; else printf "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > student_app/assets/logo.png; fi

          flutter create --org com.platinum --project-name student_app student_app
          mkdir -p student_app/lib/screens
          mkdir -p student_app/lib/models
          mkdir -p student_app/lib/services

          # 🔴 THE DEFINITIVE AGP/GRADLE FIX 🔴
          sed -i 's/distributionUrl=.*/distributionUrl=https\\:\/\/services.gradle.org\/distributions\/gradle-8.4-all.zip/g' student_app/android/gradle/wrapper/gradle-wrapper.properties
          
          if [ -f student_app/android/settings.gradle ]; then
            sed -i 's/id "com.android.application" version ".*"/id "com.android.application" version "8.3.0"/g' student_app/android/settings.gradle
            sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "1.9.22"/g' student_app/android/settings.gradle
          fi

          if [ -f student_app/android/build.gradle ]; then
            sed -i 's/classpath .com.android.tools.build:gradle:.*/classpath "com.android.tools.build:gradle:8.3.0"/g' student_app/android/build.gradle
          fi

          sed -i 's/android:label="student_app"/android:label="Platinum Pulse"/g' student_app/android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.CAMERA"\/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"\/>' student_app/android/app/src/main/AndroidManifest.xml
          
          cat > student_app/android/app/build.gradle << 'APPGRADLE'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
              id "com.google.gms.google-services"
          }
          android {
              namespace = "com.platinum.student_app"
              compileSdk = 36
              ndkVersion = "27.0.12077973"
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              defaultConfig {
                  applicationId = "com.platinum.student_app"
                  minSdk = 23
                  targetSdk = 36
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
                  multiDexEnabled = true
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.debug
                  }
              }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }
          flutter {
              source = "../.."
          }
          dependencies {
              implementation platform("com.google.firebase:firebase-bom:35.0.2")
              implementation "com.google.firebase:firebase-analytics"
          }
          APPGRADLE

          cd student_app
          flutter pub add firebase_core cloud_firestore firebase_storage image_picker video_player cached_network_image path_provider dio google_fonts sqflite path jitsi_meet_flutter_sdk url_launcher file_picker
          flutter pub add --dev flutter_launcher_icons flutter_native_splash

          cat >> pubspec.yaml << 'STUPUB'
          flutter_launcher_icons:
            android: "launcher_icon"
            image_path: "assets/logo.png"
          flutter_native_splash:
            color: "#0A3D91"
            image: assets/logo.png
            web: false
            android_12:
              image: assets/logo.png
              icon_background_color: "#0A3D91"
          STUPUB

          # ==========================================
          # STUDENT DART CODE
          # ==========================================
          cat > lib/models/post_model.dart << 'MODEL'
          import 'package:cloud_firestore/cloud_firestore.dart';
          class Post {
            final String id; final String author; final String content; final String type; final String? mediaUrl; final DateTime timestamp; final List<String> likes; final int commentCount;
            Post({required this.id, required this.author, required this.content, required this.type, this.mediaUrl, required this.timestamp, required this.likes, required this.commentCount});
            factory Post.fromFirestore(DocumentSnapshot doc) {
              Map data = doc.data() as Map<String, dynamic>;
              return Post(id: doc.id, author: data['author'] ?? 'Unknown', content: data['content'] ?? '', type: data['type'] ?? 'text', mediaUrl: data['mediaUrl'], timestamp: (data['timestamp'] as Timestamp).toDate(), likes: List<String>.from(data['likes'] ?? []), commentCount: data['commentCount'] ?? 0);
            }
          }
          MODEL

          cat > lib/services/database_helper.dart << 'DBHELP'
          import 'package:sqflite/sqflite.dart';
          import 'package:path/path.dart';
          class DatabaseHelper {
            static final DatabaseHelper instance = DatabaseHelper._init();
            static Database? _database;
            DatabaseHelper._init();
            Future<Database> get database async { if (_database != null) return _database!; _database = await _initDB('platinum_student.db'); return _database!; }
            Future<Database> _initDB(String filePath) async { final dbPath = await getDatabasesPath(); return await openDatabase(join(dbPath, filePath), version: 1, onCreate: _createDB); }
            Future _createDB(Database db, int version) async { await db.execute('CREATE TABLE students (id INTEGER PRIMARY KEY AUTOINCREMENT, fullName TEXT, classLevel TEXT)'); }
            Future<Map<String, dynamic>> getStudent() async { final db = await database; final res = await db.query('students', limit: 1); return res.isNotEmpty ? res.first : {}; }
          }
          DBHELP

          cat > lib/main.dart << 'STUMAIN'
          import 'package:flutter/material.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:google_fonts/google_fonts.dart';
          import 'screens/registration.dart';
          import 'screens/home.dart';
          import 'services/database_helper.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Firebase.initializeApp(options: const FirebaseOptions(apiKey: "AIzaSyDNQ2VcWL2_Q6rkbu5TGBGqOATBxP8B5DY", authDomain: "platinum-pulse.firebaseapp.com", projectId: "platinum-pulse", storageBucket: "platinum-pulse.firebasestorage.app", messagingSenderId: "221762575431", appId: "1:221762575431:web:95054f123b6a98647f6562"));
            runApp(const PlatinumStudentApp());
          }

          class PlatinumStudentApp extends StatelessWidget {
            const PlatinumStudentApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(title: 'Platinum Pulse', debugShowCheckedModeBanner: false, theme: ThemeData(primaryColor: const Color(0xFF0A3D91), scaffoldBackgroundColor: const Color(0xFFF4F7FC), useMaterial3: true, textTheme: GoogleFonts.poppinsTextTheme(Theme.of(context).textTheme)), home: const StartupScreen());
            }
          }

          class StartupScreen extends StatefulWidget {
            const StartupScreen({super.key});
            @override State<StartupScreen> createState() => _StartupScreenState();
          }
          class _StartupScreenState extends State<StartupScreen> {
            @override void initState() { super.initState(); _check(); }
            Future<void> _check() async {
              final db = await DatabaseHelper.instance.database;
              final result = await db.query('students', limit: 1);
              if (mounted) Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => result.isEmpty ? const RegistrationScreen() : const HomeScreen()));
            }
            @override Widget build(BuildContext context) => const Scaffold(body: Center(child: CircularProgressIndicator(color: Color(0xFF0A3D91))));
          }
          STUMAIN

          cat > lib/screens/registration.dart << 'REG'
          import 'package:flutter/material.dart';
          import '../services/database_helper.dart';
          import 'home.dart';
          class RegistrationScreen extends StatefulWidget {
            const RegistrationScreen({super.key});
            @override State<RegistrationScreen> createState() => _RegistrationScreenState();
          }
          class _RegistrationScreenState extends State<RegistrationScreen> {
            final _name = TextEditingController(); String _class = 'S1';
            void _register() async {
              if (_name.text.isEmpty) return;
              await (await DatabaseHelper.instance.database).insert('students', {'fullName': _name.text, 'classLevel': _class});
              if (mounted) Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const HomeScreen()));
            }
            @override Widget build(BuildContext context) {
              return Scaffold(body: Container(decoration: const BoxDecoration(gradient: LinearGradient(begin: Alignment.topCenter, end: Alignment.bottomCenter, colors: [Color(0xFF0A3D91), Color(0xFF051C45)])), child: Center(child: SingleChildScrollView(padding: const EdgeInsets.all(24), child: Card(elevation: 10, shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(20)), child: Padding(padding: const EdgeInsets.all(32), child: Column(mainAxisSize: MainAxisSize.min, children: [
                Image.asset('assets/logo.png', height: 100), const SizedBox(height: 16), const Text('Student Registration', style: TextStyle(fontSize: 24, fontWeight: FontWeight.bold, color: Color(0xFF0A3D91))), const SizedBox(height: 32),
                TextField(controller: _name, decoration: const InputDecoration(labelText: 'Full Name', prefixIcon: Icon(Icons.person))), const SizedBox(height: 16),
                DropdownButtonFormField<String>(value: _class, decoration: const InputDecoration(labelText: 'Class', prefixIcon: Icon(Icons.school)), items: ['S1', 'S2', 'S3', 'S4', 'S5', 'S6'].map((c) => DropdownMenuItem(value: c, child: Text(c))).toList(), onChanged: (v) => setState(() => _class = v!)), const SizedBox(height: 32),
                SizedBox(width: double.infinity, height: 50, child: ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFF4B41A)), onPressed: _register, child: const Text('Register', style: TextStyle(fontSize: 18, color: Colors.white, fontWeight: FontWeight.bold)))),
              ])))))));
            }
          }
          REG

          cat > lib/screens/home.dart << 'HOME'
          import 'package:flutter/material.dart';
          import 'announcements.dart';
          import 'platinum_pulse.dart';
          import 'study_hub.dart';
          import 'reports.dart';
          import 'hub.dart';
          import '../services/database_helper.dart';

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});
            @override State<HomeScreen> createState() => _HomeScreenState();
          }
          class _HomeScreenState extends State<HomeScreen> {
            int _index = 0; String _name = 'Loading...'; String _class = '';
            
            @override void initState() { super.initState(); _loadUser(); }
            void _loadUser() async { 
              final data = await DatabaseHelper.instance.getStudent(); 
              if (mounted && data.isNotEmpty) setState(() { _name = data['fullName']; _class = data['classLevel']; }); 
            }

            @override Widget build(BuildContext context) {
              final pages = [
                AnnouncementsScreen(studentName: _name, studentClass: _class), 
                PlatinumPulseScreen(studentName: _name), 
                StudyHubScreen(), 
                ReportsScreen(), 
                HubScreen(studentClass: _class, studentName: _name)
              ];
              
              return Scaffold(
                body: _index == 0 ? pages[0] : pages[_index], 
                bottomNavigationBar: Container(
                  decoration: BoxDecoration(boxShadow: [BoxShadow(color: Colors.black.withOpacity(0.05), blurRadius: 10, offset: const Offset(0, -5))]), 
                  child: BottomNavigationBar(
                    currentIndex: _index, 
                    onTap: (i) => setState(() => _index = i), 
                    selectedItemColor: const Color(0xFF0A3D91), 
                    unselectedItemColor: Colors.grey, 
                    type: BottomNavigationBarType.fixed, 
                    backgroundColor: Colors.white, 
                    elevation: 0, 
                    items: const [
                      BottomNavigationBarItem(icon: Icon(Icons.campaign), label: 'Updates'),
                      BottomNavigationBarItem(icon: Icon(Icons.dynamic_feed), label: 'Pulse'), 
                      BottomNavigationBarItem(icon: Icon(Icons.school), label: 'Study'), 
                      BottomNavigationBarItem(icon: Icon(Icons.description), label: 'Reports'), 
                      BottomNavigationBarItem(icon: Icon(Icons.grid_view), label: 'Hub'),
                    ]
                  ),
                ),
              );
            }
          }
          HOME

          cat > lib/screens/announcements.dart << 'ANN'
          import 'package:flutter/material.dart';

          class AnnouncementsScreen extends StatelessWidget {
