                appBar: AppBar(backgroundColor: const Color(0xFF0B0F19), title: const Text('Omicron Network', style: TextStyle(color: Color(0xFFD4AF37), fontWeight: FontWeight.bold))),
                body: Column(
                  children: [
                    Container(
                      margin: const EdgeInsets.all(16), padding: const EdgeInsets.all(16),
                      decoration: BoxDecoration(color: const Color(0xFF131A26), borderRadius: BorderRadius.circular(16), border: Border.all(color: const Color(0xFFD4AF37).withOpacity(0.5))),
                      child: const Row(children: [
                        Icon(Icons.workspace_premium, color: Color(0xFFD4AF37), size: 40),
                        SizedBox(width: 16),
                        Expanded(child: Text('Welcome to the OGs. This is an exclusive space for Omicron alumni only.', style: TextStyle(color: Colors.white))),
                      ]),
                    ),
                    Expanded(
                      child: StreamBuilder<QuerySnapshot>(
                        stream: FirebaseFirestore.instance.collection('students').where('classLevel', isEqualTo: 'Omicron').snapshots(),
                        builder: (c, s) {
                          if (!s.hasData) return const Center(child: CircularProgressIndicator());
                          final others = s.data!.docs.where((doc) => doc['unitCode'] != myCode).toList();
