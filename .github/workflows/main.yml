name: Build Platinum Ecosystem (Ultimate Real App)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: STUDENT APP (Platinum Digital Hub)
  # ==========================================
  build-student:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
          
      - uses: actions/setup-java@v4
        with: {distribution: 'zulu', java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.24.5', channel: stable, cache: true}

      - name: Find and Convert Logo
        run: |
          IMG_PATH=$(find . -maxdepth 1 -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) ! -name "logo.png" | head -n 1)
          if [ -z "$IMG_PATH" ]; then echo "Error: No logo found!"; exit 1; fi
          sudo apt-get update && sudo apt-get install -y imagemagick-6.q16
          mkdir -p student_app/assets student_app/android/app/src/main/res/mipmap-xxxhdpi
          convert "$IMG_PATH" student_app/assets/logo.png
          convert "$IMG_PATH" student_app/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Generate Student App
        run: |
          mkdir -p student_app/lib/screens
          mkdir -p student_app/lib/services
          mkdir -p student_app/android/app/src/main/res/xml
          mkdir -p student_app/android/app/src/main/res/values
          mkdir -p student_app/android/app/src/main/res/drawable
          mkdir -p student_app/android/app/src/main/kotlin/com/afrinode/platinum
          mkdir -p student_app/android/gradle/wrapper
          
          cat > student_app/android/app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar"><item name="android:windowBackground">@drawable/launch_background</item></style>
              <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar"><item name="android:windowBackground">?android:colorBackground</item></style>
          </resources>
          EOF

          cat > student_app/android/app/src/main/res/drawable/launch_background.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:drawable="@android:color/white" /></layer-list>
          EOF

          cat > student_app/android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools" package="com.afrinode.platinum">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application android:label="Platinum Digital Hub" android:name="${applicationName}" android:icon="@mipmap/ic_launcher" tools:replace="android:label">
                  <meta-data android:name="flutterEmbedding" android:value="2" />
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop" android:theme="@style/LaunchTheme" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode" android:hardwareAccelerated="true" android:windowSoftInputMode="adjustResize">
                      <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme"/>
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > student_app/android/app/src/main/kotlin/com/afrinode/platinum/MainActivity.kt << 'EOF'
          package com.afrinode.platinum
          import io.flutter.embedding.android.FlutterActivity
          class MainActivity: FlutterActivity() { }
          EOF

          cat > student_app/android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-all.zip
          EOF

          cat > student_app/android/settings.gradle << 'EOF'
          pluginManagement { def flutterSdkPath = { def properties = new Properties(); file("local.properties").withInputStream { properties.load(it) }; def flutterSdkPath = properties.getProperty("flutter.sdk"); assert flutterSdkPath != null, "flutter.sdk not set"; return flutterSdkPath }(); includeBuild("$flutterSdkPath/packages/flutter_tools/gradle"); repositories { google(); mavenCentral(); gradlePluginPortal() } }
          plugins { id "dev.flutter.flutter-plugin-loader" version "1.0.0"; id "com.android.application" version "8.9.1" apply false; id "org.jetbrains.kotlin.android" version "2.3.0" apply false }
          include ":app"
          EOF

          cat > student_app/android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4G
          android.useAndroidX=true
          android.enableJetifier=false
          android.enableResourceShrinker=false
          EOF

          cat > student_app/android/build.gradle << 'EOF'
          allprojects { repositories { google(); mavenCentral(); maven { url "https://github.com/jitsi/jitsi-maven-repository/raw/master/releases" } } }
          rootProject.buildDir = '../build'
          subprojects { project.buildDir = "${rootProject.buildDir}/${project.name}" }
          subprojects { project.evaluationDependsOn(':app') }
          tasks.register("clean", Delete) { delete rootProject.buildDir }
          EOF

          cat > student_app/android/app/build.gradle << 'EOF'
          plugins { id "com.android.application"; id "kotlin-android"; id "dev.flutter.flutter-gradle-plugin" }
          android { 
              namespace = "com.afrinode.platinum"; 
              compileSdk = 36; 
              compileOptions { 
                  sourceCompatibility = JavaVersion.VERSION_17; 
                  targetCompatibility = JavaVersion.VERSION_17; 
                  coreLibraryDesugaringEnabled true 
              }; 
              kotlinOptions { jvmTarget = "17" }; 
              defaultConfig { applicationId = "com.afrinode.platinum"; minSdk = 24; targetSdk = 34; versionCode = flutter.versionCode; versionName = flutter.versionName; multiDexEnabled = true }; 
              buildTypes { release { signingConfig = signingConfigs.debug; minifyEnabled = false; shrinkResources = false } } 
          }
          flutter { source = "../.." }
          dependencies { 
              implementation platform("com.google.firebase:firebase-bom:35.0.2"); 
              implementation "com.google.firebase:firebase-analytics"; 
              implementation "androidx.core:core:1.12.0";
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
          }
          EOF

          cat > student_app/pubspec.yaml << 'EOF'
          name: student_app
          environment: {sdk: '>=3.4.0 <4.0.0'}
          dependencies:
            flutter: {sdk: flutter}
            firebase_core: ^3.1.0
            firebase_auth: ^5.1.0
            cloud_firestore: ^5.0.1
            image_picker: ^1.1.2
            video_player: ^2.9.1
            cached_network_image: ^3.3.1
            google_fonts: ^6.2.1
            shared_preferences: ^2.2.3
            timeago: ^3.7.0
            file_picker: 10.1.2
            audioplayers: ^6.0.0
            url_launcher: ^6.3.0
            http: ^1.2.1
            path_provider: ^2.1.3
            jitsi_meet_flutter_sdk: 10.3.0
            device_info_plus: ^10.1.0
            firebase_messaging: ^15.0.1
            flutter_local_notifications: ^17.1.2
          dependency_overrides: {web: 1.1.1}
          flutter: {uses-material-design: true, assets: [assets/logo.png]}
          EOF

          cd student_app

          cat > lib/services/telegram_service.dart << 'EOF'
          import 'dart:io'; import 'package:http/http.dart' as http; import 'dart:convert'; import 'package:cloud_firestore/cloud_firestore.dart';
          class TelegramService {
            static String? _cachedToken; static String? _cachedChatId;
            static Future<void> _loadCredentials() async { if (_cachedToken != null && _cachedChatId != null) return; final doc = await FirebaseFirestore.instance.collection('settings').doc('telegram').get(); if (doc.exists) { _cachedToken = doc.data()?['token']; _cachedChatId = doc.data()?['chat_id']; } }
            static Future<String?> uploadFile(File file, String type) async {
              await _loadCredentials(); if (_cachedToken == null || _cachedChatId == null) throw 'Telegram settings missing.';
              String endpoint = 'sendDocument'; String fileField = 'document'; if (type == 'image') { endpoint = 'sendPhoto'; fileField = 'photo'; } else if (type == 'video') { endpoint = 'sendVideo'; fileField = 'video'; } else if (type == 'audio') { endpoint = 'sendAudio'; fileField = 'audio'; }
              var request = http.MultipartRequest('POST', Uri.parse('https://api.telegram.org/bot$_cachedToken/$endpoint')); request.fields['chat_id'] = _cachedChatId!; request.files.add(await http.MultipartFile.fromPath(fileField, file.path));
              var response = await request.send(); var responseData = await response.stream.bytesToString(); var jsonResponse = jsonDecode(responseData);
              if (jsonResponse['ok'] == true) { var result = jsonResponse['result']; if (type == 'image') return result['photo'].last['file_id']; if (type == 'video') return result['video']['file_id']; if (type == 'audio') return result['audio']['file_id']; return result['document']['file_id']; } else { throw jsonResponse['description'] ?? 'Upload failed'; }
            }
            static Future<String?> getFileUrl(String fileId) async { await _loadCredentials(); if (_cachedToken == null) return null; final res = await http.get(Uri.parse('https://api.telegram.org/bot$_cachedToken/getFile?file_id=$fileId')); final data = jsonDecode(res.body); if (data['ok'] == true) { return 'https://api.telegram.org/file/bot$_cachedToken/${data['result']['file_path']}'; } return null; }
          }
          EOF

          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart'; import 'package:firebase_core/firebase_core.dart'; import 'package:firebase_auth/firebase_auth.dart'; import 'package:firebase_messaging/firebase_messaging.dart'; import 'package:google_fonts/google_fonts.dart'; import 'package:shared_preferences/shared_preferences.dart'; import 'screens/login.dart'; import 'screens/home.dart';
          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Firebase.initializeApp(options: const FirebaseOptions(apiKey: "AIzaSyDl-dfyyRT9kdxJOCm4ZM6QYmnY1cgXI0M", appId: "1:374715668746:android:b985232e1b3a6d0d4342f3", messagingSenderId: "374715668746", projectId: "payment-sas", storageBucket: "payment-sas.firebasestorage.app"));
            if (FirebaseAuth.instance.currentUser == null) { await FirebaseAuth.instance.signInAnonymously(); }
            await FirebaseMessaging.instance.requestPermission(alert: true, badge: true, sound: true);
            await FirebaseMessaging.instance.subscribeToTopic('students');
            runApp(const App());
          }
          class App extends StatelessWidget { const App({super.key}); @override Widget build(BuildContext context) { return MaterialApp(debugShowCheckedModeBanner: false, theme: ThemeData(brightness: Brightness.light, primaryColor: const Color(0xFFC62828), scaffoldBackgroundColor: const Color(0xFFF9F9F9), useMaterial3: true, textTheme: GoogleFonts.outfitTextTheme(Theme.of(context).textTheme.apply(bodyColor: Colors.black87)), appBarTheme: const AppBarTheme(backgroundColor: Colors.white, elevation: 0, centerTitle: true, iconTheme: IconThemeData(color: Colors.black)), cardTheme: const CardTheme(color: Colors.white, elevation: 0, margin: EdgeInsets.zero, shape: RoundedRectangleBorder(borderRadius: BorderRadius.all(Radius.circular(16)))), inputDecorationTheme: InputDecorationTheme(filled: true, fillColor: const Color(0xFFF0F0F0), border: const OutlineInputBorder(borderRadius: BorderRadius.all(Radius.circular(14)), borderSide: BorderSide.none)), elevatedButtonTheme: ElevatedButtonThemeData(style: ElevatedButton.styleFrom(minimumSize: const Size(0, 48), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14)), backgroundColor: const Color(0xFFC62828), foregroundColor: Colors.white)), bottomNavigationBarTheme: const BottomNavigationBarThemeData(backgroundColor: Colors.white, selectedItemColor: Color(0xFFC62828), unselectedItemColor: Colors.grey)), home: const StartScreen()); } }
          class StartScreen extends StatefulWidget { const StartScreen({super.key}); @override State<StartScreen> createState() => _StartScreenState(); }
          class _StartScreenState extends State<StartScreen> { @override void initState() { super.initState(); _init(); } Future<void> _init() async { final prefs = await SharedPreferences.getInstance(); final isLoggedIn = prefs.getBool('isLoggedIn') ?? false; if (mounted) Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => isLoggedIn ? const HomeScreen() : const LoginScreen())); } @override Widget build(BuildContext context) => const Scaffold(body: Center(child: CircularProgressIndicator())); }
          EOF

          cat > lib/screens/login.dart << 'EOF'
          import 'package:flutter/material.dart'; import 'package:cloud_firestore/cloud_firestore.dart'; import 'package:shared_preferences/shared_preferences.dart'; import 'package:device_info_plus/device_info_plus.dart'; import 'dart:io'; import 'home.dart'; import 'find_code.dart';
          class LoginScreen extends StatefulWidget { const LoginScreen({super.key}); @override State<LoginScreen> createState() => _LoginScreenState(); }
          class _LoginScreenState extends State<LoginScreen> {
            final _code = TextEditingController(); bool _load = false;
            Future<String> _getDeviceId() async { final deviceInfo = DeviceInfoPlugin(); if (Platform.isAndroid) { final androidInfo = await deviceInfo.androidInfo; return androidInfo.id; } return 'unknown_device'; }
            Future<void> _auth() async {
              if (_code.text.isEmpty) return; setState(() => _load = true);
              try { String deviceId = await _getDeviceId(); final deviceBanCheck = await FirebaseFirestore.instance.collection('banned_devices').doc(deviceId).get(); if (deviceBanCheck.exists) throw 'This device has been banned.'; final codeBanCheck = await FirebaseFirestore.instance.collection('banned_codes').doc(_code.text.trim().toUpperCase()).get(); if (codeBanCheck.exists) throw 'This Access Code has been revoked.'; final snap = await FirebaseFirestore.instance.collection('students').where('unitCode', isEqualTo: _code.text.trim().toUpperCase()).limit(1).get(); if (snap.docs.isNotEmpty) { final data = snap.docs.first.data(); String currentClass = data['classLevel'] ?? 'S1'; String actualName = data['fullName'] ?? '${data['firstName']} ${data['lastName']}'; await FirebaseFirestore.instance.collection('students').doc(snap.docs.first.id).update({'device_id': deviceId, 'last_login': FieldValue.serverTimestamp()}); final prefs = await SharedPreferences.getInstance(); await prefs.setBool('isLoggedIn', true); await prefs.setString('unitCode', data['unitCode']); await prefs.setString('fullName', actualName); await prefs.setString('classLevel', currentClass); if (mounted) Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const HomeScreen())); } else { if (mounted) ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Invalid Code.'))); } } catch (e) { if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(e.toString()))); } finally { if (mounted) setState(() => _load = false); }
            }
            @override Widget build(BuildContext context) { return Scaffold(body: Center(child: SingleChildScrollView(padding: const EdgeInsets.all(24), child: Container(padding: const EdgeInsets.all(24), decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(24), boxShadow: [BoxShadow(color: Colors.black12, blurRadius: 20)]), child: Column(mainAxisSize: MainAxisSize.min, children: [Image.asset('assets/logo.png', height: 100, errorBuilder: (c, e, s) => const Icon(Icons.school, size: 80, color: Color(0xFFC62828))), const SizedBox(height: 16), const Text('Student Login', style: TextStyle(fontSize: 24, fontWeight: FontWeight.bold)), const SizedBox(height: 16), TextField(controller: _code, textAlign: TextAlign.center, style: const TextStyle(letterSpacing: 4, fontWeight: FontWeight.bold), decoration: const InputDecoration(labelText: 'Access Code')), const SizedBox(height: 24), SizedBox(width: double.infinity, height: 50, child: ElevatedButton(onPressed: _load ? null : _auth, child: _load ? const CircularProgressIndicator(color: Colors.white) : const Text('Login'))), const SizedBox(height: 16), TextButton(onPressed: () { Navigator.push(context, MaterialPageRoute(builder: (_) => const FindCodeScreen())); }, child: const Text('Find My Code', style: TextStyle(color: Colors.blue)))]))))); }
          }
          EOF

          cat > lib/screens/find_code.dart << 'EOF'
          import 'package:flutter/material.dart'; import 'package:cloud_firestore/cloud_firestore.dart';
          class FindCodeScreen extends StatefulWidget { const FindCodeScreen({super.key}); @override State<FindCodeScreen> createState() => _FindCodeScreenState(); }
          class _FindCodeScreenState extends State<FindCodeScreen> { final _fnCtrl = TextEditingController(); final _lnCtrl = TextEditingController(); String _result = ''; bool _loading = false; void _search() async { if (_fnCtrl.text.isEmpty || _lnCtrl.text.isEmpty) return; setState(() { _loading = true; _result = ''; }); try { final snap = await FirebaseFirestore.instance.collection('students').where('firstName', isEqualTo: _fnCtrl.text.trim()).where('lastName', isEqualTo: _lnCtrl.text.trim()).get(); if (snap.docs.isNotEmpty) { setState(() { _result = 'Your Code is: ${snap.docs.first.data()['unitCode']}'; }); } else { setState(() { _result = 'Name not found.'; }); } } catch (e) { setState(() { _result = 'Error: $e'; }); } setState(() => _loading = false); } @override Widget build(BuildContext context) => Scaffold(appBar: AppBar(title: const Text('Find My Code')), body: Padding(padding: const EdgeInsets.all(24), child: Column(children: [const Text('Enter exact First Name and Last Name.', style: TextStyle(color: Colors.grey)), const SizedBox(height: 24), TextField(controller: _fnCtrl, decoration: const InputDecoration(labelText: 'First Name')), const SizedBox(height: 16), TextField(controller: _lnCtrl, decoration: const InputDecoration(labelText: 'Last Name')), const SizedBox(height: 24), SizedBox(width: double.infinity, height: 50, child: ElevatedButton(onPressed: _loading ? null : _search, child: _loading ? const CircularProgressIndicator() : const Text('SEARCH'))), const SizedBox(height: 32), if (_result.isNotEmpty) Text(_result, textAlign: TextAlign.center, style: const TextStyle(fontSize: 20, fontWeight: FontWeight.bold, color: Colors.green))]))); }
          EOF

          cat > lib/screens/home.dart << 'EOF'
          import 'package:flutter/material.dart'; import 'package:shared_preferences/shared_preferences.dart'; import 'feed.dart'; import 'timetable.dart'; import 'hub.dart'; import 'profile.dart'; import 'inbox.dart'; import 'anonymous.dart'; import 'alumni.dart';
          class HomeScreen extends StatefulWidget { const HomeScreen({super.key}); @override State<HomeScreen> createState() => _HomeScreenState(); }
          class _HomeScreenState extends State<HomeScreen> {
            int _i = 0; String _code = ''; String _cls = 'S1'; String _name = '';
            @override void initState() { super.initState(); _load(); }
            void _load() async { final p = await SharedPreferences.getInstance(); if (mounted) setState(() { _code = p.getString('unitCode') ?? ''; _cls = p.getString('classLevel') ?? 'S1'; _name = p.getString('fullName') ?? _code; }); }
            @override Widget build(BuildContext context) {
              if (_code.isEmpty) return const Scaffold(body: Center(child: CircularProgressIndicator()));
              if (_cls == 'Omicron') return AlumniHub(myCode: _code, myName: _name);
              
              final pages = [
                FeedScreen(name: _name), 
                TimetableScreen(cls: _cls), 
                HubScreen(name: _name, code: _code, cls: _cls), 
                InboxScreen(myCode: _code, myName: _name), 
                const AnonymousBoard(), 
                ProfileScreen(code: _code, name: _name, cls: _cls)
              ];
              
              return Scaffold(body: pages[_i], bottomNavigationBar: BottomNavigationBar(currentIndex: _i, onTap: (v) => setState(() => _i = v), type: BottomNavigationBarType.fixed, selectedFontSize: 9, unselectedFontSize: 9, items: const [
                BottomNavigationBarItem(icon: Icon(Icons.home), label: 'Feed'), 
                BottomNavigationBarItem(icon: Icon(Icons.calendar_today), label: 'Timetable'), 
                BottomNavigationBarItem(icon: Icon(Icons.forum), label: 'Groups'), 
                BottomNavigationBarItem(icon: Icon(Icons.mail), label: 'Inbox'), 
                BottomNavigationBarItem(icon: Icon(Icons.masks), label: 'Anon'), 
                BottomNavigationBarItem(icon: Icon(Icons.person), label: 'Profile')
              ]));
            }
          }
