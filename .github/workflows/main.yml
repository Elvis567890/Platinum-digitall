import 'dart:convert';
import 'package:crypto/crypto.dart';

class SignatureService {
  static const String schoolKey = 'PLATINUM_SECONDARY_SCHOOL_KITEEZI';
  static String sign(String message) {
    final bytes = utf8.encode(message + schoolKey);
    return sha256.convert(bytes).toString();
  }
  static bool verify(String message, String signature) {
    return sign(message) == signature;
  }
}
