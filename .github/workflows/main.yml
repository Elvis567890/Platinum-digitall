          import 'package:flutter/material.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:google_mlkit_text_recognition/google_mlkit_text_recognition.dart';
          import 'dart:io';
          import 'package:cloud_firestore/cloud_firestore.dart';

          class OcrMarksScreen extends StatefulWidget {
            const OcrMarksScreen({super.key});
            @override
            State<OcrMarksScreen> createState() => _OcrMarksScreenState();
          }
          class _OcrMarksScreenState extends State<OcrMarksScreen> {
            String _text = 'No image scanned.';
            bool _loading = false;
            void _scan() async {
              final img = await ImagePicker().pickImage(source: ImageSource.camera);
              if (img == null) return;
              setState(() => _loading = true);
              final rec = TextRecognizer();
              final res = await rec.processImage(InputImage.fromFile(File(img.path)));
              setState(() { _text = res.text; _loading = false; });
              await FirebaseFirestore.instance.collection('marks').add({'raw': res.text, 'time': FieldValue.serverTimestamp()});
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('ML Kit OCR Scanner')),
                body: Padding(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    children: [
                      Expanded(child: Container(width: double.infinity, padding: const EdgeInsets.all(10), color: Colors.black, child: SingleChildScrollView(child: Text(_text, style: const TextStyle(color: Colors.greenAccent, fontFamily: 'monospace'))))),
                      const SizedBox(height: 20),
                      if (_loading) const CircularProgressIndicator(),
                      ElevatedButton.icon(
                        style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFF4B41A), minimumSize: const Size(double.infinity, 50)),
                        onPressed: _scan,
                        icon: const Icon(Icons.camera_alt, color: Colors.black),
                        label: const Text('Scan Physical Marksheet', style: TextStyle(color: Colors.black))
                      )
                    ]
                  )
                )
              );
            }
          }
