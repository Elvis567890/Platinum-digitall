name: Build Platinum Ecosystem (Final Complete Logic)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: BUILD PLATINUM DIGITAL APP (STUDENT)
  # ==========================================
  build-student:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate Student App Code
        run: |
          if [ ! -d "student_app" ]; then
            mkdir -p student_app/assets
            flutter create --org com.platinum --project-name student_app student_app
            mkdir -p student_app/lib/screens student_app/lib/services
          fi

          if [ -f "InShot_20261017_024714317.jpg" ]; then
            convert InShot_20261017_024714317.jpg -fuzz 5% -transparent white -resize 850x850 -background "#FFFFFF" -gravity center -extent 1024x1024 student_app/assets/logo.png
          elif [ ! -f "student_app/assets/logo.png" ]; then
            convert -size 1024x1024 xc:"#FFFFFF" student_app/assets/logo.png
          fi

          sed -i 's/distributionUrl=.*/distributionUrl=https\\:\/\/services.gradle.org\/distributions\/gradle-8.7-all.zip/g' student_app/android/gradle/wrapper/gradle-wrapper.properties
          
          cat > student_app/android/build.gradle << 'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://github.com/jitsi/jitsi-maven-repository/raw/master/releases" }
              }
          }
          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              afterEvaluate { project ->
                  if (project.extensions.findByName("android") != null) {
                      project.android {
                          compileSdk 34
                          compileOptions {
                              sourceCompatibility JavaVersion.VERSION_17
                              targetCompatibility JavaVersion.VERSION_17
                          }
                      }
                  }
                  tasks.withType(JavaCompile).configureEach {
                      sourceCompatibility = "17"
                      targetCompatibility = "17"
                  }
              }
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }
          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

          cat > student_app/android/settings.gradle << 'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.5.0" apply false
              id "org.jetbrains.kotlin.android" version "2.0.10" apply false
              id "com.google.gms.google-services" version "4.5.0" apply false
          }
          include ":app"
          EOF

          grep -q "android.newDsl=false" student_app/android/gradle.properties || echo "android.newDsl=false" >> student_app/android/gradle.properties
          grep -q "android.builtInKotlin=false" student_app/android/gradle.properties || echo "android.builtInKotlin=false" >> student_app/android/gradle.properties
          grep -q "android.useAndroidX=true" student_app/android/gradle.properties || echo "android.useAndroidX=true" >> student_app/android/gradle.properties
          grep -q "android.enableJetifier=true" student_app/android/gradle.properties || echo "android.enableJetifier=true" >> student_app/android/gradle.properties
          grep -q "kotlin.jvm.target.validation.mode = IGNORE" student_app/android/gradle.properties || echo "kotlin.jvm.target.validation.mode = IGNORE" >> student_app/android/gradle.properties
          
          sed -i 's/<manifest/<manifest xmlns:tools="http:\/\/schemas.android.com\/tools"/' student_app/android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:requestLegacyExternalStorage="true" tools:replace="android:label"/' student_app/android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="student_app"/android:label="Platinum Digital App"/g' student_app/android/app/src/main/AndroidManifest.xml
          grep -q "REQUEST_INSTALL_PACKAGES" student_app/android/app/src/main/AndroidManifest.xml || sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.CAMERA"\/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"\/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"\/>' student_app/android/app/src/main/AndroidManifest.xml
          
          cat > student_app/android/app/build.gradle << 'EOF'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
              id "com.google.gms.google-services"
          }
          android {
              namespace = "com.platinum.student_app"
              compileSdk = 34
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { 
                  jvmTarget = "17"
                  freeCompilerArgs += ["-Xskip-metadata-version-check"]
              }
              defaultConfig {
                  applicationId = "com.afrinode.platinum"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
                  multiDexEnabled = true
              }
              buildTypes { 
                  release { 
                      signingConfig = signingConfigs.debug 
                      minifyEnabled = false
                      shrinkResources = false
                  } 
              }
              lint { checkReleaseBuilds = false; abortOnError = false }
          }
          flutter { source = "../.." }
          dependencies {
              implementation platform("com.google.firebase:firebase-bom:35.0.2")
              implementation "com.google.firebase:firebase-analytics"
          }
          EOF

          cd student_app
          
          cat > pubspec.yaml << 'EOF'
          name: student_app
          description: "Platinum Digital App"
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.4.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.6
            firebase_core: ^3.1.0
            cloud_firestore: ^5.0.1
            firebase_storage: ^12.0.1
            image_picker: ^1.1.2
            video_player: ^2.9.1
            cached_network_image: ^3.3.1
            path_provider: ^2.1.3
            dio: ^5.4.3+1
            google_fonts: ^6.2.1
            sqflite: ^2.3.3+1
            path: ^1.9.0
            jitsi_meet_flutter_sdk: 10.3.0
            url_launcher: ^6.3.0
            file_picker: 8.1.6
            shared_preferences: ^2.2.3
            package_info_plus: 8.0.2
            http: ^1.2.1
            open_filex: ^4.5.0
            permission_handler: ^11.3.1
            audioplayers: ^6.0.0
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
            flutter_launcher_icons: ^0.13.1
            flutter_native_splash: ^2.4.0

          flutter_launcher_icons:
            android: "launcher_icon"
            image_path: "assets/logo.png"
            adaptive_icon_background: "#FFFFFF"
            adaptive_icon_foreground: "assets/logo.png"

          flutter_native_splash:
            color: "#FFFFFF"
            image: assets/logo.png
            web: false
            fullscreen: true
            android_gravity: fill
            android_12:
              image: assets/logo.png
              icon_background_color: "#FFFFFF"
          EOF

          # --- STUDENT DART CODE ---
          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:google_fonts/google_fonts.dart';
          import 'package:http/http.dart' as http;
          import 'dart:convert';
          import 'package:package_info_plus/package_info_plus.dart';
          import 'package:dio/dio.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:open_filex/open_filex.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'screens/login.dart';
          import 'screens/home.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Firebase.initializeApp(options: const FirebaseOptions(apiKey: "AIzaSyDl-dfyyRT9kdxJOCm4ZM6QYmnY1cgXI0M", appId: "1:374715668746:android:b985232e1b3a6d0d4342f3", messagingSenderId: "374715668746", projectId: "payment-sas", storageBucket: "payment-sas.firebasestorage.app"));
            runApp(const App());
          }

          class App extends StatelessWidget {
            const App({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Platinum Digital App',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.dark,
                  primaryColor: const Color(0xFF0B0F19),
                  scaffoldBackgroundColor: const Color(0xFF0B0F19),
                  useMaterial3: true,
                  textTheme: GoogleFonts.outfitTextTheme(Theme.of(context).textTheme.apply(bodyColor: Colors.white)),
                  appBarTheme: const AppBarTheme(backgroundColor: Color(0xFF0B0F19), elevation: 0, centerTitle: true),
                  bottomNavigationBarTheme: const BottomNavigationBarThemeData(
                    backgroundColor: Color(0xFF131A26),
                    selectedItemColor: Color(0xFFD4AF37),
                    unselectedItemColor: Colors.grey,
                  ),
                ),
                home: const Start()
              );
            }
          }

          class Start extends StatefulWidget {
            const Start({super.key});
            @override
            State<Start> createState() => _StartState();
          }

          class _StartState extends State<Start> {
            @override
            void initState() {
              super.initState();
              _init();
            }

            Future<void> _init() async {
              _checkForUpdates();
              final prefs = await SharedPreferences.getInstance();
              final isLoggedIn = prefs.getBool('isLoggedIn') ?? false;
              
              if (mounted) {
                if (isLoggedIn) {
                  Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const HomeScreen()));
                } else {
                  Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const LoginScreen()));
                }
              }
            }

            void _checkForUpdates() async {
              try {
                PackageInfo pInfo = await PackageInfo.fromPlatform();
                final res = await http.get(Uri.parse('https://api.github.com/repos/Elvis567890/Platinum-digitall/releases/latest'));
                if (res.statusCode == 200) {
                  final data = jsonDecode(res.body);
                  String latest = data['tag_name'].toString().replaceAll('v', '');
                  String apkUrl = data['assets'][0]['browser_download_url'];
                  
                  if (latest != pInfo.version && mounted) {
                    showDialog(
                      context: context,
                      barrierDismissible: false,
                      builder: (ctx) => AlertDialog(
                        title: const Text('Update Available 🚀'),
                        content: Text('Version $latest is available. Update now!'),
                        actions: [
                          TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('Later')),
                          ElevatedButton(
                            onPressed: () async {
                              Navigator.pop(ctx);
                              await _download(apkUrl);
                            },
                            child: const Text('Update Now')
                          )
                        ]
                      )
                    );
                  }
                }
              } catch (e) {
                debugPrint("OTA Failed: $e");
              }
            }

            Future<void> _download(String url) async {
              if (await Permission.requestInstallPackages.status != PermissionStatus.granted) {
                await Permission.requestInstallPackages.request();
              }
              
              showDialog(context: context, barrierDismissible: false, builder: (ctx) => const AlertDialog(
                content: Column(mainAxisSize: MainAxisSize.min, children: [
                  CircularProgressIndicator(color: Color(0xFFD4AF37)),
                  SizedBox(height: 20),
                  Text("Downloading Update in Background...")
                ])
              ));

              try {
                final dir = await getExternalStorageDirectory();
                final path = '${dir!.path}/update.apk';
                await Dio().download(url, path);
                if (mounted) Navigator.pop(context);
                OpenFilex.open(path);
              } catch (e) {
                if (mounted) Navigator.pop(context);
                ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('Download failed: $e')));
              }
            }

            @override
            Widget build(BuildContext context) => const Scaffold(body: Center(child: CircularProgressIndicator(color: Color(0xFFD4AF37))));
          }
          EOF

          cat > lib/screens/login.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'home.dart';

          class LoginScreen extends StatefulWidget {
            const LoginScreen({super.key});
            @override
            State<LoginScreen> createState() => _LoginScreenState();
          }
          class _LoginScreenState extends State<LoginScreen> {
            final _code = TextEditingController();
            bool _loading = false;

            Future<void> _login() async {
              if (_code.text.trim().isEmpty) return;
              setState(() => _loading = true);
              
              try {
                final snap = await FirebaseFirestore.instance.collection('marks')
                    .where('unitCode', isEqualTo: _code.text.trim().toUpperCase())
                    .limit(1).get();

                if (snap.docs.isNotEmpty) {
                  final prefs = await SharedPreferences.getInstance();
                  await prefs.setBool('isLoggedIn', true);
                  await prefs.setString('unitCode', _code.text.trim().toUpperCase());
                  
                  if (mounted) Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const HomeScreen()));
                } else {
                  if (mounted) ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Invalid Unit Code. Contact your Teacher.'), backgroundColor: Colors.redAccent));
                }
              } catch (e) {
                if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('Error: $e')));
              } finally {
                if (mounted) setState(() => _loading = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Container(
                  decoration: const BoxDecoration(
                    gradient: LinearGradient(colors: [Color(0xFF0B0F19), Color(0xFF131A26)], begin: Alignment.topCenter, end: Alignment.bottomCenter)
                  ),
                  child: Center(
                    child: Container(
                      margin: const EdgeInsets.all(24),
                      padding: const EdgeInsets.all(24),
                      decoration: BoxDecoration(
                        color: const Color(0xFF131A26).withOpacity(0.8),
                        borderRadius: BorderRadius.circular(24),
                        border: Border.all(color: Colors.white10),
                        boxShadow: [BoxShadow(color: Colors.black.withOpacity(0.5), blurRadius: 20)],
                      ),
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          Image.asset('assets/logo.png', height: 100),
                          const SizedBox(height: 20),
                          const Text('Student Portal', style: TextStyle(fontSize: 24, fontWeight: FontWeight.bold, color: Colors.white, fontFamily: 'Outfit')),
                          const SizedBox(height: 8),
                          const Text('Enter the unique Unit Code given to you by your teacher.', textAlign: TextAlign.center, style: TextStyle(color: Colors.grey, fontSize: 12)),
                          const SizedBox(height: 24),
                          TextField(
                            controller: _code,
                            style: const TextStyle(color: Colors.white, letterSpacing: 4, fontWeight: FontWeight.bold, fontSize: 20),
                            textAlign: TextAlign.center,
                            decoration: InputDecoration(
                              labelText: 'Unit Code (e.g. A7X9P2)',
                              labelStyle: const TextStyle(color: Colors.grey, letterSpacing: 0, fontSize: 14, fontWeight: FontWeight.normal),
                              enabledBorder: OutlineInputBorder(borderRadius: BorderRadius.circular(12), borderSide: const BorderSide(color: Colors.white24)),
                              focusedBorder: OutlineInputBorder(borderRadius: BorderRadius.circular(12), borderSide: const BorderSide(color: Color(0xFFD4AF37))),
                            ),
                          ),
                          const SizedBox(height: 24),
                          SizedBox(
                            width: double.infinity,
                            height: 50,
                            child: ElevatedButton(
                              style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFD4AF37), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12))),
                              onPressed: _loading ? null : _login,
                              child: _loading ? const CircularProgressIndicator(color: Colors.black) : const Text('Access App', style: TextStyle(color: Colors.black, fontWeight: FontWeight.bold, fontSize: 16)),
                            ),
                          )
                        ]
                      )
                    )
                  )
                )
              );
            }
          }
          EOF

          cat > lib/screens/home.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'feed.dart';
          import 'study.dart';
          import 'hub.dart';
          import 'profile.dart';

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});
            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }
          class _HomeScreenState extends State<HomeScreen> {
            int _i = 0;
            String _code = '';
            @override
            void initState() {
              super.initState();
              _load();
            }
            void _load() async {
              final prefs = await SharedPreferences.getInstance();
              if (mounted) {
                setState(() {
                  _code = prefs.getString('unitCode') ?? '';
                });
              }
            }
            @override
            Widget build(BuildContext context) {
              if (_code.isEmpty) return const Scaffold(body: Center(child: CircularProgressIndicator(color: Color(0xFFD4AF37))));
              final p = [
                FeedScreen(name: _code),
                const StudyScreen(),
                HubScreen(name: _code),
                ProfileScreen(code: _code),
              ];
              return Scaffold(
                body: p[_i],
                bottomNavigationBar: Container(
                  decoration: BoxDecoration(
                    border: Border(top: BorderSide(color: Colors.white.withOpacity(0.05), width: 1))
                  ),
                  child: BottomNavigationBar(
                    currentIndex: _i,
                    onTap: (v) => setState(() => _i = v),
                    type: BottomNavigationBarType.fixed,
                    items: const [
                      BottomNavigationBarItem(icon: Icon(Icons.home_filled), label: 'Feed'),
                      BottomNavigationBarItem(icon: Icon(Icons.school_rounded), label: 'Study'),
                      BottomNavigationBarItem(icon: Icon(Icons.groups_rounded), label: 'Hub'),
                      BottomNavigationBarItem(icon: Icon(Icons.person_rounded), label: 'Profile')
                    ]
                  )
                )
              );
            }
          }
          EOF

          cat > lib/screens/feed.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:firebase_storage/firebase_storage.dart';
          import 'package:image_picker/image_picker.dart';
          import 'dart:io';
          import 'package:cached_network_image/cached_network_image.dart';
          import 'package:video_player/video_player.dart';

          class FeedScreen extends StatefulWidget {
            final String name;
            const FeedScreen({super.key, required this.name});
            @override
            State<FeedScreen> createState() => _FeedScreenState();
          }

          class _FeedScreenState extends State<FeedScreen> {
            final _c = TextEditingController();
            XFile? _media;
            String? _mediaType;
            bool _posting = false;

            Future<void> _post() async {
              if (_c.text.trim().isEmpty && _media == null) return;
              setState(() => _posting = true);
              String? url;
              try {
                if (_media != null) {
                  final ref = FirebaseStorage.instance.ref().child('feed/${DateTime.now().millisecondsSinceEpoch}_${_media!.name}');
                  await ref.putFile(File(_media!.path));
                  url = await ref.getDownloadURL();
                }
                await FirebaseFirestore.instance.collection('feed_posts').add({
                  'author': widget.name,
                  'authorType': 'student',
                  'text': _c.text.trim(),
                  'mediaUrl': url,
                  'mediaType': _mediaType,
                  'time': FieldValue.serverTimestamp(),
                  'likes': 0,
                });
                _c.clear();
                setState(() { _media = null; _mediaType = null; });
                if (mounted) Navigator.pop(context);
              } catch (e) {
                if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('Failed: $e')));
              } finally {
                if (mounted) setState(() => _posting = false);
              }
            }

            void _showPostModal() {
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                backgroundColor: const Color(0xFF131A26),
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(24))),
                builder: (ctx) => Padding(
                  padding: EdgeInsets.only(bottom: MediaQuery.of(ctx).viewInsets.bottom, left: 16, right: 16, top: 16),
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      const Text('Create Post', style: TextStyle(fontSize: 20, fontWeight: FontWeight.bold, color: Colors.white)),
                      const SizedBox(height: 16),
                      TextField(
                        controller: _c,
                        maxLines: 3,
                        style: const TextStyle(color: Colors.white),
                        decoration: InputDecoration(
                          hintText: 'What is happening on campus?',
                          hintStyle: const TextStyle(color: Colors.grey),
                          filled: true,
                          fillColor: const Color(0xFF0B0F19),
                          border: OutlineInputBorder(borderRadius: BorderRadius.circular(12), borderSide: BorderSide.none),
                        ),
                      ),
                      const SizedBox(height: 16),
                      if (_media != null)
                        Stack(
                          children: [
                            if (_mediaType == 'image')
                              ClipRRect(
                                borderRadius: BorderRadius.circular(12),
                                child: Image.file(File(_media!.path), height: 150, width: double.infinity, fit: BoxFit.cover),
                              )
                            else
                              Container(
                                height: 150, width: double.infinity, color: Colors.black54,
                                child: const Center(child: Icon(Icons.videocam, color: Colors.white, size: 50)),
                              ),
                            Positioned(
                              top: 8, right: 8,
                              child: GestureDetector(
                                onTap: () => setState(() { _media = null; _mediaType = null; }),
                                child: Container(padding: const EdgeInsets.all(4), decoration: const BoxDecoration(color: Colors.black54, shape: BoxShape.circle), child: const Icon(Icons.close, color: Colors.white, size: 20)),
                              ),
                            ),
                          ],
                        ),
                      const SizedBox(height: 16),
                      Row(
                        mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                        children: [
                          IconButton(
                            icon: const Icon(Icons.image, color: Color(0xFFD4AF37), size: 30),
                            onPressed: () async {
                              final x = await ImagePicker().pickImage(source: ImageSource.gallery);
                              if (x != null) setState(() { _media = x; _mediaType = 'image'; });
                            },
                          ),
                          IconButton(
                            icon: const Icon(Icons.videocam, color: Color(0xFFD4AF37), size: 30),
                            onPressed: () async {
                              final x = await ImagePicker().pickVideo(source: ImageSource.gallery);
                              if (x != null) setState(() { _media = x; _mediaType = 'video'; });
                            },
                          ),
                          _posting
                              ? const CircularProgressIndicator(color: Color(0xFFD4AF37))
                              : ElevatedButton(
                                  style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFD4AF37), foregroundColor: Colors.black),
                                  onPressed: _post,
                                  child: const Text('Post to Feed', style: TextStyle(fontWeight: FontWeight.bold)),
                                ),
                        ],
                      ),
                      const SizedBox(height: 16),
                    ],
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Platinum Feed', style: TextStyle(fontWeight: FontWeight.bold, color: Color(0xFFD4AF37))),
                  actions: [
                    IconButton(icon: const Icon(Icons.add_circle, color: Color(0xFFD4AF37), size: 30), onPressed: _showPostModal)
                  ],
                ),
                body: Column(
                  children: [
                    StreamBuilder<QuerySnapshot>(
