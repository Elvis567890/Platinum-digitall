          import 'dart:convert';
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:url_launcher/url_launcher.dart';

          class ProFeatures {
            ProFeatures._();
            static final instance = ProFeatures._();
            final FirebaseFirestore db = FirebaseFirestore.instance;

            Stream<QuerySnapshot<Map<String, dynamic>>> attendance(String unitCode) => db.collection('attendance').where('unitCode', isEqualTo: unitCode).orderBy('date', descending: true).snapshots();
            Stream<QuerySnapshot<Map<String, dynamic>>> timetable(String classLevel) => db.collection('timetable').where('classLevel', isEqualTo: classLevel).orderBy('startTime').snapshots();
            Stream<QuerySnapshot<Map<String, dynamic>>> assignments(String classLevel) => db.collection('assignments').where('classLevel', isEqualTo: classLevel).orderBy('dueAt').snapshots();
            Stream<QuerySnapshot<Map<String, dynamic>>> notifications(String unitCode) => db.collection('notifications').where('audience', arrayContainsAny: [unitCode, 'all']).orderBy('createdAt', descending: true).limit(50).snapshots();
            Stream<QuerySnapshot<Map<String, dynamic>>> analytics(String unitCode) => db.collection('marks').where('unitCode', isEqualTo: unitCode).orderBy('time').snapshots();

            Future<void> cache(String key, Object value) async => (await SharedPreferences.getInstance()).setString(key, jsonEncode(value));
            Future<dynamic> cached(String key) async { final v = (await SharedPreferences.getInstance()).getString(key); return v == null ? null : jsonDecode(v); }
            Future<bool> openPayment(String checkoutUrl) async { final uri = Uri.tryParse(checkoutUrl); return uri != null && await launchUrl(uri, mode: LaunchMode.externalApplication); }

            Future<void> writeAudit({required String action, required String actor, required String target}) => db.collection('audit_logs').add({'action': action, 'actor': actor, 'target': target, 'createdAt': FieldValue.serverTimestamp()});
          }
