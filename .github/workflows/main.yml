          cat > lib/screens/inbox.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'chat.dart';

          class InboxScreen extends StatelessWidget {
            final String myCode; final String myName;
            const InboxScreen({super.key, required this.myCode, required this.myName});
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Private Inbox')),
                body: StreamBuilder<QuerySnapshot>(
                  stream: FirebaseFirestore.instance.collection('students').where('unitCode', isNotEqualTo: myCode).snapshots(),
                  builder: (c, s) {
                    if (!s.hasData) return const Center(child: CircularProgressIndicator());
                    if (s.data!.docs.isEmpty) return const Center(child: Text('No other students registered yet.'));
                    return ListView.builder(
                      padding: const EdgeInsets.all(16),
                      itemCount: s.data!.docs.length,
                      itemBuilder: (c, i) {
                        final d = s.data!.docs[i].data() as Map<String, dynamic>;
                        final otherCode = d['unitCode'];
                        final otherName = d['fullName'] ?? '${d['firstName']} ${d['lastName']}';
                        return Card(
                          margin: const EdgeInsets.only(bottom: 8),
                          child: ListTile(
                            leading: CircleAvatar(backgroundColor: const Color(0xFFD4AF37), child: Text(d['firstName'][0], style: const TextStyle(color: Colors.white))),
                            title: Text(otherName, style: const TextStyle(fontWeight: FontWeight.bold)),
                            subtitle: Text('Class: ${d['classLevel']}'),
                            trailing: const Icon(Icons.chat, color: Color(0xFFD4AF37)),
                            onTap: () {
                              List<String> codes = [myCode, otherCode];
                              codes.sort();
                              String dmRoom = 'DM_${codes[0]}_${codes[1]}';
                              Navigator.push(context, MaterialPageRoute(builder: (_) => ChatScreen(room: dmRoom, userCode: myCode, userName: myName)));
                            },
                          ),
                        );
                      },
                    );
                  },
                ),
              );
            }
          }
          EOF

          cat > lib/screens/anonymous.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:timeago/timeago.dart' as timeago;
          import 'package:shared_preferences/shared_preferences.dart';

          class AnonymousBoard extends StatefulWidget { 
            const AnonymousBoard({super.key}); 
            @override State<AnonymousBoard> createState() => _AnonymousBoardState(); 
