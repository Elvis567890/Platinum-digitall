                  </provider>
              </application>
          </manifest>
          EOF

          cat > student_app/android/app/src/main/res/xml/file_paths.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-path name="external_files" path="."/>
          </paths>
          EOF

          cat > student_app/android/build.gradle << 'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://github.com/jitsi/jitsi-maven-repository/raw/master/releases" }
              }
          }
          rootProject.buildDir = '../build'
          subprojects { project.buildDir = "${rootProject.buildDir}/${project.name}" }
          subprojects { project.evaluationDependsOn(':app') }
          tasks.register("clean", Delete) { delete rootProject.buildDir }
          EOF

          cat > student_app/android/app/build.gradle << 'EOF'
          plugins { id "com.android.application"; id "kotlin-android"; id "dev.flutter.flutter-gradle-plugin" }
          android {
              namespace = "com.afrinode.platinum"; compileSdk = 34
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              defaultConfig { applicationId = "com.afrinode.platinum"; minSdk = 24; targetSdk = 34; versionCode = flutter.versionCode; versionName = flutter.versionName; multiDexEnabled = true }
              buildTypes { release { signingConfig = signingConfigs.debug; minifyEnabled = false } }
          }
          flutter { source = "../.." }
          dependencies { 
              implementation platform("com.google.firebase:firebase-bom:35.0.2")
              implementation "com.google.firebase:firebase-analytics"
              implementation "androidx.core:core:1.12.0"
          }
          EOF

          cat > student_app/pubspec.yaml << 'EOF'
          name: student_app
          environment: {sdk: '>=3.4.0 <4.0.0'}
          dependencies:
            flutter: {sdk: flutter}
            firebase_core: ^3.1.0
            firebase_auth: ^5.1.0
            cloud_firestore: ^5.0.1
            firebase_storage: ^12.0.1
            image_picker: ^1.1.2
            video_player: ^2.9.1
            cached_network_image: ^3.3.1
            google_fonts: ^6.2.1
            shared_preferences: ^2.2.3
            timeago: ^3.7.0
            share_plus: 10.1.4
            file_picker: 10.1.2
            audioplayers: ^6.0.0
            url_launcher: ^6.3.0
            http: ^1.2.1
            package_info_plus: 8.0.2
            dio: ^5.4.3+1
            path_provider: ^2.1.3
            open_filex: ^4.5.0
            permission_handler: ^11.3.1
            jitsi_meet_flutter_sdk: 10.3.0
          
          dependency_overrides:
            web: 1.1.1

          flutter:
            uses-material-design: true
          EOF

          cd student_app

          cat > lib/main.dart << 'EOF'
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:firebase_auth/firebase_auth.dart';
          import 'package:google_fonts/google_fonts.dart';
          import 'package:http/http.dart' as http;
          import 'dart:convert';
          import 'package:package_info_plus/package_info_plus.dart';
          import 'package:dio/dio.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:open_filex/open_filex.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'screens/login.dart';
          import 'screens/home.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Firebase.initializeApp(options: const FirebaseOptions(apiKey: "AIzaSyDl-dfyyRT9kdxJOCm4ZM6QYmnY1cgXI0M", appId: "1:374715668746:android:b985232e1b3a6d0d4342f3", messagingSenderId: "374715668746", projectId: "payment-sas", storageBucket: "payment-sas.firebasestorage.app"));
            if (FirebaseAuth.instance.currentUser == null) { await FirebaseAuth.instance.signInAnonymously(); }
            runApp(const App());
          }

          class App extends StatelessWidget {
            const App({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.light, primaryColor: const Color(0xFFD4AF37), scaffoldBackgroundColor: Colors.white, useMaterial3: true,
                  textTheme: GoogleFonts.outfitTextTheme(Theme.of(context).textTheme.apply(bodyColor: Colors.black87)),
                  appBarTheme: const AppBarTheme(backgroundColor: Colors.white, elevation: 0, centerTitle: true, iconTheme: IconThemeData(color: Colors.black)),
                  cardTheme: const CardTheme(color: Colors.white, elevation: 2, margin: EdgeInsets.zero, shape: RoundedRectangleBorder(borderRadius: BorderRadius.all(Radius.circular(18)))),
                  inputDecorationTheme: InputDecorationTheme(filled: true, fillColor: Colors.grey[100], border: const OutlineInputBorder(borderRadius: BorderRadius.all(Radius.circular(14)), borderSide: BorderSide.none)),
                  elevatedButtonTheme: ElevatedButtonThemeData(style: ElevatedButton.styleFrom(minimumSize: const Size(0, 48), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14)), backgroundColor: const Color(0xFFD4AF37), foregroundColor: Colors.black)),
                  bottomNavigationBarTheme: const BottomNavigationBarThemeData(backgroundColor: Colors.white, selectedItemColor: Color(0xFFD4AF37), unselectedItemColor: Colors.grey),
                ),
                home: const StartScreen()
              );
            }
          }

          class StartScreen extends StatefulWidget {
            const StartScreen({super.key});
            @override State<StartScreen> createState() => _StartScreenState();
          }
          class _StartScreenState extends State<StartScreen> {
            @override void initState() { super.initState(); _init(); }
            Future<void> _init() async {
              _checkForUpdates();
              final prefs = await SharedPreferences.getInstance();
              final isLoggedIn = prefs.getBool('isLoggedIn') ?? false;
              if (mounted) Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => isLoggedIn ? const HomeScreen() : const LoginScreen()));
            }
            void _checkForUpdates() async {
              try {
                PackageInfo pInfo = await PackageInfo.fromPlatform();
                final res = await http.get(Uri.parse('https://api.github.com/repos/Elvis567890/Platinum-digitall/releases'));
                if (res.statusCode == 200) {
                  final data = jsonDecode(res.body);
                  for (var release in data) {
                    if (release['tag_name'].startsWith('v')) {
                      final latest = release['tag_name'].toString().replaceFirst(RegExp(r'^v'), '');
                      final assets = (release['assets'] as List?) ?? const [];
                      Map? apkAsset;
                      for (final asset in assets) { if (asset is Map && asset['name'].toString().endsWith('.apk')) { apkAsset = asset; break; } }
                      final apkUrl = apkAsset?['browser_download_url']?.toString();
                      if (apkUrl != null && latest != pInfo.version && mounted) {
                        showDialog(context: context, barrierDismissible: false, builder: (ctx) => AlertDialog(title: const Text('Update Available'), content: Text('Version $latest is available.'), actions: [TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('Later')), ElevatedButton(onPressed: () async { Navigator.pop(ctx); await _download(apkUrl); }, child: const Text('Update Now'))]));
                      }
                      break;
                    }
                  }
                }
              } catch (e) {}
            }
            Future<void> _download(String url) async {
              if (await Permission.requestInstallPackages.status != PermissionStatus.granted) { await Permission.requestInstallPackages.request(); }
              showDialog(context: context, barrierDismissible: false, builder: (ctx) => const AlertDialog(content: Column(mainAxisSize: MainAxisSize.min, children: [CircularProgressIndicator(), SizedBox(height: 20), Text("Downloading...")])));
              try {
                Directory? dir = await getExternalStorageDirectory(); dir ??= await getApplicationDocumentsDirectory();
                final path = '${dir.path}/update.apk';
                await Dio().download(url, path);
                if (mounted) Navigator.pop(context);
                await OpenFilex.open(path);
              } catch (e) {}
            }
            @override Widget build(BuildContext context) => const Scaffold(body: Center(child: CircularProgressIndicator()));
          }
          EOF

          cat > lib/screens/login.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'dart:math';
          import 'home.dart';

          class LoginScreen extends StatefulWidget {
            const LoginScreen({super.key});
            @override State<LoginScreen> createState() => _LoginScreenState();
          }
          class _LoginScreenState extends State<LoginScreen> {
            final _fn = TextEditingController(); final _ln = TextEditingController(); final _code = TextEditingController();
            String _cls = 'S1'; bool _reg = false; bool _load = false; String _role = 'Student';

            Future<void> _auth() async {
              if (_fn.text.isEmpty || _ln.text.isEmpty) return;
              setState(() => _load = true);
              try {
                String fullName = '${_fn.text.trim()} ${_ln.text.trim()}';
                if (_reg) {
                  String genCode = _role == 'Student' ? "PDT-${Random().nextInt(8999) + 1000}" : "STF-${Random().nextInt(8999) + 1000}";
                  await FirebaseFirestore.instance.collection(_role == 'Student' ? 'students' : 'staff').add({'firstName': _fn.text.trim(), 'lastName': _ln.text.trim(), 'fullName': fullName, 'classLevel': _role == 'Student' ? _cls : _role, 'unitCode': genCode, 'role': _role, 'time': FieldValue.serverTimestamp(), 'enrollmentYear': DateTime.now().year});
                  final prefs = await SharedPreferences.getInstance();
                  await prefs.setBool('isLoggedIn', true); await prefs.setString('unitCode', genCode); await prefs.setString('fullName', fullName); await prefs.setString('classLevel', _role == 'Student' ? _cls : _role);
                  if (mounted) _showSuccess(genCode);
                } else {
                  final snap = await FirebaseFirestore.instance.collection(_role == 'Student' ? 'students' : 'staff').where('unitCode', isEqualTo: _code.text.trim().toUpperCase()).limit(1).get();
                  if (snap.docs.isNotEmpty) {
                    final data = snap.docs.first.data();
                    String currentClass = data['classLevel'] ?? 'S1';
                    String actualName = data['fullName'] ?? '${data['firstName']} ${data['lastName']}';
                    
                    if (data['role'] == 'Student' && data['enrollmentYear'] != null && currentClass.startsWith('S')) {
                      int years = DateTime.now().year - (data['enrollmentYear'] as int);
                      int baseClass = int.tryParse(currentClass.replaceAll('S', '')) ?? 1;
                      int newClassInt = baseClass + years;
                      
                      if (baseClass <= 4) {
                        currentClass = newClassInt > 4 ? 'Omicron' : 'S$newClassInt';
                      } else {
                        currentClass = newClassInt > 6 ? 'Omicron' : 'S$newClassInt';
                      }
                      
                      if (currentClass != data['classLevel']) await FirebaseFirestore.instance.collection('students').doc(snap.docs.first.id).update({'classLevel': currentClass});
                    }
                    
                    final prefs = await SharedPreferences.getInstance();
                    await prefs.setBool('isLoggedIn', true); await prefs.setString('unitCode', data['unitCode']); await prefs.setString('fullName', actualName); await prefs.setString('classLevel', currentClass);
                    if (mounted) Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const HomeScreen()));
                  } else if (mounted) ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Invalid Code.')));
                }
              } catch (e) { if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('Error: $e'))); } finally { if (mounted) setState(() => _load = false); }
            }

            void _showSuccess(String code) {
              showDialog(context: context, barrierDismissible: false, builder: (ctx) => AlertDialog(title: const Text('Success!'), content: Column(mainAxisSize: MainAxisSize.min, children: [const Text('Your Code:'), const SizedBox(height: 16), Text(code, style: const TextStyle(fontSize: 28, fontWeight: FontWeight.bold))]), actions: [TextButton(onPressed: () { Navigator.pop(ctx); Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const HomeScreen())); }, child: const Text('Saved'))]));
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Center(child: SingleChildScrollView(
                  padding: const EdgeInsets.all(24),
                  child: Container(
                    padding: const EdgeInsets.all(24), decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(24), boxShadow: [BoxShadow(color: Colors.black12, blurRadius: 20)]),
                    child: Column(mainAxisSize: MainAxisSize.min, children: [
                      const Icon(Icons.school, size: 80, color: Color(0xFFD4AF37)), const SizedBox(height: 16),
                      Text(_reg ? 'Register' : 'Login', style: const TextStyle(fontSize: 24, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 16),
                      Row(mainAxisAlignment: MainAxisAlignment.center, children: [
                        ChoiceChip(label: const Text('Student'), selected: _role == 'Student', onSelected: (v) => setState(() => _role = 'Student')),
                        const SizedBox(width: 8),
                        ChoiceChip(label: const Text('Staff'), selected: _role != 'Student', onSelected: (v) => setState(() => _role = 'Staff')),
                      ]),
                      const SizedBox(height: 16),
                      if (_reg) ...[
                        if (_role != 'Student') DropdownButtonFormField<String>(value: _role, decoration: const InputDecoration(labelText: 'Role'), items: ['Admin', 'Teacher'].map((c) => DropdownMenuItem(value: c, child: Text(c))).toList(), onChanged: (v) => setState(() => _role = v!)),
                        if (_role != 'Student') const SizedBox(height: 16),
                        TextField(controller: _fn, decoration: const InputDecoration(labelText: 'First Name')),
                        const SizedBox(height: 16), TextField(controller: _ln, decoration: const InputDecoration(labelText: 'Last Name')),
                        if (_role == 'Student') ...[
                          const SizedBox(height: 16), DropdownButtonFormField<String>(value: _cls, decoration: const InputDecoration(labelText: 'Class'), items: ['S1','S2','S3','S4','S5','S6'].map((c) => DropdownMenuItem(value: c, child: Text(c))).toList(), onChanged: (v) => setState(() => _cls = v!)),
                        ],
                      ] else TextField(controller: _code, textAlign: TextAlign.center, style: const TextStyle(letterSpacing: 4, fontWeight: FontWeight.bold), decoration: const InputDecoration(labelText: 'Access Code')),
                      const SizedBox(height: 24),
                      SizedBox(width: double.infinity, height: 50, child: ElevatedButton(onPressed: _load ? null : _auth, child: _load ? const CircularProgressIndicator() : Text(_reg ? 'Register' : 'Access App'))),
                      TextButton(onPressed: () => setState(() => _reg = !_reg), child: Text(_reg ? 'Login instead' : 'Register here')),
                    ]),
                  ),
                )),
              );
            }
          }
          EOF

          cat > lib/screens/home.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'feed.dart'; import 'study.dart'; import 'hub.dart'; import 'profile.dart'; import 'anonymous.dart'; import 'alumni.dart'; import 'inbox.dart';

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});
            @override State<HomeScreen> createState() => _HomeScreenState();
          }
          class _HomeScreenState extends State<HomeScreen> {
            int _i = 0; String _code = ''; String _cls = 'S1'; String _name = '';
            @override void initState() { super.initState(); _load(); }
            void _load() async {
              final p = await SharedPreferences.getInstance();
              if (mounted) setState(() { _code = p.getString('unitCode') ?? ''; _cls = p.getString('classLevel') ?? 'S1'; _name = p.getString('fullName') ?? _code; });
            }
            @override
            Widget build(BuildContext context) {
              if (_code.isEmpty) return const Scaffold(body: Center(child: CircularProgressIndicator()));
              if (_cls == 'Omicron') return AlumniHub(myCode: _code, myName: _name);
              final pages = [FeedScreen(name: _name), const StudyScreen(), HubScreen(name: _name, code: _code, cls: _cls), InboxScreen(myCode: _code, myName: _name), const AnonymousBoard(), ProfileScreen(code: _code, name: _name)];
              return Scaffold(
                body: pages[_i],
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: _i, onTap: (v) => setState(() => _i = v), type: BottomNavigationBarType.fixed, selectedFontSize: 10, unselectedFontSize: 10,
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.home_filled), label: 'Feed'),
                    BottomNavigationBarItem(icon: Icon(Icons.menu_book), label: 'Library'),
                    BottomNavigationBarItem(icon: Icon(Icons.forum), label: 'Groups'),
                    BottomNavigationBarItem(icon: Icon(Icons.mail), label: 'Inbox'),
                    BottomNavigationBarItem(icon: Icon(Icons.masks), label: 'Anon'),
                    BottomNavigationBarItem(icon: Icon(Icons.person), label: 'Profile')
                  ]
                )
              );
            }
          }
          EOF

          cat > lib/screens/alumni.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'chat.dart';

          class AlumniHub extends StatelessWidget {
            final String myCode; final String myName;
            const AlumniHub({super.key, required this.myCode, required this.myName});

            @override
            Widget build(BuildContext context) {
