          cat > lib/screens/admin_chat.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:firebase_storage/firebase_storage.dart';
          import 'package:file_picker/file_picker.dart';
          import 'dart:io';

          class AdminChat extends StatefulWidget {
            const AdminChat({super.key});
            @override
            State<AdminChat> createState() => _AdminChatState();
          }
          class _AdminChatState extends State<AdminChat> {
            final _c = TextEditingController();
            void _sendMedia() async {
              FilePickerResult? r = await FilePicker.platform.pickFiles(type: FileType.any);
              if (r != null) {
                final ref = FirebaseStorage.instance.ref().child('chat/${DateTime.now().millisecondsSinceEpoch}');
                await ref.putFile(File(r.files.single.path!));
                String url = await ref.getDownloadURL();
                await FirebaseFirestore.instance.collection('chats').doc('All').collection('msgs').add({'sender': 'Admin', 'text': 'Sent an attachment', 'type': 'doc', 'url': url, 'time': FieldValue.serverTimestamp()});
              }
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('School Chat')),
                body: Column(
                  children: [
                    Expanded(
                      child: StreamBuilder<QuerySnapshot>(
                        stream: FirebaseFirestore.instance.collection('chats').doc('All').collection('msgs').orderBy('time', descending: false).snapshots(),
                        builder: (c, s) {
                          if (!s.hasData) return const Center(child: CircularProgressIndicator());
                          return ListView.builder(
                            itemCount: s.data!.docs.length,
                            itemBuilder: (c, i) {
                              final d = s.data!.docs[i].data() as Map<String, dynamic>;
                              final isMe = d['sender'] == 'Admin';
                              return Align(
                                alignment: isMe ? Alignment.centerRight : Alignment.centerLeft,
                                child: Container(
                                  margin: const EdgeInsets.all(8),
                                  padding: const EdgeInsets.all(12),
                                  decoration: BoxDecoration(color: isMe ? const Color(0xFF0A3D91) : Colors.grey[800], borderRadius: BorderRadius.circular(16)),
                                  child: Text(d['text'], style: const TextStyle(color: Colors.white))
                                )
                              );
                            }
                          );
                        }
                      )
                    ),
                    Padding(
                      padding: const EdgeInsets.all(8),
                      child: Row(
                        children: [
                          IconButton(icon: const Icon(Icons.add), onPressed: _sendMedia),
                          Expanded(child: TextField(controller: _c, decoration: const InputDecoration(hintText: 'Broadcast...', border: OutlineInputBorder()))),
                          IconButton(
                            icon: const Icon(Icons.send),
                            onPressed: () async {
                              if (_c.text.isNotEmpty) {
                                await FirebaseFirestore.instance.collection('chats').doc('All').collection('msgs').add({'sender': 'Admin', 'text': _c.text, 'time': FieldValue.serverTimestamp()});
                                _c.clear();
                              }
                            }
                          )
                        ]
                      )
                    )
                  ]
                )
              );
            }
          }
          EOF

      - name: Decode Google Services JSON (Admin)
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | tr -d '[:space:]' | base64 -d > admin_app/android/app/google-services.json

      - name: Build Admin APK
        run: |
          cd admin_app
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
          flutter build apk --release

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: staff-hub-apk
          path: admin_app/build/app/outputs/flutter-apk/app-release.apk
