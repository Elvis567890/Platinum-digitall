          # --- CHAT.DART ---
          cat > lib/screens/chat.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:firebase_storage/firebase_storage.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:cached_network_image/cached_network_image.dart';
          import 'package:video_player/video_player.dart';
          import 'package:audioplayers/audioplayers.dart';
          import 'package:url_launcher/url_launcher.dart';
          import 'dart:io';

          class ChatScreen extends StatefulWidget {
            final String room; final String userCode; final String userName;
            const ChatScreen({super.key, required this.room, required this.userCode, required this.userName});
            @override State<ChatScreen> createState() => _ChatScreenState();
          }
          class _ChatScreenState extends State<ChatScreen> {
            final _c = TextEditingController(); bool _uploading = false;

            Future<void> _sendMedia(String kind) async {
              FilePickerResult? r;
              switch (kind) { case 'image': r = await FilePicker.platform.pickFiles(type: FileType.image); break; case 'video': r = await FilePicker.platform.pickFiles(type: FileType.video); break; case 'audio': r = await FilePicker.platform.pickFiles(type: FileType.audio); break; default: r = await FilePicker.platform.pickFiles(type: FileType.any); }
              if (r == null) return;
              setState(() => _uploading = true);
              try {
                final file = r.files.single;
                final ref = FirebaseStorage.instance.ref().child('chat/${DateTime.now().millisecondsSinceEpoch}_${file.name}');
                await ref.putFile(File(file.path!));
                final url = await ref.getDownloadURL();
                await FirebaseFirestore.instance.collection('chats').doc(widget.room).collection('msgs').add({'senderCode': widget.userCode, 'senderName': widget.userName, 'text': '', 'type': kind, 'url': url, 'fileName': file.name, 'time': FieldValue.serverTimestamp()});
              } catch (e) { if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('Upload failed: $e'))); } finally { if (mounted) setState(() => _uploading = false); }
            }

            void _showAttachMenu() {
              showModalBottomSheet(context: context, shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(24))), builder: (ctx) => SafeArea(child: Wrap(children: [
                ListTile(leading: const Icon(Icons.image, color: Colors.blueAccent), title: const Text('Image'), onTap: () { Navigator.pop(ctx); _sendMedia('image'); }),
                ListTile(leading: const Icon(Icons.videocam, color: Colors.redAccent), title: const Text('Video'), onTap: () { Navigator.pop(ctx); _sendMedia('video'); }),
                ListTile(leading: const Icon(Icons.audiotrack, color: Colors.orangeAccent), title: const Text('Audio'), onTap: () { Navigator.pop(ctx); _sendMedia('audio'); }),
                ListTile(leading: const Icon(Icons.insert_drive_file, color: Colors.grey), title: const Text('File'), onTap: () { Navigator.pop(ctx); _sendMedia('file'); }),
              ])));
            }

            Future<void> _sendText() async {
              if (_c.text.trim().isEmpty) return;
              await FirebaseFirestore.instance.collection('chats').doc(widget.room).collection('msgs').add({'senderCode': widget.userCode, 'senderName': widget.userName, 'text': _c.text.trim(), 'type': 'text', 'time': FieldValue.serverTimestamp()});
              _c.clear();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text(widget.room.replaceAll('_', ' '))),
                body: Column(
                  children: [
                    if (_uploading) const LinearProgressIndicator(color: Color(0xFFC62828)),
                    Expanded(
                      child: StreamBuilder<QuerySnapshot>(
                        stream: FirebaseFirestore.instance.collection('chats').doc(widget.room).collection('msgs').orderBy('time').snapshots(),
                        builder: (c, s) {
                          if (!s.hasData) return const Center(child: CircularProgressIndicator());
                          return ListView.builder(
                            padding: const EdgeInsets.all(16),
                            itemCount: s.data!.docs.length,
                            itemBuilder: (c, i) {
                              final d = s.data!.docs[i].data() as Map<String, dynamic>;
                              final isMe = d['senderCode'] == widget.userCode;
                              return Align(
                                alignment: isMe ? Alignment.centerRight : Alignment.centerLeft,
                                child: Container(
                                  margin: const EdgeInsets.only(bottom: 8),
                                  padding: const EdgeInsets.all(12),
                                  decoration: BoxDecoration(
                                    color: isMe ? const Color(0xFFC62828) : Colors.white,
                                    borderRadius: BorderRadius.circular(12)
                                  ),
                                  child: Column(
                                    crossAxisAlignment: CrossAxisAlignment.start,
                                    children: [
                                      if (!isMe) Text(d['senderName'] ?? 'Unknown', style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 12, color: Color(0xFFC62828))),
                                      if (d['type'] == 'text') Text(d['text'] ?? '', style: TextStyle(color: isMe ? Colors.white : Colors.black)),
                                      if (d['type'] == 'image') ClipRRect(borderRadius: BorderRadius.circular(8), child: CachedNetworkImage(imageUrl: d['url'], width: 200, height: 200, fit: BoxFit.cover)),
                                      if (d['type'] == 'video') GestureDetector(onTap: () => Navigator.push(context, MaterialPageRoute(builder: (_) => _VideoScreen(url: d['url']))), child: Container(width: 200, height: 150, color: Colors.black54, child: const Icon(Icons.play_circle_fill, color: Colors.white, size: 50))),
                                      if (d['type'] == 'audio') _AudioBubble(url: d['url']),
                                      if (d['url'] != null && d['type'] != 'image' && d['type'] != 'video' && d['type'] != 'audio') InkWell(onTap: () => launchUrl(Uri.parse(d['url'])), child: Text(d['fileName'] ?? 'File', style: const TextStyle(color: Colors.blueAccent, decoration: TextDecoration.underline))),
                                      Padding(padding: const EdgeInsets.only(top: 4), child: Text(_formatTime(d['time']), style: TextStyle(fontSize: 8, color: isMe ? Colors.white70 : Colors.grey))),
                                    ]
                                  )
                                )
                              );
                            }
                          );
                        }
                      )
                    ),
                    SafeArea(
                      child: Padding(
                        padding: const EdgeInsets.all(8),
                        child: Row(
                          children: [
                            IconButton(icon: const Icon(Icons.add_circle, color: Color(0xFFC62828)), onPressed: _showAttachMenu),
                            Expanded(child: TextField(controller: _c, decoration: InputDecoration(hintText: 'Message...', filled: true, fillColor: Colors.white, border: OutlineInputBorder(borderRadius: BorderRadius.circular(24), borderSide: BorderSide.none)))),
                            IconButton(icon: const Icon(Icons.send, color: Color(0xFFC62828)), onPressed: _sendText)
                          ]
                        )
                      )
                    )
                  ]
                )
              );
            }
            String _formatTime(dynamic t) { if (t is Timestamp) { final d = t.toDate(); return '${d.hour}:${d.minute}'; } return ''; }
          }

          class _AudioBubble extends StatefulWidget { final String url; const _AudioBubble({required this.url}); @override State<_AudioBubble> createState() => _AudioBubbleState(); }
          class _AudioBubbleState extends State<_AudioBubble> { final _p = AudioPlayer(); bool _playing = false; @override void dispose() { _p.dispose(); super.dispose(); } @override Widget build(BuildContext context) => Row(mainAxisSize: MainAxisSize.min, children: [IconButton(icon: Icon(_playing ? Icons.pause : Icons.play_arrow, color: const Color(0xFFC62828)), onPressed: () { if (_playing) { _p.pause(); } else { _p.play(UrlSource(widget.url)); } setState(() => _playing = !_playing); }), const Text('Voice Note')]); }

          class _VideoScreen extends StatefulWidget { final String url; const _VideoScreen({required this.url}); @override State<_VideoScreen> createState() => _VideoScreenState(); }
          class _VideoScreenState extends State<_VideoScreen> { late VideoPlayerController _c; @override void initState() { super.initState(); _c = VideoPlayerController.networkUrl(Uri.parse(widget.url))..initialize().then((_) { setState(() {}); _c.play(); }); } @override void dispose() { _c.dispose(); super.dispose(); } @override Widget build(BuildContext context) => Scaffold(backgroundColor: Colors.black, appBar: AppBar(backgroundColor: Colors.black), body: Center(child: _c.value.isInitialized ? AspectRatio(aspectRatio: _c.value.aspectRatio, child: VideoPlayer(_c)) : const CircularProgressIndicator())); }
          EOF

