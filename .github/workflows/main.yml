            const BroadcastScreen({super.key});
            @override State<BroadcastScreen> createState() => _BroadcastScreenState();
          }
          class _BroadcastScreenState extends State<BroadcastScreen> {
            final _roomCtrl = TextEditingController();
            final _titleCtrl = TextEditingController();

            Future<void> _startLive() async {
              if (_roomCtrl.text.isEmpty) return;
              
              await FirebaseFirestore.instance.collection('live_classes').add({
                'title': _titleCtrl.text.isEmpty ? 'Live Class' : _titleCtrl.text.trim(),
                'room': _roomCtrl.text.trim(),
                'time': FieldValue.serverTimestamp(),
              });

              try {
                var options = JitsiMeetConferenceOptions(
                  room: _roomCtrl.text.trim(),
                  featureFlags: {
                    FeatureFlags.welcomePageEnabled: false,
                    FeatureFlags.preJoinPageEnabled: false,
                  },
                );
                await JitsiMeet().join(options);
