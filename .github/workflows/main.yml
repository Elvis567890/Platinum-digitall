          import 'package:flutter/material.dart';
          import '../services/db.dart';
          class ManageStaff extends StatefulWidget {
            const ManageStaff({super.key});
            @override
            State<ManageStaff> createState() => _ManageStaffState();
          }
          class _ManageStaffState extends State<ManageStaff> {
            List<Map<String, dynamic>> _s = [];
            @override
            void initState() {
              super.initState();
              _load();
            }
            void _load() async {
              final d = await (await DB.instance.db).query('staff');
              setState(() => _s = d);
            }
            void _add() {
              final p = TextEditingController();
              showDialog(
                context: context,
                builder: (c) => AlertDialog(
                  backgroundColor: const Color(0xFF131A26),
                  title: const Text('Add Staff PIN'),
                  content: TextField(controller: p),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(c), child: const Text('Cancel')),
                    ElevatedButton(
                      onPressed: () async {
                        await (await DB.instance.db).insert('staff', {'pin': p.text, 'role': 'teacher'});
                        _load();
                        if (mounted) Navigator.pop(c);
                      },
                      child: const Text('Create')
                    )
                  ]
                )
              );
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Manage Staff')),
                body: ListView.builder(
                  itemCount: _s.length,
                  itemBuilder: (c, i) => ListTile(leading: const Icon(Icons.person), title: Text('Staff ${_s[i]['id']}'), subtitle: Text(_s[i]['role']))
                ),
                floatingActionButton: FloatingActionButton(onPressed: _add, backgroundColor: const Color(0xFFD4AF37), child: const Icon(Icons.add, color: Colors.black))
              );
            }
          }
