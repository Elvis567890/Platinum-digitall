name: Build Platinum Ecosystem (Feature Verified)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1: BUILD THE STUDENT APP (PLATINUM PULSE)
  # ==========================================
  build-student:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Student App Code
        run: |
          # 1. LOGO & SPLASH (FULL BADGE)
          mkdir -p student_app/assets
          LOGO_SOURCE=$(find . -maxdepth 1 -iname "*inshot*" | head -n 1)
          if [ -n "$LOGO_SOURCE" ] && [ -f "$LOGO_SOURCE" ]; then convert "$LOGO_SOURCE" -resize 1024x1024 student_app/assets/logo.png; else printf "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > student_app/assets/logo.png; fi

          # 2. CREATE PROJECT & GRADLE SETUP
          flutter create --org com.platinum --project-name student_app student_app
          mkdir -p student_app/lib/screens
          mkdir -p student_app/lib/models
          mkdir -p student_app/lib/services

          sed -i 's/android:label="student_app"/android:label="Platinum Pulse"/g' student_app/android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\/>' student_app/android/app/src/main/AndroidManifest.xml
          
          sed -i 's/distributionUrl=.*/distributionUrl=https\\:\/\/services.gradle.org\/distributions\/gradle-9.3.1-all.zip/g' student_app/android/gradle/wrapper/gradle-wrapper.properties
          echo "android.newDsl=false" >> student_app/android/gradle.properties
          echo "android.builtInKotlin=false" >> student_app/android/gradle.properties

          cat > student_app/android/app/build.gradle.kts << 'GRADLEKTS'
          plugins {
              id("com.android.application")
              id("dev.flutter.flutter-gradle-plugin")
              id("com.google.gms.google-services")
          }
          configure<com.android.build.api.dsl.ApplicationExtension> {
              namespace = "com.platinum.student_app"
              compileSdk = 36
              ndkVersion = "27.0.12077973"
              lint { checkReleaseBuilds = false; abortOnError = false }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              defaultConfig { applicationId = "com.platinum.student_app"; minSdk = 23; targetSdk = 36; versionCode = flutter.versionCode; versionName = flutter.versionName; multiDexEnabled = true }
              buildTypes { release { signingConfig = signingConfigs.getByName("debug") } }
          }
          flutter { source = "../.." }
          dependencies {
              implementation(platform("com.google.firebase:firebase-bom:35.0.2"))
              implementation("com.google.firebase:firebase-analytics")
          }
          GRADLEKTS

          cat > student_app/android/settings.gradle.kts << 'SETTINGS'
          pluginManagement {
              val flutterSdkPath = run {
                  val properties = java.util.Properties()
                  file("local.properties").inputStream().use { properties.load(it) }
                  val flutterSdkPath = properties.getProperty("flutter.sdk")
                  require(flutterSdkPath != null) { "flutter.sdk not set in local.properties" }
                  flutterSdkPath
              }
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          plugins {
              id("dev.flutter.flutter-plugin-loader") version "1.0.0"
              id("com.android.application") version "8.3.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
              id("com.google.gms.google-services") version "4.5.0" apply false
          }
          include(":app")
          SETTINGS

          # 3. DEPENDENCIES
          cd student_app
          flutter pub add firebase_core cloud_firestore firebase_storage image_picker video_player cached_network_image path_provider dio google_fonts sqflite path jitsi_meet_flutter_sdk url_launcher
          flutter pub add --dev flutter_launcher_icons flutter_native_splash

          cat >> pubspec.yaml << 'STUPUB'
          flutter_launcher_icons:
            android: "launcher_icon"
            image_path: "assets/logo.png"
          flutter_native_splash:
            color: "#0A3D91"
            image: assets/logo.png
            web: false
            android_12:
              image: assets/logo.png
              icon_background_color: "#0A3D91"
          STUPUB

          # 4. WRITE STUDENT CODE
          cat > lib/models/post_model.dart << 'MODEL'
          import 'package:cloud_firestore/cloud_firestore.dart';
          class Post {
            final String id; final String author; final String content; final String type; final String? mediaUrl; final DateTime timestamp; final List<String> likes; final int commentCount;
            Post({required this.id, required this.author, required this.content, required this.type, this.mediaUrl, required this.timestamp, required this.likes, required this.commentCount});
            factory Post.fromFirestore(DocumentSnapshot doc) {
              Map data = doc.data() as Map<String, dynamic>;
              return Post(id: doc.id, author: data['author'] ?? 'Unknown', content: data['content'] ?? '', type: data['type'] ?? 'text', mediaUrl: data['mediaUrl'], timestamp: (data['timestamp'] as Timestamp).toDate(), likes: List<String>.from(data['likes'] ?? []), commentCount: data['commentCount'] ?? 0);
            }
          }
          MODEL

          cat > lib/services/database_helper.dart << 'DBHELP'
          import 'package:sqflite/sqflite.dart';
          import 'package:path/path.dart';
          class DatabaseHelper {
            static final DatabaseHelper instance = DatabaseHelper._init();
            static Database? _database;
            DatabaseHelper._init();
            Future<Database> get database async { if (_database != null) return _database!; _database = await _initDB('platinum_student.db'); return _database!; }
            Future<Database> _initDB(String filePath) async { final dbPath = await getDatabasesPath(); return await openDatabase(join(dbPath, filePath), version: 1, onCreate: _createDB); }
            Future _createDB(Database db, int version) async { await db.execute('CREATE TABLE students (id INTEGER PRIMARY KEY AUTOINCREMENT, fullName TEXT, classLevel TEXT)'); }
            Future<Map<String, dynamic>> getStudent() async { final db = await database; final res = await db.query('students', limit: 1); return res.isNotEmpty ? res.first : {}; }
          }
          DBHELP

          cat > lib/main.dart << 'STUMAIN'
          import 'package:flutter/material.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:google_fonts/google_fonts.dart';
          import 'screens/registration.dart';
          import 'screens/home.dart';
          import 'services/database_helper.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Firebase.initializeApp(options: const FirebaseOptions(apiKey: "AIzaSyDNQ2VcWL2_Q6rkbu5TGBGqOATBxP8B5DY", authDomain: "platinum-pulse.firebaseapp.com", projectId: "platinum-pulse", storageBucket: "platinum-pulse.firebasestorage.app", messagingSenderId: "221762575431", appId: "1:221762575431:web:95054f123b6a98647f6562"));
            runApp(const PlatinumStudentApp());
          }

          class PlatinumStudentApp extends StatelessWidget {
            const PlatinumStudentApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(title: 'Platinum Pulse', debugShowCheckedModeBanner: false, theme: ThemeData(primaryColor: const Color(0xFF0A3D91), scaffoldBackgroundColor: const Color(0xFFF4F7FC), useMaterial3: true, textTheme: GoogleFonts.poppinsTextTheme(Theme.of(context).textTheme)), home: const StartupScreen());
            }
          }

          class StartupScreen extends StatefulWidget {
            const StartupScreen({super.key});
            @override State<StartupScreen> createState() => _StartupScreenState();
          }
          class _StartupScreenState extends State<StartupScreen> {
            @override void initState() { super.initState(); _check(); }
            Future<void> _check() async {
              final db = await DatabaseHelper.instance.database;
              final result = await db.query('students', limit: 1);
              if (mounted) Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => result.isEmpty ? const RegistrationScreen() : const HomeScreen()));
            }
            @override Widget build(BuildContext context) => const Scaffold(body: Center(child: CircularProgressIndicator(color: Color(0xFF0A3D91))));
          }
          STUMAIN

          cat > lib/screens/registration.dart << 'REG'
          import 'package:flutter/material.dart';
          import '../services/database_helper.dart';
          import 'home.dart';
          class RegistrationScreen extends StatefulWidget {
            const RegistrationScreen({super.key});
            @override State<RegistrationScreen> createState() => _RegistrationScreenState();
          }
          class _RegistrationScreenState extends State<RegistrationScreen> {
            final _name = TextEditingController(); String _class = 'S1';
            void _register() async {
              if (_name.text.isEmpty) return;
              await (await DatabaseHelper.instance.database).insert('students', {'fullName': _name.text, 'classLevel': _class});
              if (mounted) Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const HomeScreen()));
            }
            @override Widget build(BuildContext context) {
              return Scaffold(body: Container(decoration: const BoxDecoration(gradient: LinearGradient(begin: Alignment.topCenter, end: Alignment.bottomCenter, colors: [Color(0xFF0A3D91), Color(0xFF051C45)])), child: Center(child: SingleChildScrollView(padding: const EdgeInsets.all(24), child: Card(elevation: 10, shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(20)), child: Padding(padding: const EdgeInsets.all(32), child: Column(mainAxisSize: MainAxisSize.min, children: [
                Image.asset('assets/logo.png', height: 100), const SizedBox(height: 16), const Text('Student Registration', style: TextStyle(fontSize: 24, fontWeight: FontWeight.bold, color: Color(0xFF0A3D91))), const SizedBox(height: 32),
                TextField(controller: _name, decoration: const InputDecoration(labelText: 'Full Name', prefixIcon: Icon(Icons.person))), const SizedBox(height: 16),
                DropdownButtonFormField<String>(value: _class, decoration: const InputDecoration(labelText: 'Class', prefixIcon: Icon(Icons.school)), items: ['S1', 'S2', 'S3', 'S4', 'S5', 'S6'].map((c) => DropdownMenuItem(value: c, child: Text(c))).toList(), onChanged: (v) => setState(() => _class = v!)), const SizedBox(height: 32),
                SizedBox(width: double.infinity, height: 50, child: ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFF4B41A)), onPressed: _register, child: const Text('Register', style: TextStyle(fontSize: 18, color: Colors.white, fontWeight: FontWeight.bold)))),
              ])))))));
            }
          }
          REG

          cat > lib/screens/home.dart << 'HOME'
          import 'package:flutter/material.dart';
          import 'platinum_pulse.dart';
          import 'study_hub.dart';
          import 'announcements.dart';
          import 'reports.dart';
          import 'hub.dart';
          import '../services/database_helper.dart';

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});
            @override State<HomeScreen> createState() => _HomeScreenState();
          }
          class _HomeScreenState extends State<HomeScreen> {
            int _index = 0; String _name = 'Loading...'; String _class = '';
            @override void initState() { super.initState(); _loadUser(); }
            void _loadUser() async { final data = await DatabaseHelper.instance.getStudent(); if (mounted && data.isNotEmpty) setState(() { _name = data['fullName']; _class = data['classLevel']; }); }

            @override Widget build(BuildContext context) {
              final pages = [PlatinumPulseScreen(studentName: _name), StudyHubScreen(), AnnouncementsScreen(), ReportsScreen(), HubScreen(studentClass: _class)];
              return Scaffold(body: _index == 0 ? pages[0] : pages[_index], bottomNavigationBar: Container(decoration: BoxDecoration(boxShadow: [BoxShadow(color: Colors.black.withOpacity(0.05), blurRadius: 10, offset: const Offset(0, -5))]), child: BottomNavigationBar(currentIndex: _index, onTap: (i) => setState(() => _index = i), selectedItemColor: const Color(0xFF0A3D91), unselectedItemColor: Colors.grey, type: BottomNavigationBarType.fixed, backgroundColor: Colors.white, elevation: 0, items: const [
                BottomNavigationBarItem(icon: Icon(Icons.dynamic_feed), label: 'Pulse'), BottomNavigationBarItem(icon: Icon(Icons.school), label: 'Study'), BottomNavigationBarItem(icon: Icon(Icons.campaign), label: 'Alerts'), BottomNavigationBarItem(icon: Icon(Icons.description), label: 'Reports'), BottomNavigationBarItem(icon: Icon(Icons.grid_view), label: 'Hub'),
              ])));
            }
          }
          HOME

          cat > lib/screens/platinum_pulse.dart << 'PULSE'
          import 'package:flutter/material.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:firebase_storage/firebase_storage.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:video_player/video_player.dart';
          import 'package:cached_network_image/cached_network_image.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:dio/dio.dart';
          import 'dart:io';
          import '../models/post_model.dart';

          class PlatinumPulseScreen extends StatefulWidget {
            final String studentName;
            const PlatinumPulseScreen({super.key, required this.studentName});
            @override State<PlatinumPulseScreen> createState() => _PlatinumPulseScreenState();
          }
          class _PlatinumPulseScreenState extends State<PlatinumPulseScreen> {
            final TextEditingController _postController = TextEditingController();
            bool _isUploading = false;

            Future<void> _createPost(String type) async {
              String? mediaUrl;
              if (type != 'text') {
                final picker = ImagePicker();
                XFile? file = type == 'image' ? await picker.pickImage(source: ImageSource.gallery) : await picker.pickVideo(source: ImageSource.gallery);
                if (file == null) return;
                setState(() => _isUploading = true);
                try {
                  String fileName = DateTime.now().millisecondsSinceEpoch.toString();
                  Reference ref = FirebaseStorage.instance.ref().child('posts/$fileName');
                  await ref.putFile(File(file.path));
                  mediaUrl = await ref.getDownloadURL();
                } catch (e) { setState(() => _isUploading = false); ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('Upload failed: $e'))); return; }
              }
              await FirebaseFirestore.instance.collection('posts').add({'author': widget.studentName, 'content': _postController.text.trim(), 'type': type, 'mediaUrl': mediaUrl, 'timestamp': FieldValue.serverTimestamp(), 'likes': [], 'commentCount': 0});
              _postController.clear(); setState(() => _isUploading = false);
            }

            Future<void> _toggleLike(Post post) async {
              final docRef = FirebaseFirestore.instance.collection('posts').doc(post.id);
              if (post.likes.contains(widget.studentName)) { await docRef.update({'likes': FieldValue.arrayRemove([widget.studentName])}); } else { await docRef.update({'likes': FieldValue.arrayUnion([widget.studentName])}); }
            }

            Future<void> _downloadMedia(String url) async {
              try {
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Downloading...')));
                final dir = await getApplicationDocumentsDirectory();
                final filePath = '${dir.path}/platinum_${DateTime.now().millisecondsSinceEpoch}.mp4';
                await Dio().download(url, filePath);
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Saved to phone storage!')));
              } catch (e) { ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('Download failed: $e'))); }
            }

            @override Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(backgroundColor: const Color(0xFF0A3D91), foregroundColor: Colors.white, title: Row(mainAxisAlignment: MainAxisAlignment.spaceBetween, children: [
                  Container(padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 6), decoration: BoxDecoration(color: Colors.orange.withOpacity(0.2), borderRadius: BorderRadius.circular(20)), child: const Row(children: [Text('🔥', style: TextStyle(fontSize: 16)), SizedBox(width: 4), Text('7 DAYS', style: TextStyle(fontWeight: FontWeight.bold, color: Colors.orange, fontSize: 12))])),
                  Container(padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 6), decoration: BoxDecoration(color: const Color(0xFFF4B41A).withOpacity(0.2), borderRadius: BorderRadius.circular(20)), child: const Row(children: [Text('💎', style: TextStyle(fontSize: 16)), SizedBox(width: 4), Text('1,240', style: TextStyle(fontWeight: FontWeight.bold, color: Color(0xFFF4B41A), fontSize: 12))]))
                ])),
                body: Column(children: [
                  Padding(padding: const EdgeInsets.all(12), child: Row(children: [
                    Expanded(child: TextField(controller: _postController, decoration: InputDecoration(hintText: 'What\'s on your mind?', filled: true, fillColor: Colors.grey[200], border: OutlineInputBorder(borderRadius: BorderRadius.circular(30), borderSide: BorderSide.none)))),
                    IconButton(icon: const Icon(Icons.image, color: Color(0xFF0A3D91)), onPressed: () => _createPost('image')),
                    IconButton(icon: const Icon(Icons.videocam, color: Color(0xFF0A3D91)), onPressed: () => _createPost('video')),
                    if (_postController.text.isNotEmpty) IconButton(icon: const Icon(Icons.send, color: Color(0xFFF4B41A)), onPressed: () => _createPost('text')),
                  ])),
                  if (_isUploading) const LinearProgressIndicator(),
                  Expanded(child: StreamBuilder<QuerySnapshot>(
                    stream: FirebaseFirestore.instance.collection('posts').orderBy('timestamp', descending: true).snapshots(),
                    builder: (context, snapshot) {
                      if (!snapshot.hasData) return const Center(child: CircularProgressIndicator());
                      final posts = snapshot.data!.docs.map((doc) => Post.fromFirestore(doc)).toList();
                      return ListView.builder(padding: const EdgeInsets.all(12), itemCount: posts.length, itemBuilder: (context, index) {
                        final post = posts[index];
                        final isLiked = post.likes.contains(widget.studentName);
                        return Card(margin: const EdgeInsets.only(bottom: 16), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)), child: Padding(padding: const EdgeInsets.all(16), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                          Row(children: [CircleAvatar(backgroundColor: const Color(0xFF0A3D91), child: Text(post.author[0], style: const TextStyle(color: Colors.white))), const SizedBox(width: 12), Text(post.author, style: const TextStyle(fontWeight: FontWeight.bold))]),
                          const SizedBox(height: 12), Text(post.content),
                          if (post.type == 'image' && post.mediaUrl != null) Padding(padding: const EdgeInsets.only(top: 12), child: ClipRRect(borderRadius: BorderRadius.circular(12), child: CachedNetworkImage(imageUrl: post.mediaUrl!, height: 200, width: double.infinity, fit: BoxFit.cover))),
                          if (post.type == 'video' && post.mediaUrl != null) Padding(padding: const EdgeInsets.only(top: 12), child: _VideoPlayerWidget(url: post.mediaUrl!)),
                          const Divider(height: 30),
                          Row(mainAxisAlignment: MainAxisAlignment.spaceAround, children: [
                            GestureDetector(onTap: () => _toggleLike(post), child: Row(children: [Icon(isLiked ? Icons.favorite : Icons.favorite_border, color: isLiked ? Colors.red : Colors.grey), const SizedBox(width: 4), Text('${post.likes.length}', style: TextStyle(color: isLiked ? Colors.red : Colors.grey))])),
                            GestureDetector(onTap: () => _showComments(context, post.id), child: Row(children: [const Icon(Icons.comment, color: Colors.grey), const SizedBox(width: 4), Text('${post.commentCount}', style: const TextStyle(color: Colors.grey))])),
                            if (post.mediaUrl != null) IconButton(icon: const Icon(Icons.download, color: Colors.grey), onPressed: () => _downloadMedia(post.mediaUrl!)),
                          ])
                        ]))); 
                      });
                    }
                  )),
                ]),
              );
            }
            void _showComments(BuildContext context, String postId) {
              showModalBottomSheet(context: context, isScrollControlled: true, builder: (context) => Padding(padding: EdgeInsets.only(bottom: MediaQuery.of(context).viewInsets.bottom, top: 20, left: 20, right: 20), child: Column(mainAxisSize: MainAxisSize.min, children: [
                const Text('Comments', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 18)), const SizedBox(height: 16),
                TextField(decoration: const InputDecoration(hintText: 'Write a comment...', border: OutlineInputBorder()), onSubmitted: (val) async {
                  if (val.isNotEmpty) { await FirebaseFirestore.instance.collection('posts').doc(postId).update({'commentCount': FieldValue.increment(1)}); Navigator.pop(context); }
                }), const SizedBox(height: 20),
              ])));
            }
          }

          class _VideoPlayerWidget extends StatefulWidget {
            final String url; const _VideoPlayerWidget({required this.url}); @override State<_VideoPlayerWidget> createState() => _VideoPlayerWidgetState();
          }
          class _VideoPlayerWidgetState extends State<_VideoPlayerWidget> {
            late VideoPlayerController _controller; bool _isInitialized = false;
            @override void initState() { super.initState(); _controller = VideoPlayerController.networkUrl(Uri.parse(widget.url))..initialize().then((_) { if (mounted) setState(() => _isInitialized = true); }); }
            @override void dispose() { _controller.dispose(); super.dispose(); }
            @override Widget build(BuildContext context) {
              if (!_isInitialized) return const Center(child: CircularProgressIndicator());
              return ClipRRect(borderRadius: BorderRadius.circular(12), child: AspectRatio(aspectRatio: _controller.value.aspectRatio, child: Stack(alignment: Alignment.bottomCenter, children: [
                VideoPlayer(_controller), VideoProgressIndicator(_controller, allowScrubbing: true, colors: const VideoProgressColors(playedColor: Color(0xFFF4B41A))),
                Positioned(bottom: 10, right: 10, child: FloatingActionButton.small(backgroundColor: Colors.black54, onPressed: () { setState(() { _controller.value.isPlaying ? _controller.pause() : _controller.play(); }); }, child: Icon(_controller.value.isPlaying ? Icons.pause : Icons.play_arrow, color: Colors.white)))
              ])));
            }
          }
          PULSE

          cat > lib/screens/study_hub.dart << 'STUDY'
          import 'package:flutter/material.dart';
          import 'package:jitsi_meet_flutter_sdk/jitsi_meet_flutter_sdk.dart';
          class StudyHubScreen extends StatelessWidget {
            const StudyHubScreen({super.key});
            Future<void> _joinLiveClass(BuildContext context) async {
              var options = JitsiMeetConferenceOptions(room: "PlatinumS4Chemistry", configOverrides: {"startWithAudioMuted": false, "startWithVideoMuted": false}, featureFlags: {FeatureFlags.welcomePageEnabled: false, FeatureFlags.preJoinPageEnabled: false});
              try { await JitsiMeet().join(options); } catch (e) { ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('Error: $e'))); }
            }
            @override Widget build(BuildContext context) {
              return Scaffold(appBar: AppBar(title: const Text('Study Hub'), backgroundColor: const Color(0xFF0A3D91), foregroundColor: Colors.white), body: ListView(padding: const EdgeInsets.all(16), children: [
                const Text('Today\'s Live Classes', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)), const SizedBox(height: 12),
                Card(color: const Color(0xFF0A3D91), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)), child: Padding(padding: const EdgeInsets.all(16), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                  const Row(children: [CircleAvatar(backgroundColor: Colors.red, radius: 8), SizedBox(width: 8), Text('LIVE NOW', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold))]), const SizedBox(height: 12),
                  const Text('S4 Chemistry - Mole Concept', style: TextStyle(color: Colors.white, fontSize: 20, fontWeight: FontWeight.bold)), const Text('Mr. Okello (Verified Teacher)', style: TextStyle(color: Colors.white70)), const SizedBox(height: 16),
                  SizedBox(width: double.infinity, child: ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFF4B41A)), onPressed: () => _joinLiveClass(context), child: const Text('Join Class', style: TextStyle(color: Colors.white)))),
                ]))),
                const SizedBox(height: 24), const Text('Recorded Library', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)), const SizedBox(height: 12),
                ListTile(leading: const CircleAvatar(backgroundColor: Color(0xFF0A3D91), child: Icon(Icons.play_arrow, color: Colors.white)), title: const Text('Biology - Cell Structure'), subtitle: const Text('Ms. Nambi • 45 mins • 120MB'), trailing: const Icon(Icons.download)),
              ]));
            }
          }
          STUDY

          cat > lib/screens/reports.dart << 'REP'
          import 'package:flutter/material.dart';
          class ReportsScreen extends StatefulWidget { const ReportsScreen({super.key}); @override State<ReportsScreen> createState() => _ReportsScreenState(); }
          class _ReportsScreenState extends State<ReportsScreen> { final _code = TextEditingController(); bool _unlocked = false;
            @override Widget build(BuildContext context) => Scaffold(appBar: AppBar(title: const Text('My Reports'), backgroundColor: const Color(0xFF0A3D91), foregroundColor: Colors.white), body: Center(child: Padding(padding: const EdgeInsets.all(32), child: _unlocked ? const Text('Report Card PDF Loaded!') : Column(mainAxisAlignment: MainAxisAlignment.center, children: [
