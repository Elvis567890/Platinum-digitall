name: Build Platinum Digital App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # JOB 1: Build the Admin App (Platinum Staff Hub)
  build-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Shared and Admin Code
        run: |
          # 1. SMART LOGO FINDER (Finds your InShot badge)
          mkdir -p admin_app/assets
          LOGO_SOURCE=$(find . -maxdepth 1 -iname "*inshot*.png" | head -n 1)
          if [ -z "$LOGO_SOURCE" ]; then LOGO_SOURCE=$(find . -maxdepth 1 -iname "*.png" | head -n 1); fi
          if [ -n "$LOGO_SOURCE" ]; then 
            cp "$LOGO_SOURCE" admin_app/assets/logo.png;
            echo "Found badge: $LOGO_SOURCE and copied to assets!"
          else 
            echo -n "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > admin_app/assets/logo.png; 
          fi

          # 2. SHARED MODELS
          mkdir -p shared/lib/models
          cat > shared/pubspec.yaml << 'SHAREDPUB'
          name: shared
          description: Shared
          version: 1.0.0
          environment:
            sdk: ">=3.0.0 <4.0.0"
          dependencies:
            crypto: ^3.0.3
          SHAREDPUB

          cat > shared/lib/club.dart << 'CLUB'
          class Club {
            final String id;
            final String name;
            String? headStudentName; 
            Club({required this.id, required this.name, this.headStudentName});
          }
          CLUB

          # 3. ADMIN APP WIRING
          flutter create --org com.platinum --project-name admin_app admin_app
          mkdir -p admin_app/lib/screens

          # CHANGE THE APP NAME ON THE PHONE SCREEN
          sed -i 's/android:label="admin_app"/android:label="Platinum Staff Hub"/g' admin_app/android/app/src/main/AndroidManifest.xml

          cat > admin_app/pubspec.yaml << 'ADMINPUB'
          name: admin_app
          description: Platinum Staff Hub
          version: 1.0.3+4
          environment:
            sdk: ">=3.0.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            shared:
              path: ../shared
            intl: ^0.19.0
            image_picker: ^1.0.7
          dev_dependencies:
            flutter_launcher_icons: "^0.13.1"
            flutter_native_splash: "^2.4.0"
          flutter:
            uses-material-design: true
            assets:
              - assets/
          
          flutter_launcher_icons:
            android: "launcher_icon"
            ios: true
            image_path: "assets/logo.png"
            min_sdk_android: 21
          
          flutter_native_splash:
            color: "#0A3D91"
            image: assets/logo.png
            android_12:
              image: assets/logo.png
              color: "#0A3D91"
          ADMINPUB

          cat > admin_app/lib/main.dart << 'ADMINMAIN'
          import 'package:flutter/material.dart';
          import 'screens/login.dart';

          void main() => runApp(const PlatinumAdminApp());

          class PlatinumAdminApp extends StatelessWidget {
            const PlatinumAdminApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Platinum Staff Hub',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  primaryColor: const Color(0xFF0A3D91),
                  appBarTheme: const AppBarTheme(
                    backgroundColor: Color(0xFF0A3D91),
                    foregroundColor: Colors.white,
                  ),
                ),
                home: const LoginScreen(),
              );
            }
          }
          ADMINMAIN

          cat > admin_app/lib/screens/login.dart << 'LOGIN'
          import 'package:flutter/material.dart';
          import 'dashboard.dart';

          class LoginScreen extends StatefulWidget {
            const LoginScreen({super.key});
            @override
            State<LoginScreen> createState() => _LoginScreenState();
          }

          class _LoginScreenState extends State<LoginScreen> {
            final _id = TextEditingController();
            final _pin = TextEditingController();
            String _role = 'teacher';

            void _login() {
              if (_id.text.isEmpty || _pin.text.isEmpty) return;
              if (_id.text.toUpperCase() == 'SUPER' && _pin.text == '1234') { _role = 'super_admin'; }
              else if (_id.text.toUpperCase() == 'TEACHER' && _pin.text == '1234') { _role = 'teacher'; }
              else if (_id.text.toUpperCase() == 'ADMIN' && _pin.text == '1234') { _role = 'admin'; }

              Navigator.pushReplacement(context, MaterialPageRoute(
                builder: (_) => DashboardScreen(role: _role, name: _id.text),
              ));
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFFF5F7FA),
                body: SafeArea(
                  child: Padding(
                    padding: const EdgeInsets.all(24),
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        Image.asset('assets/logo.png', height: 120, width: 120, fit: BoxFit.contain),
                        const SizedBox(height: 16),
                        const Text('Platinum Staff Hub', style: TextStyle(fontSize: 26, fontWeight: FontWeight.bold, color: Color(0xFF0A3D91))),
                        const SizedBox(height: 8),
                        const Text('Test Login: SUPER / 1234', style: TextStyle(fontSize: 14, color: Colors.red, fontWeight: FontWeight.bold)),
                        const SizedBox(height: 24),
                        TextField(controller: _id, decoration: const InputDecoration(labelText: 'Staff ID', border: OutlineInputBorder())),
                        const SizedBox(height: 16),
                        TextField(controller: _pin, obscureText: true, decoration: const InputDecoration(labelText: 'PIN', border: OutlineInputBorder())),
                        const SizedBox(height: 24),
                        SizedBox(width: double.infinity,
                          child: ElevatedButton(
                            style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF0A3D91), padding: const EdgeInsets.symmetric(vertical: 16)),
                            onPressed: _login,
                            child: const Text('Continue', style: TextStyle(fontSize: 18, color: Colors.white)),
                          )),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          LOGIN

          cat > admin_app/lib/screens/dashboard.dart << 'DASH'
          import 'package:flutter/material.dart';
          import 'announcements.dart';
          import 'marks_submission.dart';
          import 'validation_engine.dart';
          import 'manage_clubs.dart';
          import 'manage_admins.dart';
          import 'coming_soon.dart';

          class DashboardScreen extends StatelessWidget {
            final String role;
            final String name;
            const DashboardScreen({super.key, required this.role, required this.name});

            @override
            Widget build(BuildContext context) {
              final isSuper = role == 'super_admin';
              final isRelease = role == 'release_admin';
              final isTeacher = role == 'teacher';
              
              return Scaffold(
                appBar: AppBar(title: Text('Staff Hub ($role)')),
                body: GridView.count(
                  crossAxisCount: 2,
                  padding: const EdgeInsets.all(16),
                  mainAxisSpacing: 16,
                  crossAxisSpacing: 16,
                  children: [
                    _tile(context, 'Broadcast', Icons.campaign, const AnnouncementsScreen()),
                    _tile(context, 'Marks Submission', Icons.edit_note, const MarksSubmissionScreen()),
                    if (!isTeacher) _tile(context, 'Validation Engine', Icons.checklist, const ValidationEngineScreen()),
                    if (isRelease) _tile(context, 'Release Reports', Icons.lock_open, const ComingSoonScreen(featureName: 'Release Reports')),
                    if (isSuper) _tile(context, 'Manage Clubs', Icons.groups, const ManageClubsScreen()),
                    if (isSuper) _tile(context, 'Manage Staff', Icons.admin_panel_settings, const ManageAdminsScreen()),
                  ],
                ),
              );
            }

            Widget _tile(BuildContext context, String title, IconData icon, Widget screen) {
              return InkWell(
                onTap: () => Navigator.push(context, MaterialPageRoute(builder: (_) => screen)),
                child: Container(
                  decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(12), boxShadow: const [BoxShadow(color: Colors.black12, blurRadius: 6)]),
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Icon(icon, size: 40, color: const Color(0xFF0A3D91)),
                      const SizedBox(height: 12),
                      Padding(
                        padding: const EdgeInsets.symmetric(horizontal: 8),
                        child: Text(title, textAlign: TextAlign.center, style: const TextStyle(fontWeight: FontWeight.w600)),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          DASH

          cat > admin_app/lib/screens/manage_admins.dart << 'MNGADMIN'
          import 'package:flutter/material.dart';

          class ManageAdminsScreen extends StatefulWidget {
            const ManageAdminsScreen({super.key});
            @override
            State<ManageAdminsScreen> createState() => _ManageAdminsScreenState();
          }

          class _ManageAdminsScreenState extends State<ManageAdminsScreen> {
            final List<Map<String, String>> _staff = [
              {'id': 'SUPER', 'role': 'Super Admin'},
              {'id': 'TEACHER1', 'role': 'Teacher'},
            ];

            void _addStaff() {
              final idController = TextEditingController();
              String selectedRole = 'Teacher';
              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: const Text('Register New Staff'),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      TextField(controller: idController, decoration: const InputDecoration(labelText: 'Staff ID')),
                      const SizedBox(height: 12),
                      DropdownButtonFormField<String>(
                        value: selectedRole,
                        decoration: const InputDecoration(labelText: 'Role'),
                        items: const [
                          DropdownMenuItem(value: 'Admin', child: Text('Admin')),
                          DropdownMenuItem(value: 'Teacher', child: Text('Teacher')),
                          DropdownMenuItem(value: 'Release Admin', child: Text('Release Admin')),
                        ],
                        onChanged: (v) => selectedRole = v!,
                      )
                    ],
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('Cancel')),
                    ElevatedButton(
                      onPressed: () {
                        if (idController.text.isNotEmpty) {
                          setState(() { _staff.add({'id': idController.text.toUpperCase(), 'role': selectedRole}); });
                          Navigator.pop(ctx);
                        }
                      },
                      child: const Text('Create'),
                    )
                  ],
                ),
              );
            }

            void _changeRole(Map<String, String> staff) {
              String newRole = staff['role']!;
              showDialog(
                context: context,
                builder: (ctx) => StatefulBuilder(
                  builder: (context, setDialogState) => AlertDialog(
                    title: Text('Change Role for ${staff['id']}'),
                    content: DropdownButtonFormField<String>(
                      value: newRole,
                      decoration: const InputDecoration(labelText: 'Select New Role'),
                      items: const [
                        DropdownMenuItem(value: 'Admin', child: Text('Admin (Promote)')),
                        DropdownMenuItem(value: 'Teacher', child: Text('Teacher (Demote)')),
                        DropdownMenuItem(value: 'Release Admin', child: Text('Release Admin')),
                      ],
                      onChanged: (v) => setDialogState(() => newRole = v!),
                    ),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('Cancel')),
                      ElevatedButton(
                        onPressed: () { setState(() { staff['role'] = newRole; }); Navigator.pop(ctx); },
                        child: const Text('Save Changes'),
                      ),
                    ],
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Manage Staff')),
                body: ListView.builder(
                  padding: const EdgeInsets.all(12),
                  itemCount: _staff.length,
                  itemBuilder: (context, index) {
                    final s = _staff[index];
                    return Card(
                      child: ListTile(
                        leading: const CircleAvatar(backgroundColor: Color(0xFF0A3D91), child: Icon(Icons.person, color: Colors.white)),
                        title: Text(s['id']!, style: const TextStyle(fontWeight: FontWeight.bold)),
                        subtitle: Text(s['role']!),
                        trailing: s['id'] == 'SUPER' ? null : PopupMenuButton<String>(
                          onSelected: (value) {
                            if (value == 'role') _changeRole(s);
                            if (value == 'delete') setState(() => _staff.removeAt(index));
                          },
                          itemBuilder: (context) => [
                            const PopupMenuItem(value: 'role', child: Text('Change Role / Promote')),
                            const PopupMenuItem(value: 'delete', child: Text('Remove Staff', style: TextStyle(color: Colors.red))),
                          ],
                        ),
                      ),
                    );
                  },
                ),
                floatingActionButton: FloatingActionButton.extended(
                  backgroundColor: const Color(0xFF0A3D91),
                  onPressed: _addStaff,
                  icon: const Icon(Icons.add, color: Colors.white),
                  label: const Text('Add Staff', style: TextStyle(color: Colors.white)),
                ),
              );
            }
          }
          MNGADMIN

          cat > admin_app/lib/screens/manage_clubs.dart << 'MNGCLUB'
          import 'package:flutter/material.dart';
          import 'package:shared/club.dart';

          class ManageClubsScreen extends StatefulWidget {
            const ManageClubsScreen({super.key});
            @override
            State<ManageClubsScreen> createState() => _ManageClubsScreenState();
          }

          class _ManageClubsScreenState extends State<ManageClubsScreen> {
            final List<Club> _clubs = [Club(id: '1', name: 'Writers Club', headStudentName: 'Nambi Aisha')];

            void _createClub() {
              final controller = TextEditingController();
              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: const Text('Create New Club'),
                  content: TextField(controller: controller, decoration: const InputDecoration(labelText: 'Club Name')),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('Cancel')),
                    ElevatedButton(
                      onPressed: () { if (controller.text.isNotEmpty) { setState(() { _clubs.add(Club(id: DateTime.now().toString(), name: controller.text)); }); Navigator.pop(ctx); } },
                      child: const Text('Create'),
                    ),
                  ],
                ),
              );
            }

            void _appointHead(Club club) {
              final searchController = TextEditingController();
              showDialog(
                context: context,
                builder: (ctx) => StatefulBuilder(
                  builder: (context, setDialogState) {
                    final searchResults = ['Nambi Aisha', 'Trevor Okello', 'Grace Namubiru'].where((name) => name.toLowerCase().contains(searchController.text.toLowerCase())).toList();
                    return AlertDialog(
                      title: Text('Manage Head for ${club.name}'),
                      content: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          TextField(controller: searchController, decoration: const InputDecoration(labelText: 'Search Student to Promote', prefixIcon: Icon(Icons.search)), onChanged: (v) => setDialogState(() {})),
                          if (searchController.text.isNotEmpty)
                            ...searchResults.map((name) => ListTile(
                              title: Text(name),
                              trailing: const Icon(Icons.arrow_upward, color: Colors.green),
                              onTap: () { setState(() { club.headStudentName = name; }); Navigator.pop(ctx); },
                            )),
                        ],
                      ),
                      actions: [
                        if (club.headStudentName != null)
                          TextButton(
                            onPressed: () { setState(() { club.headStudentName = null; }); Navigator.pop(ctx); },
                            child: const Text('Demote Head to Student', style: TextStyle(color: Colors.red)),
                          ),
                        TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('Close')),
                      ],
                    );
                  }
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Manage Clubs')),
                body: ListView.builder(
                  itemCount: _clubs.length,
                  itemBuilder: (context, index) {
                    final club = _clubs[index];
                    final hasHead = club.headStudentName != null;
                    return Card(
                      child: ListTile(
                        title: Text(club.name),
                        subtitle: Text(hasHead ? 'Head: ${club.headStudentName}' : 'No head assigned'),
                        trailing: TextButton(
                          onPressed: () => _appointHead(club),
                          child: Text(hasHead ? 'Manage' : 'Appoint Head'),
                        ),
                      ),
                    );
                  },
                ),
                floatingActionButton: FloatingActionButton(onPressed: _createClub, child: const Icon(Icons.add)),
              );
            }
          }
          MNGCLUB

          cat > admin_app/lib/screens/marks_submission.dart << 'MARKSUB'
          import 'package:flutter/material.dart';
          import 'package:image_picker/image_picker.dart';
          import 'dart:io';

          class MarksSubmissionScreen extends StatefulWidget {
            const MarksSubmissionScreen({super.key});
            @override
            State<MarksSubmissionScreen> createState() => _MarksSubmissionScreenState();
          }

          class _MarksSubmissionScreenState extends State<MarksSubmissionScreen> {
            File? _image; bool _isProcessing = false; bool _hasResult = false;
            final String _ocrSubject = 'Biology'; final String _ocrStudent = 'John Doe'; final String _ocrScore = '85/100';

            Future<void> _pickImage(ImageSource source) async {
              try {
                final pickedFile = await ImagePicker().pickImage(source: source);
                if (pickedFile != null) {
                  setState(() { _image = File(pickedFile.path); _isProcessing = true; _hasResult = false; });
                  await Future.delayed(const Duration(seconds: 2));
                  if (mounted) setState(() { _isProcessing = false; _hasResult = true; });
                }
              } catch (e) { ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('Error: $e'))); }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Submit Marks (OCR)')),
                body: Padding(
                  padding: const EdgeInsets.all(16),
                  child: ListView(
                    children: [
                      GestureDetector(
                        onTap: () => _pickImage(ImageSource.camera),
                        child: Container(
                          height: 150,
                          decoration: BoxDecoration(color: Colors.grey[200], border: Border.all(color: Colors.grey), borderRadius: BorderRadius.circular(12)),
                          child: _image != null ? Image.file(_image!, fit: BoxFit.cover) : const Column(mainAxisAlignment: MainAxisAlignment.center, children: [Icon(Icons.photo_camera, size: 48, color: Color(0xFF0A3D91)), SizedBox(height: 8), Text('Tap to capture Mark Sheet')]),
                        ),
                      ),
                      const SizedBox(height: 20),
                      if (_isProcessing) const Center(child: CircularProgressIndicator()),
                      if (_hasResult)
                        Card(
                          color: Colors.blue[50],
                          child: Padding(
                            padding: const EdgeInsets.all(16),
                            child: Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                const Text('OCR Detected:', style: TextStyle(fontWeight: FontWeight.bold, color: Color(0xFF0A3D91))),
                                const SizedBox(height: 8),
                                Text('Subject: $_ocrSubject'), Text('Student: $_ocrStudent'), Text('Score: $_ocrScore'),
                                const SizedBox(height: 12),
                                TextFormField(initialValue: _ocrSubject, decoration: const InputDecoration(labelText: 'Subject')),
                                TextFormField(initialValue: _ocrStudent, decoration: const InputDecoration(labelText: 'Student Name')),
                                TextFormField(initialValue: _ocrScore, decoration: const InputDecoration(labelText: 'Score')),
                                const SizedBox(height: 16),
                                SizedBox(width: double.infinity, child: ElevatedButton(onPressed: () { Navigator.pop(context); }, child: const Text('Confirm & Submit')))
                              ],
                            ),
                          ),
                        )
                    ],
                  ),
                ),
              );
            }
          }
          MARKSUB

          cat > admin_app/lib/screens/announcements.dart << 'ANNSCR'
          import 'package:flutter/material.dart';
          class AnnouncementsScreen extends StatefulWidget {
            const AnnouncementsScreen({super.key});
            @override
            State<AnnouncementsScreen> createState() => _AnnouncementsScreenState();
          }
          class _AnnouncementsScreenState extends State<AnnouncementsScreen> {
            @override
            Widget build(BuildContext context) => Scaffold(appBar: AppBar(title: const Text('Broadcast')), body: const Center(child: Text('Broadcast Form Here')));
          }
          ANNSCR

          cat > admin_app/lib/screens/validation_engine.dart << 'VALENG'
          import 'package:flutter/material.dart';
          class ValidationEngineScreen extends StatelessWidget {
            const ValidationEngineScreen({super.key});
            @override
            Widget build(BuildContext context) => Scaffold(appBar: AppBar(title: const Text('Validation')), body: const Center(child: Text('Validation Engine')));
          }
          VALENG

          cat > admin_app/lib/screens/coming_soon.dart << 'CS'
          import 'package:flutter/material.dart';
          class ComingSoonScreen extends StatelessWidget {
            final String featureName;
            const ComingSoonScreen({super.key, required this.featureName});
            @override
            Widget build(BuildContext context) => Scaffold(appBar: AppBar(title: Text(featureName)), body: Center(child: Text('$featureName coming soon.')));
          }
          CS

      # 🔴 THIS IS THE FIX FOR THE ICON ERROR 🔴
      - name: Generate Icons and Splash
        run: |
          cd admin_app
          flutter pub get
          flutter pub run flutter_launcher_icons:main
          flutter pub run flutter_native_splash:create

      - name: Build Admin APK
        run: |
          cd admin_app
          flutter build apk --release

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: staff-hub-apk
          path: admin_app/build/app/outputs/flutter-apk/app-release.apk


  # JOB 2: Build the Student App (Platinum Digital App)
  build-student:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Shared and Student Code
        run: |
          # 1. SMART LOGO FINDER
          mkdir -p student_app/assets
          LOGO_SOURCE=$(find . -maxdepth 1 -iname "*inshot*.png" | head -n 1)
          if [ -z "$LOGO_SOURCE" ]; then LOGO_SOURCE=$(find . -maxdepth 1 -iname "*.png" | head -n 1); fi
          if [ -n "$LOGO_SOURCE" ]; then 
            cp "$LOGO_SOURCE" student_app/assets/logo.png;
            echo "Found badge: $LOGO_SOURCE and copied to assets!"
          else 
            echo -n "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > student_app/assets/logo.png; 
          fi

          flutter create --org com.platinum --project-name student_app student_app
          mkdir -p student_app/lib/screens
          mkdir -p student_app/lib/services

          sed -i 's/android:label="student_app"/android:label="Platinum Digital App"/g' student_app/android/app/src/main/AndroidManifest.xml

          cat > student_app/pubspec.yaml << 'STUPUB'
          name: student_app
          description: Platinum Digital App
          version: 1.0.3+4
          environment:
            sdk: ">=3.0.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            shared:
              path: ../shared
            sqflite: ^2.3.0
            path: ^1.8.3
            package_info_plus: ^5.0.1
            http: ^1.2.0
            url_launcher: ^6.2.5
          dev_dependencies:
            flutter_launcher_icons: "^0.13.1"
            flutter_native_splash: "^2.4.0"
          flutter:
            uses-material-design: true
            assets:
              - assets/

          flutter_launcher_icons:
            android: "launcher_icon"
            ios: true
            image_path: "assets/logo.png"
            min_sdk_android: 21
          
          flutter_native_splash:
            color: "#0A3D91"
            image: assets/logo.png
            android_12:
              image: assets/logo.png
              color: "#0A3D91"
          STUPUB

          cat > student_app/lib/services/database_helper.dart << 'DBHELP'
          import 'package:sqflite/sqflite.dart';
          import 'package:path/path.dart';

          class DatabaseHelper {
            static final DatabaseHelper instance = DatabaseHelper._init();
            static Database? _database;
            DatabaseHelper._init();

            Future<Database> get database async {
              if (_database != null) return _database!;
              _database = await _initDB('platinum_student.db');
              return _database!;
            }

            Future<Database> _initDB(String filePath) async {
              final dbPath = await getDatabasesPath();
              final path = join(dbPath, filePath);
              return await openDatabase(path, version: 2, onCreate: _createDB, onUpgrade: (db, oldV, newV) async {});
            }

            Future _createDB(Database db, int version) async {
              await db.execute('''
                CREATE TABLE students (
                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                  fullName TEXT NOT NULL,
                  classLevel TEXT NOT NULL,
                  registeredAt TEXT NOT NULL
                )
              ''');
            }
