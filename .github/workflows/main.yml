      - name: Decode Google Services (Student)
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | tr -d '[:space:]' | base64 -d > student_app/android/app/google-services.json

      - name: Build Student
        run: |
          cd student_app
          flutter clean
          rm -f pubspec.lock
          flutter pub get
          flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Release Student
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: student_app/build/app/outputs/flutter-apk/app-release.apk

