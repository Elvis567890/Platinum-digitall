
name: Platinum Ecosystem - Production Build and Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platinum-ecosystem-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-backend:
    name: Validate Firebase Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check required backend files
        shell: bash
        run: |
          set -euo pipefail
          test -f functions/package.json
          test -f functions/index.js
          test -f functions/bootstrap-claims.js
          test -f firebase.json
          test -f firestore.rules
          test -f storage.rules

      - name: Validate backend JavaScript syntax
        run: |
          node --check functions/index.js
          node --check functions/bootstrap-claims.js

      - name: Validate Firebase configuration JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('firebase.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('functions/package.json', 'utf8'))"

  build-android:
    name: Build ${{ matrix.display_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - app_dir: student_app
            artifact_name: platinum-student-app
            display_name: Platinum Student App
            expected_application_id: com.afrinode.platinum

          - app_dir: admin_app
            artifact_name: platinum-staff-hub
            display_name: Platinum Staff Hub
            expected_application_id: com.afrinode.platinumadmin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required app files
        shell: bash
        env:
          APP_DIR: ${{ matrix.app_dir }}
        run: |
          set -euo pipefail
          test -f "$APP_DIR/pubspec.yaml"
          test -f "$APP_DIR/lib/main.dart"
          test -f "$APP_DIR/assets/logo.png"
          test -f "$APP_DIR/android/settings.gradle"
          test -f "$APP_DIR/android/app/build.gradle"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: stable
          cache: true
          cache-dependency-path: |
            student_app/pubspec.lock
            admin_app/pubspec.lock

      - name: Verify Android application ID
        shell: bash
        env:
          APP_DIR: ${{ matrix.app_dir }}
          EXPECTED_ID: ${{ matrix.expected_application_id }}
        run: |
          set -euo pipefail
          grep -F "applicationId = \"$EXPECTED_ID\"" \
            "$APP_DIR/android/app/build.gradle"

      - name: Resolve Flutter dependencies
        working-directory: ${{ matrix.app_dir }}
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: ${{ matrix.app_dir }}
        run: dart run flutter_launcher_icons

      - name: Generate native splash screen
        working-directory: ${{ matrix.app_dir }}
        run: dart run flutter_native_splash:create

      - name: Analyze Dart source
        working-directory: ${{ matrix.app_dir }}
        run: |
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        working-directory: ${{ matrix.app_dir }}
        run: flutter test --no-pub

      - name: Build release-mode APK
        working-directory: ${{ matrix.app_dir }}
        run: flutter build apk --release --no-pub

      - name: Prepare APK artifact
        shell: bash
        env:
          APP_DIR: ${{ matrix.app_dir }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          APK="$APP_DIR/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"

          mkdir -p dist

          cp "$APK" \
            "dist/${ARTIFACT_NAME}-${RUN_NUMBER}.apk"

          sha256sum "dist/${ARTIFACT_NAME}-${RUN_NUMBER}.apk" \
            > "dist/${ARTIFACT_NAME}-${RUN_NUMBER}.sha256"

          {
            echo "App: $ARTIFACT_NAME"
            echo "Commit: $COMMIT_SHA"
            echo "GitHub run: $RUN_NUMBER"
            echo "Build type: Release-mode CI verification"
            echo "Production signing: Not certified by this workflow"
          } > "dist/${ARTIFACT_NAME}-${RUN_NUMBER}-BUILD-INFO.txt"

      - name: Upload APK and build information
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ github.run_number }}
          path: |
            dist/*.apk
            dist/*.sha256
            dist/*-BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
