                  ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('Unable to join class: $e')));
                }
              }
            }

            Future<void> _openResource(BuildContext context, String url) async {
              final uri = Uri.tryParse(url);
              if (uri == null || !await launchUrl(uri, mode: LaunchMode.externalApplication)) {
                if (context.mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('This resource link is unavailable.')));
                }
              }
            }

