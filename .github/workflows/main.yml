            const AnnouncementsScreen({super.key, required this.studentName, required this.studentClass});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFFF4F7FC),
                body: CustomScrollView(
                  slivers: [
                    SliverAppBar(
                      expandedHeight: 160.0, floating: false, pinned: true, backgroundColor: const Color(0xFF0A3D91),
                      flexibleSpace: FlexibleSpaceBar(
                        title: Text('Welcome, $studentName', style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 16, color: Colors.white)),
                        background: Container(decoration: const BoxDecoration(gradient: LinearGradient(begin: Alignment.topCenter, end: Alignment.bottomCenter, colors: [Color(0xFF0A3D91), Color(0xFF051C45)])), child: Padding(padding: const EdgeInsets.only(left: 16, bottom: 50), child: Column(crossAxisAlignment: CrossAxisAlignment.start, mainAxisAlignment: MainAxisAlignment.end, children: [
                          Text('Class: $studentClass', style: const TextStyle(color: Colors.white70, fontSize: 14)), const SizedBox(height: 8),
                          const Row(children: [Icon(Icons.verified, color: Color(0xFFF4B41A), size: 16), SizedBox(width: 4), Text('Official School Feed', style: TextStyle(color: Color(0xFFF4B41A), fontSize: 12))])
                        ]))),
                      ),
                    ),
                    SliverToBoxAdapter(child: Padding(padding: const EdgeInsets.all(16.0), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                      const Text('School Announcements', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Color(0xFF0A3D91))), const SizedBox(height: 12),
                      _buildUrgentAlert(), const SizedBox(height: 12), _buildNormalAlert(),
