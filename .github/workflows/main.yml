                      title: Text(data['author'] ?? 'Anonymous', style: const TextStyle(fontWeight: FontWeight.bold)),
                      subtitle: Text(_formatTime(data['time'])),
                    ),
                    if (data['text'] != null && (data['text'] as String).isNotEmpty)
                      Padding(
                        padding: const EdgeInsets.symmetric(horizontal: 16),
