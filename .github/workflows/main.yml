          import 'package:flutter/material.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:firebase_storage/firebase_storage.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:cached_network_image/cached_network_image.dart';
          import 'package:video_player/video_player.dart';
          import 'dart:io';

          class ChatScreen extends StatefulWidget {
            final String chatName;
            final bool isStudentOnly;
            final String currentUser;
            const ChatScreen({super.key, required this.chatName, required this.isStudentOnly, required this.currentUser});
            @override State<ChatScreen> createState() => _ChatScreenState();
          }
          class _ChatScreenState extends State<ChatScreen> {
            final TextEditingController _msgController = TextEditingController();
            bool _isUploading = false;

            Future<void> _sendMessage(String type, {String? filePath, String? text}) async {
              String? mediaUrl;
              if (filePath != null) {
                setState(() => _isUploading = true);
                try {
                  String fileName = DateTime.now().millisecondsSinceEpoch.toString();
                  Reference ref = FirebaseStorage.instance.ref().child('chats/${widget.chatName}/$fileName');
                  await ref.putFile(File(filePath));
                  mediaUrl = await ref.getDownloadURL();
                } catch (e) {
                  setState(() => _isUploading = false);
                  ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('Upload failed: $e')));
                  return;
                }
              }

              await FirebaseFirestore.instance.collection('chats').doc(widget.chatName).collection('messages').add({
                'sender': widget.currentUser,
                'text': text ?? '',
                'mediaUrl': mediaUrl,
                'type': type,
                'timestamp': FieldValue.serverTimestamp(),
              });

              _msgController.clear();
              setState(() => _isUploading = false);
            }

            Future<void> _pickMedia(String type) async {
              if (type == 'image' || type == 'video') {
                final picker = ImagePicker();
                XFile? file = type == 'image' ? await picker.pickImage(source: ImageSource.gallery) : await picker.pickVideo(source: ImageSource.gallery);
                if (file != null) _sendMessage(type, filePath: file.path);
              } else {
                FilePickerResult? result = await FilePicker.platform.pickFiles();
                if (result != null) _sendMessage('document', filePath: result.files.single.path);
              }
            }

            @override Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text(widget.chatName), backgroundColor: const Color(0xFF0A3D91), foregroundColor: Colors.white, actions: [
                  if (!widget.isStudentOnly) const Padding(padding: EdgeInsets.all(16.0), child: Icon(Icons.verified_user, color: Color(0xFFF4B41A)))
                ]),
                body: Column(
                  children: [
                    if (_isUploading) const LinearProgressIndicator(color: Color(0xFFF4B41A)),
                    Expanded(
                      child: StreamBuilder<QuerySnapshot>(
                        stream: FirebaseFirestore.instance.collection('chats').doc(widget.chatName).collection('messages').orderBy('timestamp', descending: false).snapshots(),
                        builder: (context, snapshot) {
                          if (!snapshot.hasData) return const Center(child: CircularProgressIndicator());
                          final messages = snapshot.data!.docs;
                          return ListView.builder(
                            padding: const EdgeInsets.all(16),
                            itemCount: messages.length,
                            itemBuilder: (context, index) {
                              final msg = messages[index].data() as Map<String, dynamic>;
                              final isMe = msg['sender'] == widget.currentUser;
                              final time = (msg['timestamp'] as Timestamp?)?.toDate() ?? DateTime.now();
                              final timeStr = "${time.hour}:${time.minute.toString().padLeft(2, '0')}";

                              return Align(
                                alignment: isMe ? Alignment.centerRight : Alignment.centerLeft,
                                child: Container(
                                  margin: const EdgeInsets.only(bottom: 12),
                                  padding: const EdgeInsets.all(12),
                                  decoration: BoxDecoration(
                                    color: isMe ? const Color(0xFF0A3D91) : Colors.grey[200],
                                    borderRadius: BorderRadius.circular(16).copyWith(bottomRight: isMe ? Radius.zero : const Radius.circular(16), bottomLeft: isMe ? const Radius.circular(16) : Radius.zero),
                                  ),
                                  child: Column(
                                    crossAxisAlignment: isMe ? CrossAxisAlignment.end : CrossAxisAlignment.start,
                                    children: [
                                      if (!isMe) Text(msg['sender'], style: const TextStyle(fontWeight: FontWeight.bold, color: Color(0xFF0A3D91), fontSize: 12)),
                                      const SizedBox(height: 4),
                                      if (msg['text'] != null && msg['text'].isNotEmpty) Text(msg['text'], style: TextStyle(color: isMe ? Colors.white : Colors.black87)),
                                      
                                      if (msg['type'] == 'image' && msg['mediaUrl'] != null)
                                        Padding(padding: const EdgeInsets.only(top: 8), child: ClipRRect(borderRadius: BorderRadius.circular(8), child: CachedNetworkImage(imageUrl: msg['mediaUrl'], width: 200, fit: BoxFit.cover))),
                                      if (msg['type'] == 'video' && msg['mediaUrl'] != null)
                                        Padding(padding: const EdgeInsets.only(top: 8), child: const Icon(Icons.play_circle_fill, size: 50, color: Colors.white)),
                                      if (msg['type'] == 'document' && msg['mediaUrl'] != null)
                                        Padding(padding: const EdgeInsets.only(top: 8), child: Row(children: [Icon(Icons.insert_drive_file, color: isMe ? Colors.white : Colors.black), const SizedBox(width: 8), const Text('Document', style: TextStyle(fontWeight: FontWeight.bold))])),

                                      const SizedBox(height: 4),
                                      Text(timeStr, style: TextStyle(color: isMe ? Colors.white70 : Colors.grey, fontSize: 10)),
                                    ],
                                  ),
                                ),
                              );
                            },
                          );
                        },
                      ),
                    ),
                    Padding(
                      padding: const EdgeInsets.all(8.0),
                      child: Row(
                        children: [
                          IconButton(icon: const Icon(Icons.add_circle, color: Color(0xFFF4B41A)), onPressed: () {
                            showModalBottomSheet(context: context, builder: (context) => Wrap(children: [
                              ListTile(leading: const Icon(Icons.image), title: const Text('Send Image'), onTap: () { Navigator.pop(context); _pickMedia('image'); }),
                              ListTile(leading: const Icon(Icons.videocam), title: const Text('Send Video'), onTap: () { Navigator.pop(context); _pickMedia('video'); }),
                              ListTile(leading: const Icon(Icons.audiotrack), title: const Text('Send Audio/Doc'), onTap: () { Navigator.pop(context); _pickMedia('document'); }),
                            ]));
                          }),
                          Expanded(child: TextField(controller: _msgController, decoration: InputDecoration(hintText: 'Type a message...', filled: true, fillColor: Colors.grey[100], border: OutlineInputBorder(borderRadius: BorderRadius.circular(30), borderSide: BorderSide.none)), onSubmitted: (val) => _sendMessage('text', text: val))),
                          IconButton(icon: const Icon(Icons.send, color: Color(0xFF0A3D91)), onPressed: () => _sendMessage('text', text: _msgController.text)),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }
          CHAT

