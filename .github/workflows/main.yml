          cat > lib/screens/chat.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:firebase_storage/firebase_storage.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:cached_network_image/cached_network_image.dart';
          import 'package:video_player/video_player.dart';
          import 'package:audioplayers/audioplayers.dart';
          import 'package:url_launcher/url_launcher.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'dart:io';

          class ChatScreen extends StatefulWidget {
            final String room;
            final String user;
            const ChatScreen({super.key, required this.room, required this.user});
            @override
            State<ChatScreen> createState() => _ChatScreenState();
          }

          class _ChatScreenState extends State<ChatScreen> {
            final _c = TextEditingController();
            List<String> _blocked = [];
            bool _uploading = false;

            @override
            void initState() {
              super.initState();
              _loadBlocked();
            }

            Future<void> _loadBlocked() async {
              final p = await SharedPreferences.getInstance();
              setState(() => _blocked = p.getStringList('blockedUsers') ?? []);
            }

            Future<void> _block(String user) async {
              if (user == widget.user) return;
              final p = await SharedPreferences.getInstance();
              final list = p.getStringList('blockedUsers') ?? [];
              if (!list.contains(user)) {
                list.add(user);
                await p.setStringList('blockedUsers', list);
                setState(() => _blocked = list);
                if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('Blocked $user')));
              }
            }

            Future<void> _sendMedia(String kind) async {
              FilePickerResult? r;
              switch (kind) {
                case 'image': r = await FilePicker.platform.pickFiles(type: FileType.image); break;
                case 'video': r = await FilePicker.platform.pickFiles(type: FileType.video); break;
                case 'audio': r = await FilePicker.platform.pickFiles(type: FileType.audio); break;
                default: r = await FilePicker.platform.pickFiles(type: FileType.any);
              }
              if (r == null) return;
              setState(() => _uploading = true);
              try {
                final file = r.files.single;
                final ref = FirebaseStorage.instance.ref().child('chat/${DateTime.now().millisecondsSinceEpoch}_${file.name}');
                await ref.putFile(File(file.path!));
                final url = await ref.getDownloadURL();
                await FirebaseFirestore.instance.collection('chats').doc(widget.room).collection('msgs').add({
                  'sender': widget.user,
                  'text': '',
                  'type': kind,
                  'url': url,
                  'fileName': file.name,
                  'time': FieldValue.serverTimestamp(),
                });
              } catch (e) {
                if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('Upload failed: $e')));
              } finally {
                if (mounted) setState(() => _uploading = false);
              }
            }

            void _showAttachMenu() {
              showModalBottomSheet(
                context: context,
                backgroundColor: const Color(0xFF131A26),
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(24))),
                builder: (ctx) => SafeArea(
                  child: Wrap(
                    children: [
                      ListTile(leading: const Icon(Icons.image, color: Colors.blueAccent), title: const Text('Image'), onTap: () { Navigator.pop(ctx); _sendMedia('image'); }),
                      ListTile(leading: const Icon(Icons.videocam, color: Colors.redAccent), title: const Text('Video'), onTap: () { Navigator.pop(ctx); _sendMedia('video'); }),
                      ListTile(leading: const Icon(Icons.audiotrack, color: Colors.orangeAccent), title: const Text('Audio'), onTap: () { Navigator.pop(ctx); _sendMedia('audio'); }),
                      ListTile(leading: const Icon(Icons.insert_drive_file, color: Colors.grey), title: const Text('File'), onTap: () { Navigator.pop(ctx); _sendMedia('file'); }),
                    ],
                  ),
                ),
              );
            }

            Future<void> _sendText() async {
              if (_c.text.trim().isEmpty) return;
              final t = _c.text.trim();
              _c.clear();
              await FirebaseFirestore.instance.collection('chats').doc(widget.room).collection('msgs').add({
                'sender': widget.user,
                'text': t,
                'type': 'text',
                'time': FieldValue.serverTimestamp(),
              });
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text(widget.room)),
                body: Column(
                  children: [
                    if (_uploading) const LinearProgressIndicator(color: Color(0xFFD4AF37)),
                    Expanded(
                      child: StreamBuilder<QuerySnapshot>(
                        stream: FirebaseFirestore.instance.collection('chats').doc(widget.room).collection('msgs').orderBy('time', descending: false).snapshots(),
                        builder: (c, s) {
                          if (!s.hasData) return const Center(child: CircularProgressIndicator(color: Color(0xFFD4AF37)));
                          final docs = s.data!.docs.where((d) => !_blocked.contains((d.data() as Map)['sender'])).toList();
                          if (docs.isEmpty) return const Center(child: Text('No messages yet. Say hi!', style: TextStyle(color: Colors.grey)));
                          return ListView.builder(
                            padding: const EdgeInsets.all(12),
                            itemCount: docs.length,
                            itemBuilder: (c, i) {
                              final d = docs[i].data() as Map<String, dynamic>;
                              final isMe = d['sender'] == widget.user;
                              return _MessageBubble(data: d, isMe: isMe, onBlock: () => _block(d['sender']));
                            },
                          );
                        },
                      ),
                    ),
                    SafeArea(
                      child: Padding(
                        padding: const EdgeInsets.all(8),
                        child: Row(
                          children: [
                            IconButton(icon: const Icon(Icons.add_circle, color: Color(0xFFD4AF37), size: 28), onPressed: _uploading ? null : _showAttachMenu),
                            Expanded(
                              child: TextField(
                                controller: _c,
                                style: const TextStyle(color: Colors.white),
                                decoration: InputDecoration(
                                  hintText: 'Message...',
                                  hintStyle: const TextStyle(color: Colors.grey),
                                  filled: true,
                                  fillColor: const Color(0xFF131A26),
                                  border: OutlineInputBorder(borderRadius: BorderRadius.circular(24), borderSide: BorderSide.none),
                                  contentPadding: const EdgeInsets.symmetric(horizontal: 16, vertical: 10),
                                ),
                                onSubmitted: (_) => _sendText(),
                              ),
                            ),
                            const SizedBox(width: 8),
                            CircleAvatar(
                              backgroundColor: const Color(0xFFD4AF37),
                              child: IconButton(icon: const Icon(Icons.send, color: Colors.black, size: 20), onPressed: _sendText),
                            ),
                          ],
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class _MessageBubble extends StatelessWidget {
            final Map<String, dynamic> data;
            final bool isMe;
            final VoidCallback onBlock;
            const _MessageBubble({required this.data, required this.isMe, required this.onBlock});

            @override
            Widget build(BuildContext context) {
              final type = data['type'] ?? 'text';
              final url = data['url'] as String?;
              return Align(
                alignment: isMe ? Alignment.centerRight : Alignment.centerLeft,
                child: GestureDetector(
                  onLongPress: isMe ? null : onBlock,
                  child: Container(
                    margin: const EdgeInsets.only(bottom: 12),
                    padding: const EdgeInsets.all(12),
                    decoration: BoxDecoration(
                      color: isMe ? const Color(0xFF1A365D) : const Color(0xFF131A26),
                      borderRadius: BorderRadius.only(
                        topLeft: const Radius.circular(16),
                        topRight: const Radius.circular(16),
                        bottomLeft: isMe ? const Radius.circular(16) : Radius.zero,
                        bottomRight: isMe ? Radius.zero : const Radius.circular(16),
                      ),
                    ),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        if (!isMe) Padding(
                          padding: const EdgeInsets.only(bottom: 6),
                          child: Text(data['sender'] ?? '?', style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 12, color: Color(0xFFD4AF37))),
                        ),
                        if (type == 'text')
                          Text(data['text'] ?? '', style: const TextStyle(color: Colors.white))
                        else if (type == 'image' && url != null)
                          ClipRRect(
                            borderRadius: BorderRadius.circular(12),
                            child: CachedNetworkImage(imageUrl: url, width: 220, height: 220, fit: BoxFit.cover),
                          )
                        else if (type == 'video' && url != null)
                          GestureDetector(
                            onTap: () => Navigator.push(context, MaterialPageRoute(builder: (_) => _VideoScreen(url: url))),
                            child: Container(
                              width: 220, height: 160,
                              decoration: BoxDecoration(color: Colors.black54, borderRadius: BorderRadius.circular(12)),
                              child: const Center(child: Icon(Icons.play_circle_fill, color: Colors.white, size: 60)),
                            ),
                          )
                        else if (type == 'audio' && url != null)
                          _AudioBubble(url: url)
                        else if (url != null)
                          InkWell(
                            onTap: () => launchUrl(Uri.parse(url), mode: LaunchMode.externalApplication),
                            child: Row(
                              mainAxisSize: MainAxisSize.min,
                              children: [
                                const Icon(Icons.insert_drive_file, color: Colors.grey),
                                const SizedBox(width: 8),
                                Flexible(child: Text(data['fileName'] ?? 'File', style: const TextStyle(color: Colors.blueAccent, decoration: TextDecoration.underline))),
                              ],
                            ),
                          ),
                        Padding(
                          padding: const EdgeInsets.only(top: 6),
                          child: Text(_formatTime(data['time']), style: const TextStyle(fontSize: 10, color: Colors.grey)),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }

            String _formatTime(dynamic t) {
              if (t is Timestamp) {
                final d = t.toDate();
                return '${d.hour.toString().padLeft(2, '0')}:${d.minute.toString().padLeft(2, '0')}';
              }
              return '';
            }
          }

          class _AudioBubble extends StatefulWidget {
            final String url;
            const _AudioBubble({required this.url});
            @override
            State<_AudioBubble> createState() => _AudioBubbleState();
          }
          class _AudioBubbleState extends State<_AudioBubble> {
            final _player = AudioPlayer();
            bool _playing = false;
            @override
            void dispose() { _player.dispose(); super.dispose(); }
            Future<void> _toggle() async {
              if (_playing) {
                await _player.pause();
                if (mounted) setState(() => _playing = false);
              } else {
                await _player.play(UrlSource(widget.url));
                if (mounted) setState(() => _playing = true);
              }
            }
            @override
            Widget build(BuildContext context) {
              return Row(
                mainAxisSize: MainAxisSize.min,
                children: [
                  IconButton(icon: Icon(_playing ? Icons.pause_circle : Icons.play_circle, size: 36, color: const Color(0xFFD4AF37)), onPressed: _toggle),
                  const Text('Voice note', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                ],
              );
            }
          }

          class _VideoScreen extends StatefulWidget {
            final String url;
            const _VideoScreen({required this.url});
            @override
            State<_VideoScreen> createState() => _VideoScreenState();
          }
          class _VideoScreenState extends State<_VideoScreen> {
            late VideoPlayerController _ctrl;
            @override
            void initState() {
              super.initState();
              _ctrl = VideoPlayerController.networkUrl(Uri.parse(widget.url))..initialize().then((_) { setState(() {}); _ctrl.play(); });
            }
            @override
            void dispose() { _ctrl.dispose(); super.dispose(); }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.black,
                appBar: AppBar(backgroundColor: Colors.black),
                body: Center(
                  child: _ctrl.value.isInitialized
                      ? AspectRatio(aspectRatio: _ctrl.value.aspectRatio, child: VideoPlayer(_ctrl))
                      : const CircularProgressIndicator(color: Color(0xFFD4AF37)),
                ),
              );
            }
          }
          EOF

