          import 'package:flutter/material.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          class ReleaseReportsScreen extends StatefulWidget {
            const ReleaseReportsScreen({super.key});
            @override
            State<ReleaseReportsScreen> createState() => _ReleaseReportsScreenState();
          }
          class _ReleaseReportsScreenState extends State<ReleaseReportsScreen> {
            bool _loading = false;
            void _release() async {
              setState(() => _loading = true);
              await FirebaseFirestore.instance.collection('settings').doc('reports').set({'released': true});
              if (mounted) {
                setState(() => _loading = false);
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Reports Released Successfully!'), backgroundColor: Colors.green));
              }
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Release Reports')),
                body: Center(
                  child: Padding(
                    padding: const EdgeInsets.all(20),
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        const Icon(Icons.lock_open, size: 80, color: Color(0xFFD4AF37)),
                        const SizedBox(height: 24),
                        const Text('Ready to Publish', style: TextStyle(fontSize: 24, fontWeight: FontWeight.bold, color: Colors.white)),
                        const SizedBox(height: 32),
                        _loading ? const CircularProgressIndicator(color: Color(0xFFD4AF37)) : ElevatedButton(
                          style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFD4AF37), foregroundColor: Colors.black),
                          onPressed: _release,
                          child: const Text('Release All Reports Now', style: TextStyle(fontWeight: FontWeight.bold))
                        )
                      ]
                    )
                  )
                )
              );
