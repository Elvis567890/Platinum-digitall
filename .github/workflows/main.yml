
name: Platinum Ecosystem - Build and Validate

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platinum-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-backend:
    name: Validate Firebase Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Show repository structure
        run: |
          echo "Repository root:"
          pwd
          ls -la
          echo "Workflow expects these files:"
          find . -maxdepth 4 -type f \
            \( -name "firebase.json" \
            -o -name "firestore.rules" \
            -o -name "storage.rules" \
            -o -name "package.json" \
            -o -name "index.js" \) -print

      - name: Check required backend files
        shell: bash
        run: |
          set -eu

          for file in \
            firebase.json \
            firestore.rules \
            storage.rules \
            functions/package.json \
            functions/index.js
          do
            if [ -f "$file" ]; then
              echo "FOUND: $file"
            else
              echo "::error::MISSING: $file"
            fi
          done

          test -f firebase.json
          test -f firestore.rules
          test -f storage.rules
          test -f functions/package.json
          test -f functions/index.js

      - name: Validate Firebase configuration JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('firebase.json','utf8')); console.log('firebase.json is valid JSON')"
          node -e "JSON.parse(require('fs').readFileSync('functions/package.json','utf8')); console.log('package.json is valid JSON')"

      - name: Install backend dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Validate backend JavaScript syntax
        working-directory: functions
        run: node --check index.js

  build-android:
    name: Build Platinum Android Apps
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - app_name: Platinum-Digital-App
            app_dir: student_app
          - app_name: Platinum-Staff-App
            app_dir: staff_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required app files
        shell: bash
        run: |
          set -eu

          echo "Repository root:"
          pwd
          ls -la

          echo "Checking ${{ matrix.app_dir }}"

          for file in \
            "${{ matrix.app_dir }}/pubspec.yaml" \
            "${{ matrix.app_dir }}/lib/main.dart"
          do
            if [ -f "$file" ]; then
              echo "FOUND: $file"
            else
              echo "::error::MISSING: $file"
            fi
          done

          test -f "${{ matrix.app_dir }}/pubspec.yaml"
          test -f "${{ matrix.app_dir }}/lib/main.dart"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        working-directory: ${{ matrix.app_dir }}
        run: flutter create --platforms=android --org ug.ac.platinum .

      - name: Resolve Flutter dependencies
        working-directory: ${{ matrix.app_dir }}
        run: flutter pub get

      - name: Analyze Dart source
        working-directory: ${{ matrix.app_dir }}
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        working-directory: ${{ matrix.app_dir }}
        shell: bash
        run: |
          if [ -d test ] && find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "No automated Flutter tests found; skipping tests."
          fi

      - name: Build release APK
        working-directory: ${{ matrix.app_dir }}
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app_name }}
          path: ${{ matrix.app_dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
