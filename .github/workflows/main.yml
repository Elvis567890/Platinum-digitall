          cat > lib/screens/chat.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:firebase_storage/firebase_storage.dart';
          import 'package:file_picker/file_picker.dart';
          import 'dart:io';

          class ChatScreen extends StatefulWidget {
            final String room;
            final String user;
            const ChatScreen({super.key, required this.room, required this.user});
            @override
            State<ChatScreen> createState() => _ChatScreenState();
          }
          class _ChatScreenState extends State<ChatScreen> {
            final _c = TextEditingController();
            List<String> _blocked = [];
            @override
            void initState() {
              super.initState();
              _load();
            }
            void _load() async {
              final p = await SharedPreferences.getInstance();
              setState(() => _blocked = p.getStringList('blocks') ?? []);
            }
            void _block(String u) async {
              final p = await SharedPreferences.getInstance();
              _blocked.add(u);
              await p.setStringList('blocks', _blocked);
              setState(() {});
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('Blocked $u')));
            }
            void _sendMedia(String type) async {
              FilePickerResult? r = await FilePicker.platform.pickFiles(type: type == 'img' ? FileType.image : FileType.any);
              if (r != null) {
                final ref = FirebaseStorage.instance.ref().child('chat/${DateTime.now().millisecondsSinceEpoch}');
                await ref.putFile(File(r.files.single.path!));
                String url = await ref.getDownloadURL();
                await FirebaseFirestore.instance.collection('chats').doc(widget.room).collection('msgs').add({'sender': widget.user, 'text': 'Sent an attachment', 'type': type, 'url': url, 'time': FieldValue.serverTimestamp()});
              }
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text(widget.room), backgroundColor: const Color(0xFF0A3D91)),
                body: Column(
                  children: [
                    Expanded(
                      child: StreamBuilder<QuerySnapshot>(
                        stream: FirebaseFirestore.instance.collection('chats').doc(widget.room).collection('msgs').orderBy('time', descending: false).snapshots(),
                        builder: (c, s) {
                          if (!s.hasData) return const Center(child: CircularProgressIndicator());
                          final docs = s.data!.docs.where((d) => !_blocked.contains((d.data() as Map)['sender'])).toList();
                          return ListView.builder(
                            padding: const EdgeInsets.all(10),
                            itemCount: docs.length,
                            itemBuilder: (c, i) {
                              final d = docs[i].data() as Map<String, dynamic>;
                              final isMe = d['sender'] == widget.user;
                              return Align(
                                alignment: isMe ? Alignment.centerRight : Alignment.centerLeft,
                                child: GestureDetector(
                                  onLongPress: () => _block(d['sender']),
                                  child: Container(
                                    margin: const EdgeInsets.only(bottom: 10),
                                    padding: const EdgeInsets.all(12),
                                    decoration: BoxDecoration(color: isMe ? const Color(0xFF0A3D91) : Colors.grey[300], borderRadius: BorderRadius.circular(16)),
                                    child: Column(
                                      crossAxisAlignment: CrossAxisAlignment.start,
                                      children: [
                                        if (!isMe) Text(d['sender'], style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 12, color: Colors.blue)),
                                        Text(d['text'], style: TextStyle(color: isMe ? Colors.white : Colors.black)),
                                        if (d['url'] != null) const Padding(padding: EdgeInsets.only(top: 5), child: Icon(Icons.file_present, color: Colors.white))
                                      ]
                                    )
                                  )
                                )
                              );
                            }
                          );
                        }
                      )
                    ),
                    Padding(
                      padding: const EdgeInsets.all(8),
                      child: Row(
                        children: [
                          IconButton(icon: const Icon(Icons.add), onPressed: () => _sendMedia('doc')),
                          Expanded(child: TextField(controller: _c, decoration: const InputDecoration(hintText: 'Message...', border: OutlineInputBorder()))),
                          IconButton(
                            icon: const Icon(Icons.send, color: Color(0xFF0A3D91)),
                            onPressed: () async {
                              if (_c.text.isNotEmpty) {
                                await FirebaseFirestore.instance.collection('chats').doc(widget.room).collection('msgs').add({'sender': widget.user, 'text': _c.text, 'time': FieldValue.serverTimestamp()});
                                _c.clear();
                              }
                            }
                          )
                        ]
                      )
                    )
                  ]
                )
              );
            }
          }
          EOF

