name: Build Platinum Ecosystem (Final Complete Logic)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: BUILD PLATINUM DIGITAL TOOL (STUDENT APP)
  # ==========================================
  build-student:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate Student App Code
        run: |
          if [ ! -d "student_app" ]; then
            mkdir -p student_app/assets
            flutter create --org com.platinum --project-name student_app student_app
            mkdir -p student_app/lib/screens student_app/lib/services
          fi

          # --- REAL LOGO PROCESSING (Student) ---
          # Takes your JPG from the root, removes the white background, and puts it on a White canvas
          if [ -f "InShot_20261017_024714317.jpg" ]; then
            convert InShot_20261017_024714317.jpg -fuzz 5% -transparent white -resize 850x850 -background "#FFFFFF" -gravity center -extent 1024x1024 student_app/assets/logo.png
          elif [ ! -f "student_app/assets/logo.png" ]; then
            convert -size 1024x1024 xc:"#FFFFFF" student_app/assets/logo.png
          fi

          sed -i 's/distributionUrl=.*/distributionUrl=https\\:\/\/services.gradle.org\/distributions\/gradle-8.7-all.zip/g' student_app/android/gradle/wrapper/gradle-wrapper.properties
          
          cat > student_app/android/build.gradle << 'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://github.com/jitsi/jitsi-maven-repository/raw/master/releases" }
              }
          }
          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              afterEvaluate { project ->
                  if (project.extensions.findByName("android") != null) {
                      project.android {
                          compileSdk 34
                          compileOptions {
                              sourceCompatibility JavaVersion.VERSION_17
                              targetCompatibility JavaVersion.VERSION_17
                          }
                      }
                  }
                  tasks.withType(JavaCompile).configureEach {
                      sourceCompatibility = "17"
                      targetCompatibility = "17"
                  }
              }
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }
          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

          cat > student_app/android/settings.gradle << 'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.5.0" apply false
              id "org.jetbrains.kotlin.android" version "2.0.10" apply false
              id "com.google.gms.google-services" version "4.5.0" apply false
          }
          include ":app"
          EOF

          grep -q "android.newDsl=false" student_app/android/gradle.properties || echo "android.newDsl=false" >> student_app/android/gradle.properties
          grep -q "android.builtInKotlin=false" student_app/android/gradle.properties || echo "android.builtInKotlin=false" >> student_app/android/gradle.properties
          grep -q "android.useAndroidX=true" student_app/android/gradle.properties || echo "android.useAndroidX=true" >> student_app/android/gradle.properties
          grep -q "android.enableJetifier=true" student_app/android/gradle.properties || echo "android.enableJetifier=true" >> student_app/android/gradle.properties
          grep -q "kotlin.jvm.target.validation.mode = IGNORE" student_app/android/gradle.properties || echo "kotlin.jvm.target.validation.mode = IGNORE" >> student_app/android/gradle.properties
          
          sed -i 's/<manifest/<manifest xmlns:tools="http:\/\/schemas.android.com\/tools"/' student_app/android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application tools:replace="android:label"/' student_app/android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="student_app"/android:label="Platinum Digital Tool"/g' student_app/android/app/src/main/AndroidManifest.xml
          grep -q "REQUEST_INSTALL_PACKAGES" student_app/android/app/src/main/AndroidManifest.xml || sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.CAMERA"\/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"\/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"\/>' student_app/android/app/src/main/AndroidManifest.xml
          
          cat > student_app/android/app/build.gradle << 'EOF'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
              id "com.google.gms.google-services"
          }
          android {
              namespace = "com.platinum.student_app"
              compileSdk = 34
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { 
                  jvmTarget = "17"
                  freeCompilerArgs += ["-Xskip-metadata-version-check"]
              }
              defaultConfig {
                  applicationId = "com.afrinode.platinum"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
                  multiDexEnabled = true
              }
              buildTypes { 
                  release { 
                      signingConfig = signingConfigs.debug 
                      minifyEnabled = false
                      shrinkResources = false
                  } 
              }
              lint { checkReleaseBuilds = false; abortOnError = false }
          }
          flutter { source = "../.." }
          dependencies {
              implementation platform("com.google.firebase:firebase-bom:35.0.2")
              implementation "com.google.firebase:firebase-analytics"
          }
          EOF

          cd student_app
          
          cat > pubspec.yaml << 'EOF'
          name: student_app
          description: "Platinum Digital Tool"
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.4.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.6
            firebase_core: ^3.1.0
            cloud_firestore: ^5.0.1
            firebase_storage: ^12.0.1
            image_picker: ^1.1.2
            video_player: ^2.9.1
            cached_network_image: ^3.3.1
            path_provider: ^2.1.3
            dio: ^5.4.3+1
            google_fonts: ^6.2.1
            sqflite: ^2.3.3+1
            path: ^1.9.0
            jitsi_meet_flutter_sdk: 10.3.0
            url_launcher: ^6.3.0
            file_picker: 8.1.6
            shared_preferences: ^2.2.3
            package_info_plus: 8.0.2
            http: ^1.2.1
            open_filex: ^4.5.0
            permission_handler: ^11.3.1
            audioplayers: ^6.0.0
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
            flutter_launcher_icons: ^0.13.1
            flutter_native_splash: ^2.4.0

          flutter_launcher_icons:
            android: "launcher_icon"
            image_path: "assets/logo.png"
            adaptive_icon_background: "#FFFFFF"
            adaptive_icon_foreground: "assets/logo.png"

          flutter_native_splash:
            color: "#FFFFFF"
            image: assets/logo.png
            web: false
            fullscreen: true
            android_gravity: fill
            android_12:
              image: assets/logo.png
              icon_background_color: "#FFFFFF"
          EOF

          # --- STUDENT DART CODE ---
          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:google_fonts/google_fonts.dart';
          import 'package:http/http.dart' as http;
          import 'dart:convert';
          import 'package:package_info_plus/package_info_plus.dart';
          import 'package:dio/dio.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:open_filex/open_filex.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'screens/registration.dart';
          import 'screens/home.dart';
          import 'services/db.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Firebase.initializeApp(options: const FirebaseOptions(apiKey: "AIzaSyDl-dfyyRT9kdxJOCm4ZM6QYmnY1cgXI0M", appId: "1:374715668746:android:b985232e1b3a6d0d4342f3", messagingSenderId: "374715668746", projectId: "payment-sas", storageBucket: "payment-sas.firebasestorage.app"));
            runApp(const App());
          }

          class App extends StatelessWidget {
            const App({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Platinum Digital Tool',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(primaryColor: const Color(0xFF0A3D91), scaffoldBackgroundColor: const Color(0xFFF4F7FC), useMaterial3: true, textTheme: GoogleFonts.poppinsTextTheme(Theme.of(context).textTheme)),
                home: const Start()
              );
            }
          }

          class Start extends StatefulWidget {
            const Start({super.key});
            @override
            State<Start> createState() => _StartState();
          }

          class _StartState extends State<Start> {
            @override
            void initState() {
              super.initState();
              _init();
            }

            Future<void> _init() async {
              _checkForUpdates();
              final db = await DB.instance.db;
              final res = await db.query('students', limit: 1);
              if (mounted) Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => res.isEmpty ? const RegScreen() : const HomeScreen()));
            }

            void _checkForUpdates() async {
              try {
                PackageInfo pInfo = await PackageInfo.fromPlatform();
                final res = await http.get(Uri.parse('https://api.github.com/repos/Elvis567890/Platinum-digitall/releases/latest'));
                if (res.statusCode == 200) {
                  final data = jsonDecode(res.body);
                  String latest = data['tag_name'].toString().replaceAll('v', '');
                  String apkUrl = data['assets'][0]['browser_download_url'];
                  
                  if (latest != pInfo.version && mounted) {
                    showDialog(
                      context: context,
                      barrierDismissible: false,
                      builder: (ctx) => AlertDialog(
                        title: const Text('Update Available 🚀'),
                        content: Text('Version $latest is available. Update now!'),
                        actions: [
                          TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('Later')),
                          ElevatedButton(
                            onPressed: () async {
                              Navigator.pop(ctx);
                              await _download(apkUrl);
                            },
                            child: const Text('Update Now')
                          )
                        ]
                      )
                    );
                  }
                }
              } catch (e) {
                debugPrint("OTA Failed: $e");
              }
            }

            Future<void> _download(String url) async {
              if (await Permission.requestInstallPackages.status != PermissionStatus.granted) {
                await Permission.requestInstallPackages.request();
              }
              
              showDialog(context: context, barrierDismissible: false, builder: (ctx) => const AlertDialog(
                content: Column(mainAxisSize: MainAxisSize.min, children: [
                  CircularProgressIndicator(),
                  SizedBox(height: 20),
                  Text("Downloading Update in Background...")
                ])
              ));

              try {
                final dir = await getExternalStorageDirectory();
                final path = '${dir!.path}/update.apk';
                await Dio().download(url, path);
                if (mounted) Navigator.pop(context);
                OpenFilex.open(path);
              } catch (e) {
                if (mounted) Navigator.pop(context);
                ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('Download failed: $e')));
              }
            }

            @override
            Widget build(BuildContext context) => const Scaffold(body: Center(child: CircularProgressIndicator()));
          }
          EOF

          cat > lib/services/db.dart << 'EOF'
          import 'package:sqflite/sqflite.dart';
          import 'package:path/path.dart';
          class DB {
            static final DB instance = DB._();
            static Database? _db;
            DB._();
            Future<Database> get db async {
              if (_db != null) return _db!;
              _db = await openDatabase(join(await getDatabasesPath(), 'p.db'), version: 1, onCreate: (d,v) async => await d.execute('CREATE TABLE students (id INTEGER PRIMARY KEY, fullName TEXT, classLevel TEXT)'));
              return _db!;
            }
          }
          EOF

          cat > lib/screens/registration.dart << 'EOF'
          import 'package:flutter/material.dart';
          import '../services/db.dart';
          import 'home.dart';
          class RegScreen extends StatefulWidget {
            const RegScreen({super.key});
            @override
            State<RegScreen> createState() => _RegScreenState();
          }
          class _RegScreenState extends State<RegScreen> {
            final _n = TextEditingController();
            String _c = 'S1';
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Container(
                  decoration: const BoxDecoration(gradient: LinearGradient(colors: [Color(0xFF0A3D91), Color(0xFF051C45)])),
                  child: Center(
                    child: Card(
                      margin: const EdgeInsets.all(24),
                      child: Padding(
                        padding: const EdgeInsets.all(24),
                        child: Column(
                          mainAxisSize: MainAxisSize.min,
                          children: [
                            Image.asset('assets/logo.png', height: 100),
                            const SizedBox(height: 20),
                            TextField(controller: _n, decoration: const InputDecoration(labelText: 'Full Name')),
                            const SizedBox(height: 16),
                            DropdownButtonFormField<String>(
                              value: _c,
                              items: ['S1','S2','S3','S4','S5','S6'].map((c) => DropdownMenuItem(value: c, child: Text(c))).toList(),
                              onChanged: (v) => setState(() => _c = v!)
                            ),
                            const SizedBox(height: 24),
                            ElevatedButton(
                              style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFF4B41A)),
                              onPressed: () async {
                                if (_n.text.isNotEmpty) {
                                  await (await DB.instance.db).insert('students', {'fullName': _n.text, 'classLevel': _c});
                                  if (mounted) Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const HomeScreen()));
                                }
                              },
                              child: const Text('Enter', style: TextStyle(color: Colors.white))
                            )
                          ]
                        )
                      )
                    )
                  )
                )
              );
            }
          }
          EOF

          cat > lib/screens/home.dart << 'EOF'
          import 'package:flutter/material.dart';
          import '../services/db.dart';
          import 'announcements.dart';
          import 'pulse.dart';
          import 'study.dart';
          import 'reports.dart';
          import 'hub.dart';

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});
            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }
          class _HomeScreenState extends State<HomeScreen> {
            int _i = 0;
            String _n = '';
            String _c = '';
            @override
            void initState() {
              super.initState();
              _load();
            }
            void _load() async {
              final d = await (await DB.instance.db).query('students', limit: 1);
              if (d.isNotEmpty && mounted) setState(() { _n = d.first['fullName'] as String; _c = d.first['classLevel'] as String; });
            }
            @override
            Widget build(BuildContext context) {
              if (_n.isEmpty) return const Scaffold(body: Center(child: CircularProgressIndicator()));
              final p = [
                AnnouncementsScreen(name: _n, cls: _c),
                PulseScreen(authorName: _n),
                const StudyScreen(),
                ReportsScreen(studentName: _n),
                HubScreen(name: _n, cls: _c)
              ];
              return Scaffold(
                body: p[_i],
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: _i,
                  onTap: (v) => setState(() => _i = v),
                  selectedItemColor: const Color(0xFF0A3D91),
                  type: BottomNavigationBarType.fixed,
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.campaign), label: 'Feed'),
                    BottomNavigationBarItem(icon: Icon(Icons.dynamic_feed), label: 'Pulse'),
                    BottomNavigationBarItem(icon: Icon(Icons.school), label: 'Study'),
                    BottomNavigationBarItem(icon: Icon(Icons.description), label: 'Reports'),
                    BottomNavigationBarItem(icon: Icon(Icons.grid_view), label: 'Hub')
                  ]
                )
              );
            }
          }
          EOF

          cat > lib/screens/announcements.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          class AnnouncementsScreen extends StatelessWidget {
            final String name;
            final String cls;
            const AnnouncementsScreen({super.key, required this.name, required this.cls});
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text('Hi, $name ($cls)'), backgroundColor: const Color(0xFF0A3D91), foregroundColor: Colors.white),
                body: StreamBuilder<QuerySnapshot>(
                  stream: FirebaseFirestore.instance.collection('announcements').orderBy('time', descending: true).snapshots(),
                  builder: (context, snap) {
                    if (!snap.hasData) return const Center(child: CircularProgressIndicator());
                    if (snap.data!.docs.isEmpty) return const Center(child: Text('No announcements yet.'));
                    return ListView.builder(
                      padding: const EdgeInsets.all(16),
                      itemCount: snap.data!.docs.length,
                      itemBuilder: (c, i) {
                        final d = snap.data!.docs[i].data() as Map<String, dynamic>;
                        return Card(
                          child: ListTile(
                            leading: Icon(Icons.campaign, color: d['urgent'] == true ? Colors.red : Colors.blue),
                            title: Text(d['title'] ?? ''),
                            subtitle: Text(d['body'] ?? '')
                          )
                        );
                      }
                    );
                  }
                )
              );
            }
          }
          EOF

          cat > lib/screens/pulse.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:firebase_storage/firebase_storage.dart';
          import 'package:image_picker/image_picker.dart';
          import 'dart:io';
          import 'package:cached_network_image/cached_network_image.dart';
          import 'package:video_player/video_player.dart';

          class PulseScreen extends StatefulWidget {
            final String authorName;
            const PulseScreen({super.key, required this.authorName});
            @override
            State<PulseScreen> createState() => _PulseScreenState();
          }

          class _PulseScreenState extends State<PulseScreen> {
            final _c = TextEditingController();
            XFile? _media;
            String? _mediaType;
            bool _posting = false;

            Future<void> _pickImage() async {
              final x = await ImagePicker().pickImage(source: ImageSource.gallery);
              if (x != null) setState(() { _media = x; _mediaType = 'image'; });
            }

            Future<void> _pickVideo() async {
              final x = await ImagePicker().pickVideo(source: ImageSource.gallery);
              if (x != null) setState(() { _media = x; _mediaType = 'video'; });
            }

            Future<void> _post() async {
              if (_c.text.trim().isEmpty && _media == null) return;
              setState(() => _posting = true);
              String? url;
              try {
                if (_media != null) {
                  final ref = FirebaseStorage.instance.ref().child('posts/${DateTime.now().millisecondsSinceEpoch}_${_media!.name}');
                  await ref.putFile(File(_media!.path));
                  url = await ref.getDownloadURL();
                }
                await FirebaseFirestore.instance.collection('posts').add({
                  'author': widget.authorName,
                  'text': _c.text.trim(),
                  'mediaUrl': url,
                  'mediaType': _media == null ? null : _mediaType,
                  'time': FieldValue.serverTimestamp(),
                  'likes': 0,
                });
                _c.clear();
                setState(() { _media = null; _mediaType = null; });
              } catch (e) {
                if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('Post failed: $e')));
              } finally {
                if (mounted) setState(() => _posting = false);
              }
            }

            Future<void> _toggleLike(String postId) async {
              final likeRef = FirebaseFirestore.instance.collection('posts').doc(postId).collection('likes').doc(widget.authorName);
              final postRef = FirebaseFirestore.instance.collection('posts').doc(postId);
              final s = await likeRef.get();
              if (s.exists) {
                await likeRef.delete();
                await postRef.update({'likes': FieldValue.increment(-1)});
              } else {
                await likeRef.set({'time': FieldValue.serverTimestamp()});
                await postRef.update({'likes': FieldValue.increment(1)});
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: const Color(0xFF0A3D91),
                  foregroundColor: Colors.white,
                  title: const Text('Pulse'),
                ),
                body: Column(
                  children: [
                    Container(
                      padding: const EdgeInsets.all(8),
                      color: Colors.white,
                      child: Column(
                        children: [
                          TextField(controller: _c, maxLines: null, decoration: const InputDecoration(hintText: "What's on your mind?", border: OutlineInputBorder())),
                          if (_media != null)
                            Padding(
                              padding: const EdgeInsets.only(top: 8),
                              child: Stack(
                                children: [
                                  if (_mediaType == 'image')
                                    ClipRRect(
                                      borderRadius: BorderRadius.circular(8),
                                      child: Image.file(File(_media!.path), height: 150, width: double.infinity, fit: BoxFit.cover),
                                    )
                                  else
                                    Container(
                                      height: 150,
                                      width: double.infinity,
                                      color: Colors.black54,
                                      child: const Center(child: Icon(Icons.videocam, color: Colors.white, size: 50)),
                                    ),
                                  Positioned(
                                    top: 4, right: 4,
                                    child: GestureDetector(
                                      onTap: () => setState(() { _media = null; _mediaType = null; }),
                                      child: Container(padding: const EdgeInsets.all(4), decoration: const BoxDecoration(color: Colors.black54, shape: BoxShape.circle), child: const Icon(Icons.close, color: Colors.white, size: 16)),
                                    ),
                                  ),
                                ],
                              ),
                            ),
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceAround,
                            children: [
                              IconButton(icon: const Icon(Icons.image, color: Color(0xFFF4B41A)), onPressed: _pickImage, tooltip: 'Image'),
                              IconButton(icon: const Icon(Icons.videocam, color: Color(0xFFF4B41A)), onPressed: _pickVideo, tooltip: 'Video'),
                              _posting
                                  ? const Padding(padding: EdgeInsets.all(8), child: SizedBox(width: 24, height: 24, child: CircularProgressIndicator(strokeWidth: 2)))
                                  : IconButton(icon: const Icon(Icons.send, color: Color(0xFF0A3D91)), onPressed: _post, tooltip: 'Post'),
                            ],
                          ),
                        ],
                      ),
                    ),
                    Expanded(
                      child: StreamBuilder<QuerySnapshot>(
                        stream: FirebaseFirestore.instance.collection('posts').orderBy('time', descending: true).snapshots(),
                        builder: (c, s) {
                          if (!s.hasData) return const Center(child: CircularProgressIndicator());
                          if (s.data!.docs.isEmpty) return const Center(child: Text('No posts yet. Be the first!'));
                          return ListView.builder(
                            itemCount: s.data!.docs.length,
                            itemBuilder: (c, i) {
                              final doc = s.data!.docs[i];
                              return _PostCard(
                                docId: doc.id,
                                data: doc.data() as Map<String, dynamic>,
                                authorName: widget.authorName,
                                onLike: () => _toggleLike(doc.id),
                              );
                            },
                          );
                        },
                      ),
                    )
                  ]
                )
              );
            }
          }

          class _PostCard extends StatelessWidget {
            final String docId;
            final Map<String, dynamic> data;
            final String authorName;
            final VoidCallback onLike;
            const _PostCard({required this.docId, required this.data, required this.authorName, required this.onLike});

