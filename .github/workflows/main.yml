                      Column(
                        children: [
                          Padding(
                            padding: const EdgeInsets.all(16),
                            child: Row(
                              children: [
                                Expanded(child: TextField(controller: _codeCtrl, decoration: const InputDecoration(labelText: 'Enter Code (e.g. PDT-1234)', filled: true, fillColor: Color(0xFF131A26)))),
                              ],
                            ),
                          ),
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                            children: [
                              ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.red, foregroundColor: Colors.white), onPressed: _banCodeAndDevice, child: const Text('BAN CODE & DEVICE')),
                              ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.green, foregroundColor: Colors.white), onPressed: _unbanCode, child: const Text('UNBAN CODE & DEVICE')),
                            ],
                          ),
                          const SizedBox(height: 16),
                          Expanded(
                            child: StreamBuilder<QuerySnapshot>(
                              stream: FirebaseFirestore.instance.collection('banned_codes').snapshots(),
                              builder: (c, s) {
                                if (!s.hasData) return const Center(child: CircularProgressIndicator());
                                return ListView.builder(
                                  itemCount: s.data!.docs.length,
                                  itemBuilder: (c, i) {
                                    final doc = s.data!.docs[i];
