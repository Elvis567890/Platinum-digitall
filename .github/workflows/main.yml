          import 'package:flutter/material.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';

          class EnterMarksScreen extends StatefulWidget {
            const EnterMarksScreen({super.key});
            @override
            State<EnterMarksScreen> createState() => _EnterMarksScreenState();
          }
          class _EnterMarksScreenState extends State<EnterMarksScreen> {
            String? _selectedCode;
            String? _selectedName;
            final _classCtrl = TextEditingController();
            final _termCtrl = TextEditingController();
            final _math = TextEditingController();
            final _eng = TextEditingController();
            final _sci = TextEditingController();
            bool _loading = false;

            Future<void> _submit() async {
              if (_selectedCode == null) return;
              setState(() => _loading = true);
              final math = int.tryParse(_math.text) ?? 0;
              final eng = int.tryParse(_eng.text) ?? 0;
              final sci = int.tryParse(_sci.text) ?? 0;
              
              try {
                await FirebaseFirestore.instance.collection('marks').add({
                  'unitCode': _selectedCode,
                  'firstName': _selectedName!.split(' ')[0],
                  'lastName': _selectedName!.split(' ').length > 1 ? _selectedName!.split(' ').sublist(1).join(' ') : '',
                  'studentName': _selectedName,
                  'classLevel': _classCtrl.text.trim().toUpperCase(),
                  'term': _termCtrl.text.trim().isEmpty ? 'Term 1' : _termCtrl.text.trim(),
                  'subjects': [
                    {'name': 'Mathematics', 'score': math, 'grade': math >= 80 ? 'A' : (math >= 60 ? 'B' : 'C')},
                    {'name': 'English', 'score': eng, 'grade': eng >= 80 ? 'A' : (eng >= 60 ? 'B' : 'C')},
                    {'name': 'Science', 'score': sci, 'grade': sci >= 80 ? 'A' : (sci >= 60 ? 'B' : 'C')},
                  ],
                  'total': math + eng + sci,
                  'average': (math + eng + sci) ~/ 3,
                  'time': FieldValue.serverTimestamp(),
                });
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Marks Saved!'), backgroundColor: Colors.green));
                  Navigator.pop(context);
                }
              } catch (e) {
                if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('Error: $e')));
              } finally {
                if (mounted) setState(() => _loading = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Enter Marks')),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    children: [
                      StreamBuilder<QuerySnapshot>(
                        stream: FirebaseFirestore.instance.collection('students').snapshots(),
                        builder: (c, s) {
                          if (!s.hasData) return const CircularProgressIndicator();
                          final students = s.data!.docs.map((d) {
                            final data = d.data() as Map;
                            return {'code': data['unitCode'], 'name': '${data['firstName']} ${data['lastName']}'};
                          }).toList();
                          return DropdownButtonFormField<String>(
                            decoration: const InputDecoration(labelText: 'Select Student'),
                            value: _selectedCode,
                            items: students.map((st) => DropdownMenuItem<String>(value: st['code'], child: Text(st['name']))).toList(),
                            onChanged: (val) {
                              setState(() {
                                _selectedCode = val;
                                _selectedName = students.firstWhere((st) => st['code'] == val)['name'];
                              });
                            },
                          );
                        }
                      ),
                      const SizedBox(height: 16),
                      Row(
                        children: [
                          Expanded(child: TextField(controller: _classCtrl, decoration: const InputDecoration(labelText: 'Class (e.g. S4)'))),
                          const SizedBox(width: 16),
                          Expanded(child: TextField(controller: _termCtrl, decoration: const InputDecoration(labelText: 'Term (e.g. Term 1)'))),
                        ],
                      ),
                      const SizedBox(height: 24),
                      Row(
                        children: [
                          Expanded(child: TextField(controller: _math, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'Math Score'))),
                          const SizedBox(width: 16),
                          Expanded(child: TextField(controller: _sci, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'Science Score'))),
                        ],
                      ),
                      const SizedBox(height: 16),
                      Row(
                        children: [
                          Expanded(child: TextField(controller: _eng, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'English Score'))),
                          const SizedBox(width: 16),
                          Expanded(child: TextField(keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'English Score'))),
                        ],
                      ),
                      const SizedBox(height: 32),
                      SizedBox(
                        width: double.infinity,
                        height: 50,
                        child: ElevatedButton(
                          onPressed: _loading ? null : _submit,
                          child: _loading ? const CircularProgressIndicator(color: Colors.black) : const Text('Save Marks', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                        ),
                      )
                    ],
                  ),
                ),
              );
            }
          }
          EOF

