          cat > lib/screens/ocr_register.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:google_mlkit_text_recognition/google_mlkit_text_recognition.dart';
          import 'dart:io';
          import 'dart:math';

          class OcrRegisterScreen extends StatefulWidget {
            const OcrRegisterScreen({super.key});
            @override State<OcrRegisterScreen> createState() => _OcrRegisterScreenState();
          }
          class _OcrRegisterScreenState extends State<OcrRegisterScreen> {
            List<String> _extractedNames = [];
            String _selectedClass = 'S1';
            bool _loading = false;
            bool _saving = false;

            void _scan() async {
              final img = await ImagePicker().pickImage(source: ImageSource.camera);
              if (img == null) return;
              
              setState(() { _loading = true; _extractedNames.clear(); });
              final rec = TextRecognizer();
              final res = await rec.processImage(InputImage.fromFile(File(img.path)));
              await rec.close();

              List<String> rawLines = res.text.split('\n');
              List<String> cleanedNames = [];
              
              for (String line in rawLines) {
                String clean = line.trim();
                clean = clean.replaceFirst(RegExp(r'^\d+[\.\)]?\s*'), '');
                if (clean.length > 2 && clean.contains(' ')) {
                  cleanedNames.add(clean);
                }
              }

              setState(() { _extractedNames = cleanedNames; _loading = false; });
            }

            void _saveToDatabase() async {
              if (_extractedNames.isEmpty) return;
              setState(() => _saving = true);
              
              int addedCount = 0;
              for (String fullName in _extractedNames) {
                List<String> parts = fullName.split(' ');
                String firstName = parts[0];
                String lastName = parts.length > 1 ? parts.sublist(1).join(' ') : '';
                String genCode = "PDT-${Random().nextInt(8999) + 1000}";

                await FirebaseFirestore.instance.collection('students').add({
                  'firstName': firstName,
                  'lastName': lastName,
                  'fullName': fullName,
                  'classLevel': _selectedClass,
                  'unitCode': genCode,
                  'role': 'Student',
                  'time': FieldValue.serverTimestamp(),
                  'enrollmentYear': DateTime.now().year
                });
                addedCount++;
              }

              setState(() { _saving = false; _extractedNames.clear(); });
              if (mounted) {
                ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('Successfully registered $addedCount students in $_selectedClass!')));
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Scan Physical Register')),
                body: Column(
                  children: [
                    Padding(
                      padding: const EdgeInsets.all(16),
                      child: Column(
                        children: [
                          DropdownButtonFormField<String>(
                            value: _selectedClass,
                            decoration: const InputDecoration(labelText: 'Select Class'),
                            items: ['S1','S2','S3','S4','S5','S6'].map((c) => DropdownMenuItem(value: c, child: Text(c))).toList(),
                            onChanged: (v) => setState(() => _selectedClass = v!),
                          ),
                          const SizedBox(height: 16),
                          SizedBox(
                            width: double.infinity, height: 50,
                            child: ElevatedButton.icon(
                              onPressed: _loading ? null : _scan,
                              icon: const Icon(Icons.camera_alt),
                              label: Text(_loading ? 'Scanning...' : 'Take Photo of Register'),
                            )
                          ),
                        ],
                      ),
                    ),
                    const Divider(),
                    const Padding(
                      padding: EdgeInsets.all(8.0),
                      child: Text('Review Extracted Names Below:', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                    ),
                    Expanded(
                      child: _extractedNames.isEmpty 
                        ? Center(child: Text(_loading ? 'Reading names...' : 'No names scanned yet.', style: const TextStyle(color: Colors.grey)))
                        : ListView.builder(
                            itemCount: _extractedNames.length,
                            itemBuilder: (c, i) => ListTile(
                              leading: const Icon(Icons.person, color: Colors.greenAccent),
                              title: Text(_extractedNames[i]),
                              trailing: IconButton(
                                icon: const Icon(Icons.remove_circle, color: Colors.red),
                                onPressed: () => setState(() => _extractedNames.removeAt(i)),
                              ),
                            ),
                          ),
                    ),
                    if (_extractedNames.isNotEmpty)
                      Padding(
                        padding: const EdgeInsets.all(16),
                        child: SizedBox(
                          width: double.infinity, height: 50,
                          child: ElevatedButton.icon(
                            style: ElevatedButton.styleFrom(backgroundColor: Colors.green, foregroundColor: Colors.white),
                            onPressed: _saving ? null : _saveToDatabase,
                            icon: const Icon(Icons.save),
                            label: Text(_saving ? 'Saving...' : 'Save & Generate Codes for ${_extractedNames.length} Students'),
                          )
                        ),
                      )
                  ],
                ),
              );
            }
          }
          EOF

