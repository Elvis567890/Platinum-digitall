          import 'package:flutter/material.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:firebase_storage/firebase_storage.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:cached_network_image/cached_network_image.dart';
          import 'dart:io';

          class AdminChatScreen extends StatefulWidget {
            final String teacherName;
            const AdminChatScreen({super.key, required this.teacherName});
            @override State<AdminChatScreen> createState() => _AdminChatScreenState();
          }
          class _AdminChatScreenState extends State<AdminChatScreen> {
            final TextEditingController _msgController = TextEditingController();
            bool _isUploading = false;
            final String chatName = 'Whole School';

            Future<void> _sendMessage(String type, {String? filePath, String? text}) async {
              String? mediaUrl;
              if (filePath != null) {
                setState(() => _isUploading = true);
                try {
                  String fileName = DateTime.now().millisecondsSinceEpoch.toString();
                  Reference ref = FirebaseStorage.instance.ref().child('chats/$chatName/$fileName');
                  await ref.putFile(File(filePath));
                  mediaUrl = await ref.getDownloadURL();
                } catch (e) { setState(() => _isUploading = false); return; }
              }

              await FirebaseFirestore.instance.collection('chats').doc(chatName).collection('messages').add({
                'sender': '${widget.teacherName} (Teacher)',
                'text': text ?? '',
                'mediaUrl': mediaUrl,
                'type': type,
                'timestamp': FieldValue.serverTimestamp(),
              });

              _msgController.clear();
              setState(() => _isUploading = false);
            }

            Future<void> _pickMedia(String type) async {
              if (type == 'image') {
                final picker = ImagePicker();
                XFile? file = await picker.pickImage(source: ImageSource.gallery);
                if (file != null) _sendMessage('image', filePath: file.path);
              } else {
                FilePickerResult? result = await FilePicker.platform.pickFiles();
                if (result != null) _sendMessage('document', filePath: result.files.single.path);
              }
            }

            @override Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text('School Chat (Whole School)'), backgroundColor: const Color(0xFF0A3D91)),
                body: Column(
                  children: [
                    if (_isUploading) const LinearProgressIndicator(color: Color(0xFFF4B41A)),
                    Expanded(
                      child: StreamBuilder<QuerySnapshot>(
                        stream: FirebaseFirestore.instance.collection('chats').doc(chatName).collection('messages').orderBy('timestamp', descending: false).snapshots(),
                        builder: (context, snapshot) {
                          if (!snapshot.hasData) return const Center(child: CircularProgressIndicator());
                          final messages = snapshot.data!.docs;
                          return ListView.builder(
                            padding: const EdgeInsets.all(16), itemCount: messages.length,
                            itemBuilder: (context, index) {
                              final msg = messages[index].data() as Map<String, dynamic>;
                              final isMe = msg['sender'].contains(widget.teacherName);
                              return Align(
                                alignment: isMe ? Alignment.centerRight : Alignment.centerLeft,
                                child: Container(
                                  margin: const EdgeInsets.only(bottom: 12), padding: const EdgeInsets.all(12),
                                  decoration: BoxDecoration(color: isMe ? const Color(0xFF0A3D91) : const Color(0xFF1E1E1E), borderRadius: BorderRadius.circular(16)),
                                  child: Column(
                                    crossAxisAlignment: isMe ? CrossAxisAlignment.end : CrossAxisAlignment.start,
                                    children: [
                                      if (!isMe) Text(msg['sender'], style: const TextStyle(fontWeight: FontWeight.bold, color: Color(0xFFF4B41A), fontSize: 12)),
                                      if (msg['text'].isNotEmpty) Text(msg['text'], style: const TextStyle(color: Colors.white)),
                                      if (msg['type'] == 'image') Padding(padding: const EdgeInsets.only(top: 8), child: ClipRRect(borderRadius: BorderRadius.circular(8), child: CachedNetworkImage(imageUrl: msg['mediaUrl'], width: 200))),
                                      if (msg['type'] == 'document') Padding(padding: const EdgeInsets.only(top: 8), child: const Row(children: [Icon(Icons.file_present, color: Colors.white), SizedBox(width: 8), Text('Attachment', style: TextStyle(color: Colors.white))])),
                                    ],
                                  ),
                                ),
                              );
                            },
                          );
                        },
                      ),
                    ),
                    Padding(
                      padding: const EdgeInsets.all(8.0),
                      child: Row(
                        children: [
                          IconButton(icon: const Icon(Icons.add_circle, color: Color(0xFFF4B41A)), onPressed: () {
                            showModalBottomSheet(context: context, builder: (context) => Wrap(children: [
                              ListTile(leading: const Icon(Icons.image), title: const Text('Send Image'), onTap: () { Navigator.pop(context); _pickMedia('image'); }),
                              ListTile(leading: const Icon(Icons.audiotrack), title: const Text('Send Audio/Doc'), onTap: () { Navigator.pop(context); _pickMedia('document'); }),
                            ]));
                          }),
                          Expanded(child: TextField(controller: _msgController, decoration: InputDecoration(hintText: 'Broadcast to school...', filled: true, border: OutlineInputBorder(borderRadius: BorderRadius.circular(30))), onSubmitted: (val) => _sendMessage('text', text: val))),
                          IconButton(icon: const Icon(Icons.send, color: Color(0xFF0A3D91)), onPressed: () => _sendMessage('text', text: _msgController.text)),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }
