              final prefs = await SharedPreferences.getInstance();
              setState(() {
                _subscribed = prefs.getStringList('subscribedGroups') ?? ['All'];
                _loading = false;
              });
            }

            Future<void> _toggleSub(String groupName) async {
              final prefs = await SharedPreferences.getInstance();
              setState(() {
                if (_subscribed.contains(groupName)) {
                  _subscribed.remove(groupName);
                } else {
                  _subscribed.add(groupName);
                }
              });
