          import 'package:flutter/material.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          class EnterMarksScreen extends StatefulWidget {
            const EnterMarksScreen({super.key});
            @override State<EnterMarksScreen> createState() => _EnterMarksScreenState();
          }
          class _EnterMarksScreenState extends State<EnterMarksScreen> {
            final _fn = TextEditingController(); final _ln = TextEditingController(); final _cls = TextEditingController(); final _term = TextEditingController(); final _subjects = [TextEditingController(), TextEditingController(), TextEditingController()]; final _scores = [TextEditingController(), TextEditingController(), TextEditingController()];
            void _save() async {
              if (_fn.text.isEmpty || _ln.text.isEmpty) return; int total = 0; List<Map<String, dynamic>> subjectsList = [];
              for(int i=0; i<3; i++) { if(_subjects[i].text.isNotEmpty && _scores[i].text.isNotEmpty) { int score = int.tryParse(_scores[i].text) ?? 0; total += score; subjectsList.add({'name': _subjects[i].text, 'score': score, 'grade': score >= 80 ? 'A' : (score >= 60 ? 'B' : 'C')}); } }
              if (subjectsList.isEmpty) return;
              await FirebaseFirestore.instance.collection('marks').add({'firstName': _fn.text.trim(), 'lastName': _ln.text.trim(), 'classLevel': _cls.text.trim().toUpperCase(), 'term': _term.text.trim().isEmpty ? 'Term 1' : _term.text.trim(), 'subjects': subjectsList, 'total': total, 'average': total ~/ subjectsList.length, 'time': FieldValue.serverTimestamp(), 'unitCode': '${_fn.text.trim().toLowerCase()}-${_ln.text.trim().toLowerCase()}'});
              if (mounted) Navigator.pop(context);
            }
            @override Widget build(BuildContext context) => Scaffold(appBar: AppBar(title: const Text('Enter Marks')), body: ListView(padding: const EdgeInsets.all(16), children: [TextField(controller: _fn, decoration: const InputDecoration(labelText: 'First Name')), TextField(controller: _ln, decoration: const InputDecoration(labelText: 'Last Name')), Row(children: [Expanded(child: TextField(controller: _cls, decoration: const InputDecoration(labelText: 'Class'))), const SizedBox(width: 16), Expanded(child: TextField(controller: _term, decoration: const InputDecoration(labelText: 'Term')))]), const Divider(height: 40), const Text('Subject & Score', style: TextStyle(fontWeight: FontWeight.bold)), const SizedBox(height: 16), for(int i=0; i<3; i++) Row(children: [Expanded(child: TextField(controller: _subjects[i], decoration: const InputDecoration(hintText: 'Subject'))), const SizedBox(width: 16), SizedBox(width: 100, child: TextField(controller: _scores[i], keyboardType: TextInputType.number, decoration: const InputDecoration(hintText: 'Score')))],), const SizedBox(height: 32), ElevatedButton(onPressed: _save, child: const Text('Save Marks'))]));
          }
