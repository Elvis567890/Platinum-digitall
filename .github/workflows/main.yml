import 'package:flutter/material.dart';
import 'dashboard.dart';

class LoginScreen extends StatefulWidget {
  const LoginScreen({super.key});
  @override
  State<LoginScreen> createState() => _LoginScreenState();
}

class _LoginScreenState extends State<LoginScreen> {
  final _id = TextEditingController();
  final _pin = TextEditingController();
  String _role = 'teacher';

  void _login() {
    if (_id.text.isEmpty || _pin.text.isEmpty) return;
    Navigator.pushReplacement(context, MaterialPageRoute(
      builder: (_) => DashboardScreen(role: _role, name: _id.text),
    ));
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      body: Padding(
        padding: const EdgeInsets.all(24),
        child: Column(
          mainAxisAlignment: MainAxisAlignment.center,
          children: [
            const Text('Platinum Digital App',
              style: TextStyle(fontSize: 26, fontWeight: FontWeight.bold,
                color: Color(0xFFCC0000))),
            const SizedBox(height: 8),
            const Text('Admin Portal',
              style: TextStyle(fontSize: 16, color: Colors.grey)),
            const SizedBox(height: 32),
            TextField(controller: _id,
              decoration: const InputDecoration(labelText: 'Staff ID',
                border: OutlineInputBorder())),
            const SizedBox(height: 16),
            TextField(controller: _pin, obscureText: true,
              decoration: const InputDecoration(labelText: 'PIN',
                border: OutlineInputBorder())),
            const SizedBox(height: 16),
            DropdownButtonFormField<String>(
              value: _role,
              decoration: const InputDecoration(labelText: 'Role',
                border: OutlineInputBorder()),
              items: const [
                DropdownMenuItem(value: 'super_admin', child: Text('Super Admin')),
                DropdownMenuItem(value: 'release_admin', child: Text('Release Admin')),
                DropdownMenuItem(value: 'admin', child: Text('Admin')),
                DropdownMenuItem(value: 'teacher', child: Text('Teacher')),
              ],
              onChanged: (v) => setState(() => _role = v!),
            ),
            const SizedBox(height: 24),
            SizedBox(width: double.infinity,
              child: ElevatedButton(
                style: ElevatedButton.styleFrom(
                  backgroundColor: const Color(0xFFCC0000),
                  foregroundColor: Colors.white,
                  padding: const EdgeInsets.symmetric(vertical: 16),
                ),
                onPressed: _login,
                child: const Text('Login', style: TextStyle(fontSize: 18)),
              )),
          ],
        ),
      ),
    );
  }
}
