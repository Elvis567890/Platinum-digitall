          import 'package:shared_preferences/shared_preferences.dart';

          import 'screens/home.dart';
          import 'screens/login.dart';

          const _gold = Color(0xFFD4AF37);
          const _bg = Color(0xFF0B0F19);
          const _card = Color(0xFF131A26);
          const _otaRepo = 'Elvis567890/Platinum-digitall';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            try {
              await Firebase.initializeApp(
                options: const FirebaseOptions(
                  apiKey: 'AIzaSyDl-dfyyRT9kdxJOCm4ZM6QYmnY1cgXI0M',
                  appId: '1:374715668746:android:b985232e1b3a6d0d4342f3',
                  messagingSenderId: '374715668746',
                  projectId: 'payment-sas',
                  storageBucket: 'payment-sas.firebasestorage.app',
                ),
              );
              if (FirebaseAuth.instance.currentUser == null) {
                await FirebaseAuth.instance.signInAnonymously();
              }
              runApp(const App());
            } catch (e) {
              runApp(BootstrapErrorApp(error: e.toString()));
            }
          }

          class BootstrapErrorApp extends StatelessWidget {
            final String error;
            const BootstrapErrorApp({super.key, required this.error});
            @override
            Widget build(BuildContext context) => MaterialApp(
              debugShowCheckedModeBanner: false,
              theme: ThemeData.dark(useMaterial3: true),
              home: Scaffold(
                backgroundColor: _bg,
                body: Center(
                  child: Padding(
                    padding: const EdgeInsets.all(24),
                    child: Column(mainAxisSize: MainAxisSize.min, children: [
                      const Icon(Icons.error_outline, color: _gold, size: 64),
                      const SizedBox(height: 16),
                      const Text('Could not start the app', style: TextStyle(fontSize: 22, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 12),
                      Text('Check your network connection and try again.\n\n$error', textAlign: TextAlign.center, style: const TextStyle(color: Colors.grey, fontSize: 12)),
                      const SizedBox(height: 24),
                      ElevatedButton(
                        style: ElevatedButton.styleFrom(backgroundColor: _gold, foregroundColor: Colors.black),
                        onPressed: () => main(),
                        child: const Text('Retry'),
                      ),
                    ]),
                  ),
                ),
              ),
            );
          }

          class App extends StatelessWidget {
            const App({super.key});
            @override
            Widget build(BuildContext context) => MaterialApp(
              title: 'Platinum Digital App',
              debugShowCheckedModeBanner: false,
              theme: ThemeData(
                brightness: Brightness.dark,
                primaryColor: _bg,
                scaffoldBackgroundColor: _bg,
                useMaterial3: true,
                textTheme: GoogleFonts.outfitTextTheme(Theme.of(context).textTheme.apply(bodyColor: Colors.white)),
                appBarTheme: const AppBarTheme(backgroundColor: _bg, elevation: 0, centerTitle: true, scrolledUnderElevation: 0),
                cardTheme: const CardTheme(color: _card, elevation: 0, margin: EdgeInsets.zero, shape: RoundedRectangleBorder(borderRadius: BorderRadius.all(Radius.circular(18)))),
                inputDecorationTheme: InputDecorationTheme(filled: true, fillColor: _card, border: const OutlineInputBorder(borderRadius: BorderRadius.all(Radius.circular(14)), borderSide: BorderSide.none), enabledBorder: const OutlineInputBorder(borderRadius: BorderRadius.all(Radius.circular(14)), borderSide: BorderSide(color: Colors.white12)), focusedBorder: const OutlineInputBorder(borderRadius: BorderRadius.all(Radius.circular(14)), borderSide: BorderSide(color: _gold, width: 1.5))),
                elevatedButtonTheme: ElevatedButtonThemeData(style: ElevatedButton.styleFrom(minimumSize: const Size(0, 48), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14)), backgroundColor: _gold, foregroundColor: Colors.black)),
                bottomNavigationBarTheme: const BottomNavigationBarThemeData(backgroundColor: _card, selectedItemColor: _gold, unselectedItemColor: Colors.grey),
              ),
              home: const Start(),
            );
          }

          class Start extends StatefulWidget {
            const Start({super.key});
            @override
            State<Start> createState() => _StartState();
          }

          class _StartState extends State<Start> {
            @override
            void initState() {
              super.initState();
              WidgetsBinding.instance.addPostFrameCallback((_) => _init());
            }

            Future<void> _init() async {
              _checkForUpdates();
              final prefs = await SharedPreferences.getInstance();
              final isLoggedIn = prefs.getBool('isLoggedIn') ?? false;
              if (!mounted) return;
              Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => isLoggedIn ? const HomeScreen() : const LoginScreen()));
            }

            Future<void> _checkForUpdates() async {
              try {
                final pInfo = await PackageInfo.fromPlatform();
                final res = await http.get(Uri.parse('https://api.github.com/repos/$_otaRepo/releases'), headers: {'Accept': 'application/vnd.github+json'}).timeout(const Duration(seconds: 12));
                if (res.statusCode != 200) return;
                final list = jsonDecode(res.body);
                if (list is! List) return;
                final tagRe = RegExp(r'^v(\d+\.\d+\.\d+)$');
                String? bestVersion; String? bestUrl; int bestSize = 0;
                for (final r in list) {
                  if (r is! Map) continue;
                  if (r['draft'] == true || r['prerelease'] == true) continue;
                  final m = tagRe.firstMatch((r['tag_name'] ?? '').toString());
                  if (m == null) continue;
                  final v = m.group(1)!;
                  if (_cmp(v, pInfo.version) <= 0) continue;
                  final assets = (r['assets'] as List?) ?? const [];
                  Map? apk;
                  for (final a in assets) {
                    if (a is Map && (a['name'] ?? '').toString().toLowerCase().endsWith('.apk')) { apk = a; break; }
                  }
                  if (apk == null) continue;
                  if (bestVersion == null || _cmp(v, bestVersion) > 0) {
                    bestVersion = v;
                    bestUrl = apk['browser_download_url']?.toString();
                    bestSize = (apk['size'] as num?)?.toInt() ?? 0;
                  }
                }
                if (bestVersion == null || bestUrl == null || bestUrl.isEmpty) return;
                if (!mounted) return;
                _promptUpdate(bestVersion, bestUrl, bestSize);
              } catch (e) { debugPrint('OTA check failed: $e'); }
            }

            void _promptUpdate(String version, String url, int sizeBytes) {
              final sizeMb = sizeBytes > 0 ? (sizeBytes / (1024 * 1024)).toStringAsFixed(1) : '?';
              showDialog<void>(context: context, barrierDismissible: false, builder: (ctx) => AlertDialog(
                title: const Text('Update available'),
                content: Text('Version $version is available.\n\nDownload size: $sizeMb MB'),
                actions: [
                  TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('Later')),
                  ElevatedButton(onPressed: () { Navigator.pop(ctx); _download(url); }, child: const Text('Update now')),
                ],
              ));
            }

            Future<void> _download(String url) async {
              var status = await Permission.requestInstallPackages.status;
              if (!status.isGranted) { status = await Permission.requestInstallPackages.request(); }
              if (!status.isGranted) {
                if (mounted) ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Install permission denied. Enable "Install unknown apps" for this app in system settings.')));
                return;
              }
              if (!mounted) return;
              showDialog<void>(context: context, barrierDismissible: false, builder: (ctx) => const AlertDialog(
                content: Column(mainAxisSize: MainAxisSize.min, children: [CircularProgressIndicator(color: _gold), SizedBox(height: 20), Text('Downloading update...')]),
              ));
              try {
                Directory? dir;
                try { dir = await getExternalStorageDirectory(); } catch (_) {}
                dir ??= await getApplicationDocumentsDirectory();
                final path = '${dir.path}/platinum-update-${DateTime.now().millisecondsSinceEpoch}.apk';
                final dio = Dio(BaseOptions(connectTimeout: const Duration(seconds: 30), receiveTimeout: const Duration(minutes: 5), headers: {'Accept': 'application/octet-stream'}));
                await dio.download(url, path);
                if (mounted) Navigator.of(context, rootNavigator: true).pop();
                final result = await OpenFilex.open(path);
                if (result.type != ResultType.done && mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('Could not launch installer: ${result.message}')));
                }
              } catch (e) {
                if (mounted) Navigator.of(context, rootNavigator: true).pop();
                if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('Download failed: $e')));
              }
            }

            int _cmp(String a, String b) {
              final pa = a.split('.').map((x) => int.tryParse(x) ?? 0).toList();
              final pb = b.split('.').map((x) => int.tryParse(x) ?? 0).toList();
              for (var i = 0; i < pa.length || i < pb.length; i++) {
                final d = (i < pa.length ? pa[i] : 0) - (i < pb.length ? pb[i] : 0);
                if (d != 0) return d;
              }
              return 0;
            }

            @override
            Widget build(BuildContext context) => const Scaffold(body: Center(child: CircularProgressIndicator(color: _gold)));
          }
          EOF_MAIN

