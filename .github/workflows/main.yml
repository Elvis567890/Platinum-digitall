          import 'package:flutter/material.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';

          class EnterMarksScreen extends StatefulWidget {
            const EnterMarksScreen({super.key});
            @override
            State<EnterMarksScreen> createState() => _EnterMarksScreenState();
          }
          class _EnterMarksScreenState extends State<EnterMarksScreen> {
            String? _selectedStudentCode;
            String? _selectedStudentName;
            final _classLevel = TextEditingController();
            final _term = TextEditingController();
            final _math = TextEditingController();
            final _eng = TextEditingController();
            final _sci = TextEditingController();
            bool _loading = false;

            Future<void> _submit() async {
              if (_selectedStudentCode == null || _classLevel.text.isEmpty) {
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Please select a student and enter class.')));
                return;
              }
              setState(() => _loading = true);
              final mathScore = int.tryParse(_math.text);
              final engScore = int.tryParse(_eng.text);
              final sciScore = int.tryParse(_sci.text);
              if ([mathScore, engScore, sciScore].any((v) => v == null || v < 0 || v > 100)) {
                if (mounted) {
                  setState(() => _loading = false);
                  ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Scores must be whole numbers from 0 to 100.')));
                }
                return;
              }
              final math = mathScore!;
              final eng = engScore!;
              final sci = sciScore!;
              final total = math + eng + sci;
              final average = total ~/ 3;
              try {
              await FirebaseFirestore.instance.collection('marks').add({
                'unitCode': _selectedStudentCode,
                'firstName': _selectedStudentName!.split(' ')[0],
                'lastName': _selectedStudentName!.split(' ').sublist(1).join(' '),
                'studentName': _selectedStudentName,
                'classLevel': _classLevel.text.trim().toUpperCase(),
                'term': _term.text.isEmpty ? 'Term 1' : _term.text.trim(),
                'subjects': [
                  {'name': 'Mathematics', 'score': math, 'grade': math >= 80 ? 'A' : (math >= 60 ? 'B' : 'C')},
                  {'name': 'English', 'score': eng, 'grade': eng >= 80 ? 'A' : (eng >= 60 ? 'B' : 'C')},
                  {'name': 'Science', 'score': sci, 'grade': sci >= 80 ? 'A' : (sci >= 60 ? 'B' : 'C')},
                ],
                'total': total,
                'average': average,
                'time': FieldValue.serverTimestamp(),
              });
              if (mounted) {
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Marks Saved Successfully!'), backgroundColor: Colors.green));
                Navigator.pop(context);
              }
              } catch (e) {
                if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('Could not save marks: $e')));
              } finally {
                if (mounted) setState(() => _loading = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Enter Student Marks')),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    children: [
                      StreamBuilder<QuerySnapshot>(
                        stream: FirebaseFirestore.instance.collection('students').snapshots(),
                        builder: (c, s) {
                          if (!s.hasData) return const CircularProgressIndicator();
                          final students = s.data!.docs.map((d) {
                            final data = d.data() as Map;
                            return {
                              'code': data['unitCode'],
                              'name': '${data['firstName']} ${data['lastName']}',
                            };
                          }).toList();
                          return DropdownButtonFormField<String>(
                            decoration: const InputDecoration(labelText: 'Select Registered Student', border: OutlineInputBorder()),
                            value: _selectedStudentCode,
                            items: students.map((st) => DropdownMenuItem<String>(
                              value: st['code'] as String,
                              child: Text(st['name'] as String),
                            )).toList(),
                            onChanged: (val) {
                              setState(() {
                                _selectedStudentCode = val;
                                _selectedStudentName = students.firstWhere((st) => st['code'] == val)['name'];
                              });
                            },
                          );
                        }
                      ),
                      const SizedBox(height: 10),
                      Row(
                        children: [
                          Expanded(child: TextField(controller: _classLevel, decoration: const InputDecoration(labelText: 'Class (e.g. S4)', border: OutlineInputBorder()))),
                          const SizedBox(width: 10),
                          Expanded(child: TextField(controller: _term, decoration: const InputDecoration(labelText: 'Term (e.g. Term 1)', border: OutlineInputBorder()))),
                        ],
                      ),
                      const SizedBox(height: 20),
                      const Divider(),
                      const SizedBox(height: 10),
                      TextField(controller: _math, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'Mathematics Score (0-100)', border: OutlineInputBorder())),
                      const SizedBox(height: 10),
                      TextField(controller: _eng, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'English Score (0-100)', border: OutlineInputBorder())),
                      const SizedBox(height: 10),
                      TextField(controller: _sci, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'Science Score (0-100)', border: OutlineInputBorder())),
                      const SizedBox(height: 24),
                      SizedBox(
                        width: double.infinity,
                        child: ElevatedButton(
                          style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFD4AF37), foregroundColor: Colors.black, padding: const EdgeInsets.symmetric(vertical: 16)),
                          onPressed: _loading ? null : _submit,
                          child: _loading ? const CircularProgressIndicator(color: Colors.black) : const Text('Save Marks', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                        ),
                      )
                    ]
                  )
                )
              );
            }
          }
