          import 'package:flutter/material.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';

          class BanManagerScreen extends StatefulWidget {
            const BanManagerScreen({super.key});
            @override State<BanManagerScreen> createState() => _BanManagerScreenState();
          }
          class _BanManagerScreenState extends State<BanManagerScreen> {
            final _codeCtrl = TextEditingController();
            final _deviceCtrl = TextEditingController();

            void _banCodeAndDevice() async {
              if (_codeCtrl.text.isEmpty) return;
              String code = _codeCtrl.text.trim().toUpperCase();
              
              final snap = await FirebaseFirestore.instance.collection('students').where('unitCode', isEqualTo: code).limit(1).get();
              if (snap.docs.isNotEmpty) {
                final deviceId = snap.docs.first.data()['device_id'];
                
                await FirebaseFirestore.instance.collection('banned_codes').doc(code).set({'time': FieldValue.serverTimestamp()});
                
                if (deviceId != null) {
                  await FirebaseFirestore.instance.collection('banned_devices').doc(deviceId).set({'time': FieldValue.serverTimestamp()});
                }
                _codeCtrl.clear();
                if (mounted) ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Code and Device Banned Successfully')));
              } else {
                if (mounted) ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Student with this code not found')));
              }
            }

            void _unbanCode() async {
              if (_codeCtrl.text.isEmpty) return;
              String code = _codeCtrl.text.trim().toUpperCase();

              final snap = await FirebaseFirestore.instance.collection('students').where('unitCode', isEqualTo: code).limit(1).get();
              
              await FirebaseFirestore.instance.collection('banned_codes').doc(code).delete();
              
              if (snap.docs.isNotEmpty) {
                final deviceId = snap.docs.first.data()['device_id'];
                if (deviceId != null) {
                  await FirebaseFirestore.instance.collection('banned_devices').doc(deviceId).delete();
                }
              }

              _codeCtrl.clear();
              if (mounted) ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Code and Device Unbanned Successfully')));
            }

            @override
            Widget build(BuildContext context) {
              return DefaultTabController(
                length: 2,
                child: Scaffold(
                  appBar: AppBar(title: const Text('Security & Bans'), bottom: const TabBar(tabs: [Tab(text: 'Banned Codes'), Tab(text: 'Banned Devices')])),
