name: Build Platinum Digital App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate all code
        run: |
          cat > /tmp/gen.sh << 'GENEOF'
          #!/bin/bash
          set -e

          mkdir -p shared/lib/models shared/lib/services

          cat > shared/pubspec.yaml << 'SHAREDPUBSPEC'
