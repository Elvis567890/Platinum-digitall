                        child: CachedNetworkImage(imageUrl: data['mediaUrl'], width: double.infinity, height: 250, fit: BoxFit.cover),
                      ),
                    if (data['mediaType'] == 'video' && data['mediaUrl'] != null)
                      Padding(
