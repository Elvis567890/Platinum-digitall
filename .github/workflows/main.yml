      - name: Decode Google Services JSON (Admin)
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | tr -d '[:space:]' | base64 -d > admin_app/android/app/google-services.json

      - name: Build Admin APK
        run: |
          cd admin_app
          flutter clean
          flutter pub get
          flutter pub run flutter_launcher_icons
          flutter pub run flutter_native_splash:create
          flutter build apk --release

      - name: Create Release (Staff OTA)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: staff-v1.0.${{ github.run_number }}
          name: Platinum Staff Hub v1.0.${{ github.run_number }}
          files: admin_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: platinum-staff-hub-apk
          path: admin_app/build/app/outputs/flutter-apk/app-release.apk
