          import 'package:flutter/material.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'dart:math';

          class EnterMarksScreen extends StatefulWidget {
            const EnterMarksScreen({super.key});
            @override
            State<EnterMarksScreen> createState() => _EnterMarksScreenState();
          }
          class _EnterMarksScreenState extends State<EnterMarksScreen> {
            final _name = TextEditingController();
            final _classLevel = TextEditingController();
            final _term = TextEditingController();
            final _math = TextEditingController();
            final _eng = TextEditingController();
            final _sci = TextEditingController();
            
            bool _loading = false;

            String _generateCode() {
              const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
              final rand = Random();
              return List.generate(6, (index) => chars[rand.nextInt(chars.length)]).join();
            }

            Future<void> _submit() async {
              if (_name.text.isEmpty || _classLevel.text.isEmpty) return;
              setState(() => _loading = true);

              int mathScore = int.tryParse(_math.text) ?? 0;
              int engScore = int.tryParse(_eng.text) ?? 0;
              int sciScore = int.tryParse(_sci.text) ?? 0;
              int total = mathScore + engScore + sciScore;
              int average = total ~/ 3;
              
              String unitCode = _generateCode();

              await FirebaseFirestore.instance.collection('marks').add({
                'studentName': _name.text.trim(),
                'classLevel': _classLevel.text.trim().toUpperCase(),
                'term': _term.text.isEmpty ? 'Term 1' : _term.text.trim(),
                'unitCode': unitCode,
                'subjects': [
                  {'name': 'Mathematics', 'score': mathScore, 'grade': mathScore > 80 ? 'A' : (mathScore > 60 ? 'B' : 'C')},
                  {'name': 'English', 'score': engScore, 'grade': engScore > 80 ? 'A' : (engScore > 60 ? 'B' : 'C')},
                  {'name': 'Science', 'score': sciScore, 'grade': sciScore > 80 ? 'A' : (sciScore > 60 ? 'B' : 'C')},
                ],
                'total': total,
                'average': average,
                'time': FieldValue.serverTimestamp(),
              });

              if (mounted) {
                showDialog(
                  context: context,
                  barrierDismissible: false,
                  builder: (ctx) => AlertDialog(
                    backgroundColor: const Color(0xFF131A26),
                    title: const Text('Report Generated!', style: TextStyle(color: Color(0xFFD4AF37))),
                    content: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        const Text('Write down this Unit Code and give it to the student. They will use it to view their marks.'),
                        const SizedBox(height: 16),
                        Text(unitCode, style: const TextStyle(fontSize: 32, fontWeight: FontWeight.bold, color: Colors.white, letterSpacing: 4)),
                        const SizedBox(height: 16),
                        Text('Student: ${_name.text}', style: const TextStyle(color: Colors.grey)),
                      ],
                    ),
                    actions: [
                      TextButton(
                        onPressed: () {
                          Navigator.pop(ctx);
                          Navigator.pop(context);
                        },
                        child: const Text('Done', style: TextStyle(color: Color(0xFFD4AF37))),
                      )
                    ]
                  )
                );
              }
              setState(() => _loading = false);
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Enter Student Marks')),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    children: [
                      TextField(controller: _name, decoration: const InputDecoration(labelText: 'Student Full Name', border: OutlineInputBorder())),
                      const SizedBox(height: 10),
                      Row(
                        children: [
                          Expanded(child: TextField(controller: _classLevel, decoration: const InputDecoration(labelText: 'Class (e.g. S4)', border: OutlineInputBorder()))),
                          const SizedBox(width: 10),
                          Expanded(child: TextField(controller: _term, decoration: const InputDecoration(labelText: 'Term (e.g. Term 1)', border: OutlineInputBorder()))),
                        ],
                      ),
                      const SizedBox(height: 20),
                      const Divider(),
                      const SizedBox(height: 10),
                      TextField(controller: _math, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'Mathematics Score (0-100)', border: OutlineInputBorder())),
                      const SizedBox(height: 10),
                      TextField(controller: _eng, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'English Score (0-100)', border: OutlineInputBorder())),
                      const SizedBox(height: 10),
                      TextField(controller: _sci, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'Science Score (0-100)', border: OutlineInputBorder())),
                      const SizedBox(height: 24),
                      SizedBox(
                        width: double.infinity,
