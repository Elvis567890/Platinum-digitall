      - name: Decode Google Services (Student)
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | tr -d '[:space:]' | base64 -d > student_app/android/app/google-services.json

      - name: Build Student
        run: |
          cd student_app
          flutter clean
          rm -rf ~/.gradle/caches/transforms-*
          rm -f pubspec.lock
          flutter pub get
          flutter build apk --release --no-tree-shake-icons --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Release Student
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: student_app/build/app/outputs/flutter-apk/app-release.apk

  # ==========================================
  # JOB 2: ADMIN APP (Platinum Staff Hub)
  # ==========================================
  build-admin:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with: {distribution: 'zulu', java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.24.5', channel: stable, cache: true}

      - name: Find and Convert Logo (Admin)
        run: |
          IMG_PATH=$(find . -maxdepth 1 -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) ! -name "logo.png" | head -n 1)
          if [ -z "$IMG_PATH" ]; then echo "Error: No logo found!"; exit 1; fi
          sudo apt-get update && sudo apt-get install -y imagemagick-6.q16
