          cat > lib/screens/manage_clubs.dart << 'MNGCLUB'
          import 'package:flutter/material.dart';
          class ManageClubsScreen extends StatelessWidget { const ManageClubsScreen({super.key}); @override Widget build(BuildContext context) => Scaffold(appBar: AppBar(title: const Text('Manage Clubs'), backgroundColor: Color(0xFF0A3D91)), body: const Center(child: Text('Club Management'))); }
          MNGCLUB

      - name: Verify Features Exist (The Checker)
        run: |
          echo "🔍 Verifying Admin App Features..."
          if grep -q "FirstTimeSetupScreen" admin_app/lib/main.dart; then echo "✅ First Time Setup"; else echo "❌ Missing Setup"; exit 1; fi
          if grep -q "super_admin" admin_app/lib/screens/dashboard.dart; then echo "✅ Role Based Dashboard"; else echo "❌ Missing Roles"; exit 1; fi
          if grep -q "sqflite" admin_app/lib/services/database_helper.dart; then echo "✅ SQLite Local DB"; else echo "❌ Missing SQLite"; exit 1; fi

      - name: Build Admin APK
        run: |
          cd admin_app
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
          flutter build apk --release

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: staff-hub-apk
          path: admin_app/build/app/outputs/flutter-apk/app-release.apk
