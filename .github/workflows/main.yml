          import 'package:http/http.dart' as http;
          import 'dart:convert';
          import 'package:url_launcher/url_launcher.dart';

          void main() => runApp(const PlatinumStudentApp());

          class PlatinumStudentApp extends StatelessWidget {
            const PlatinumStudentApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Platinum Digital App',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(primaryColor: const Color(0xFF0A3D91)),
                home: const StartupScreen(),
              );
            }
          }

          class StartupScreen extends StatefulWidget {
            const StartupScreen({super.key});
            @override
            State<StartupScreen> createState() => _StartupScreenState();
          }
          class _StartupScreenState extends State<StartupScreen> {
            @override
            void initState() { super.initState(); _initApp(); }

            Future<void> _initApp() async { await _checkForUpdates(); _checkRegistration(); }

            Future<void> _checkForUpdates() async {
              try {
                final PackageInfo packageInfo = await PackageInfo.fromPlatform();
                final currentVersion = packageInfo.version; 
                const String updateUrl = 'https://raw.githubusercontent.com/Elvis567890/Platinum-Digital/main/version.json';
                final response = await http.get(Uri.parse(updateUrl));
                if (response.statusCode == 200) {
                  final data = jsonDecode(response.body);
                  final String latestVersion = data['version'];
                  final String apkUrl = data['url'];
                  if (latestVersion != currentVersion && mounted) _showUpdateDialog(apkUrl, latestVersion);
                }
              } catch (e) { print("Update check failed: $e"); }
            }

            void _showUpdateDialog(String apkUrl, String version) {
              showDialog(
                context: context, barrierDismissible: false,
                builder: (ctx) => AlertDialog(
                  title: const Text('Update Available 🚀'),
                  content: Text('A new version ($version) of Platinum Digital App is available. Update now!'),
                  actions: [ElevatedButton(onPressed: () async { final uri = Uri.parse(apkUrl); if (await canLaunchUrl(uri)) await launchUrl(uri, mode: LaunchMode.externalApplication); }, child: const Text('Download Update'))],
                ),
              );
            }

            Future<void> _checkRegistration() async {
              final db = await DatabaseHelper.instance.database;
              final result = await db.query('students', limit: 1);
              if (mounted) {
                if (result.isEmpty) Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const RegistrationScreen()));
                else Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const HomeScreen()));
              }
            }
            @override
            Widget build(BuildContext context) => const Scaffold(body: Center(child: CircularProgressIndicator()));
          }
