name: Build Platinum Ecosystem (Final UI Masterpiece)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: BUILD PLATINUM DIGITAL APP (STUDENT)
  # ==========================================
  build-student:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate Student App Code
        run: |
          if [ ! -d "student_app" ]; then
            mkdir -p student_app/assets
            flutter create --org com.platinum --project-name student_app student_app
            mkdir -p student_app/lib/screens student_app/lib/services
          fi

          if [ -f "InShot_20261017_024714317.jpg" ]; then
            convert InShot_20261017_024714317.jpg -fuzz 5% -transparent white -resize 850x850 -background "#FFFFFF" -gravity center -extent 1024x1024 student_app/assets/logo.png
          elif [ ! -f "student_app/assets/logo.png" ]; then
            convert -size 1024x1024 xc:"#FFFFFF" student_app/assets/logo.png
          fi

          sed -i 's/distributionUrl=.*/distributionUrl=https\\:\/\/services.gradle.org\/distributions\/gradle-8.7-all.zip/g' student_app/android/gradle/wrapper/gradle-wrapper.properties

          cat > student_app/android/build.gradle << 'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://github.com/jitsi/jitsi-maven-repository/raw/master/releases" }
              }
          }
          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              afterEvaluate { project ->
                  if (project.extensions.findByName("android") != null) {
                      project.android {
                          compileSdk 34
                          compileOptions {
                              sourceCompatibility JavaVersion.VERSION_17
                              targetCompatibility JavaVersion.VERSION_17
                          }
                      }
                  }
                  tasks.withType(JavaCompile).configureEach {
                      sourceCompatibility = "17"
                      targetCompatibility = "17"
                  }
              }
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }
          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

          cat > student_app/android/settings.gradle << 'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.5.0" apply false
              id "org.jetbrains.kotlin.android" version "2.0.10" apply false
          }
          include ":app"
          EOF

          grep -q "android.newDsl=false" student_app/android/gradle.properties || echo "android.newDsl=false" >> student_app/android/gradle.properties
          grep -q "android.builtInKotlin=false" student_app/android/gradle.properties || echo "android.builtInKotlin=false" >> student_app/android/gradle.properties
          grep -q "android.useAndroidX=true" student_app/android/gradle.properties || echo "android.useAndroidX=true" >> student_app/android/gradle.properties
          grep -q "android.enableJetifier=true" student_app/android/gradle.properties || echo "android.enableJetifier=true" >> student_app/android/gradle.properties
          grep -q "kotlin.jvm.target.validation.mode = IGNORE" student_app/android/gradle.properties || echo "kotlin.jvm.target.validation.mode = IGNORE" >> student_app/android/gradle.properties

          sed -i 's/<manifest/<manifest xmlns:tools="http:\/\/schemas.android.com\/tools"/' student_app/android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true" android:requestLegacyExternalStorage="true" tools:replace="android:label"/' student_app/android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="student_app"/android:label="Platinum Digital App"/g' student_app/android/app/src/main/AndroidManifest.xml
          grep -q "REQUEST_INSTALL_PACKAGES" student_app/android/app/src/main/AndroidManifest.xml || sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.CAMERA"\/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"\/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.BLUETOOTH"\/>\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"\/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"\/>' student_app/android/app/src/main/AndroidManifest.xml

          cat > student_app/android/app/build.gradle << 'EOF'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }
          android {
              namespace = "com.platinum.student_app"
              compileSdk = 34
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { 
                  jvmTarget = "17"
                  freeCompilerArgs += ["-Xskip-metadata-version-check"]
              }
              defaultConfig {
                  applicationId = "com.afrinode.platinum"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
                  multiDexEnabled = true
              }
              buildTypes { 
                  release { 
                      signingConfig = signingConfigs.debug 
                      minifyEnabled = false
                      shrinkResources = false
                  } 
              }
              lint { checkReleaseBuilds = false; abortOnError = false }
          }
          flutter { source = "../.." }
          dependencies {
              implementation platform("com.google.firebase:firebase-bom:35.0.2")
              implementation "com.google.firebase:firebase-analytics"
          }
          EOF

          cd student_app

          cat > pubspec.yaml << 'EOF'
          name: student_app
          description: "Platinum Digital App"
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.4.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.6
            firebase_core: ^3.1.0
            firebase_auth: ^5.1.0
            cloud_firestore: ^5.0.1
            firebase_storage: ^12.0.1
            image_picker: ^1.1.2
            video_player: ^2.9.1
            cached_network_image: ^3.3.1
            path_provider: ^2.1.3
            dio: ^5.4.3+1
            google_fonts: ^6.2.1
            sqflite: ^2.3.3+1
            path: ^1.9.0
            jitsi_meet_flutter_sdk: 10.3.0
            url_launcher: ^6.3.0
            file_picker: 8.1.6
            shared_preferences: ^2.2.3
            package_info_plus: 8.0.2
            http: ^1.2.1
            open_filex: ^4.5.0
            permission_handler: ^11.3.1
            audioplayers: ^6.0.0
            timeago: ^3.7.0
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
            flutter_launcher_icons: ^0.13.1
            flutter_native_splash: ^2.4.0

          flutter:
            uses-material-design: true

          flutter_launcher_icons:
            android: "launcher_icon"
            image_path: "assets/logo.png"
            adaptive_icon_background: "#FFFFFF"
            adaptive_icon_foreground: "assets/logo.png"

          flutter_native_splash:
            color: "#FFFFFF"
            image: assets/logo.png
            web: false
            fullscreen: true
            android_gravity: fill
            android_12:
              image: assets/logo.png
              icon_background_color: "#FFFFFF"
          EOF

          # --- STUDENT DART CODE ---
          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:firebase_auth/firebase_auth.dart';
          import 'package:google_fonts/google_fonts.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'screens/login.dart';
          import 'screens/home.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Firebase.initializeApp(options: const FirebaseOptions(apiKey: "AIzaSyDl-dfyyRT9kdxJOCm4ZM6QYmnY1cgXI0M", appId: "1:374715668746:android:b985232e1b3a6d0d4342f3", messagingSenderId: "374715668746", projectId: "payment-sas", storageBucket: "payment-sas.firebasestorage.app"));
            if (FirebaseAuth.instance.currentUser == null) {
              await FirebaseAuth.instance.signInAnonymously();
            }
            runApp(const App());
          }

          class App extends StatelessWidget {
            const App({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Platinum Digital App',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.light,
                  primaryColor: const Color(0xFFD4AF37),
                  scaffoldBackgroundColor: Colors.white,
                  useMaterial3: true,
                  textTheme: GoogleFonts.outfitTextTheme(Theme.of(context).textTheme.apply(bodyColor: Colors.black87)),
                  appBarTheme: const AppBarTheme(backgroundColor: Colors.white, elevation: 0, centerTitle: true, scrolledUnderElevation: 0, iconTheme: IconThemeData(color: Colors.black)),
                  cardTheme: const CardTheme(color: Colors.white, elevation: 2, shadowColor: Colors.black12, margin: EdgeInsets.zero, shape: RoundedRectangleBorder(borderRadius: BorderRadius.all(Radius.circular(18)))),
                  inputDecorationTheme: InputDecorationTheme(filled: true, fillColor: Colors.grey[100], border: const OutlineInputBorder(borderRadius: BorderRadius.all(Radius.circular(14)), borderSide: BorderSide.none), enabledBorder: const OutlineInputBorder(borderRadius: BorderRadius.all(Radius.circular(14)), borderSide: BorderSide(color: Colors.black12)), focusedBorder: const OutlineInputBorder(borderRadius: BorderRadius.all(Radius.circular(14)), borderSide: BorderSide(color: Color(0xFFD4AF37), width: 1.5))),
                  elevatedButtonTheme: ElevatedButtonThemeData(style: ElevatedButton.styleFrom(minimumSize: const Size(0, 48), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14)), backgroundColor: const Color(0xFFD4AF37), foregroundColor: Colors.black)),
                  bottomNavigationBarTheme: const BottomNavigationBarThemeData(
                    backgroundColor: Colors.white,
                    selectedItemColor: Color(0xFFD4AF37),
                    unselectedItemColor: Colors.grey,
                    elevation: 10,
                  ),
                ),
                home: const Start()
              );
            }
          }

          class Start extends StatefulWidget {
            const Start({super.key});
            @override
            State<Start> createState() => _StartState();
          }

          class _StartState extends State<Start> {
            @override
            void initState() {
              super.initState();
              _init();
            }

            Future<void> _init() async {
              final prefs = await SharedPreferences.getInstance();
              final isLoggedIn = prefs.getBool('isLoggedIn') ?? false;
              if (mounted) {
                if (isLoggedIn) {
                  Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const HomeScreen()));
                } else {
                  Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const LoginScreen()));
                }
              }
            }

            @override
            Widget build(BuildContext context) => const Scaffold(body: Center(child: CircularProgressIndicator(color: Color(0xFFD4AF37))));
          }
          EOF

          cat > lib/screens/login.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'dart:math';
          import 'home.dart';

          class LoginScreen extends StatefulWidget {
            const LoginScreen({super.key});
            @override
            State<LoginScreen> createState() => _LoginScreenState();
          }
          class _LoginScreenState extends State<LoginScreen> {
            final _firstName = TextEditingController();
            final _lastName = TextEditingController();
            final _code = TextEditingController();
            bool _isRegistering = false;
            bool _loading = false;

            Future<void> _register() async {
              if (_firstName.text.trim().isEmpty || _lastName.text.trim().isEmpty) return;
              setState(() => _loading = true);
              String generatedCode = "PDT-${Random().nextInt(8999) + 1000}";
              try {
                await FirebaseFirestore.instance.collection('students').add({
                  'firstName': _firstName.text.trim(),
                  'lastName': _lastName.text.trim(),
                  'unitCode': generatedCode,
                  'time': FieldValue.serverTimestamp(),
                });
                final prefs = await SharedPreferences.getInstance();
                await prefs.setBool('isLoggedIn', true);
                await prefs.setString('unitCode', generatedCode);
                await prefs.setString('firstName', _firstName.text.trim());
                await prefs.setString('lastName', _lastName.text.trim());
                if (mounted) {
                  showDialog(
                    context: context,
                    barrierDismissible: false,
                    builder: (ctx) => AlertDialog(
                      backgroundColor: Colors.white,
                      title: const Text('Registration Successful!', style: TextStyle(color: Color(0xFFD4AF37))),
                      content: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          const Text('This is your unique Report Code. Write it down!'),
                          const SizedBox(height: 16),
                          Text(generatedCode, style: const TextStyle(fontSize: 28, fontWeight: FontWeight.bold, color: Colors.black, letterSpacing: 2)),
                        ],
                      ),
                      actions: [
                        TextButton(
                          onPressed: () {
                            Navigator.pop(ctx);
                            Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const HomeScreen()));
                          },
                          child: const Text('I have saved it', style: TextStyle(color: Color(0xFFD4AF37))),
                        )
                      ]
                    )
                  );
                }
              } catch (e) {
                if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('Error: $e')));
              } finally {
                if (mounted) setState(() => _loading = false);
              }
            }

            Future<void> _login() async {
              if (_code.text.trim().isEmpty) return;
              setState(() => _loading = true);
              try {
                final snap = await FirebaseFirestore.instance.collection('students')
                    .where('unitCode', isEqualTo: _code.text.trim().toUpperCase())
                    .limit(1).get();
                if (snap.docs.isNotEmpty) {
                  final data = snap.docs.first.data();
                  final prefs = await SharedPreferences.getInstance();
                  await prefs.setBool('isLoggedIn', true);
                  await prefs.setString('unitCode', data['unitCode']);
                  await prefs.setString('firstName', data['firstName']);
                  await prefs.setString('lastName', data['lastName']);
                  if (mounted) Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const HomeScreen()));
                } else {
                  if (mounted) ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Invalid Code. Please register.'), backgroundColor: Colors.redAccent));
                }
              } catch (e) {
                if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('Error: $e')));
              } finally {
                if (mounted) setState(() => _loading = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Container(
                  decoration: const BoxDecoration(
                    gradient: LinearGradient(colors: [Colors.white, Color(0xFFF5F5F5)], begin: Alignment.topCenter, end: Alignment.bottomCenter)
                  ),
                  child: Center(
                    child: SingleChildScrollView(
                      child: Container(
                        margin: const EdgeInsets.all(24),
                        padding: const EdgeInsets.all(24),
                        decoration: BoxDecoration(
                          color: Colors.white,
                          borderRadius: BorderRadius.circular(24),
                          boxShadow: [BoxShadow(color: Colors.black.withOpacity(0.05), blurRadius: 20)],
                        ),
                        child: Column(
                          mainAxisSize: MainAxisSize.min,
                          children: [
                            Image.asset('assets/logo.png', height: 100),
                            const SizedBox(height: 20),
                            Text(_isRegistering ? 'Register Student' : 'Student Login', style: const TextStyle(fontSize: 24, fontWeight: FontWeight.bold, color: Colors.black)),
                            const SizedBox(height: 8),
                            Text(
                              _isRegistering ? 'Enter your real names.' : 'Enter your Report Code.',
                              textAlign: TextAlign.center,
                              style: const TextStyle(color: Colors.grey, fontSize: 12),
                            ),
                            const SizedBox(height: 24),
                            if (_isRegistering) ...[
                              TextField(controller: _firstName, decoration: const InputDecoration(labelText: 'First Name')),
                              const SizedBox(height: 16),
                              TextField(controller: _lastName, decoration: const InputDecoration(labelText: 'Last Name')),
                            ] else ...[
                              TextField(
                                controller: _code,
                                style: const TextStyle(letterSpacing: 4, fontWeight: FontWeight.bold, fontSize: 20),
                                textAlign: TextAlign.center,
                                decoration: const InputDecoration(labelText: 'Report Code (e.g. PDT-1234)'),
                              ),
                            ],
                            const SizedBox(height: 24),
                            SizedBox(
                              width: double.infinity,
                              height: 50,
                              child: ElevatedButton(
                                onPressed: _loading ? null : (_isRegistering ? _register : _login),
                                child: _loading ? const CircularProgressIndicator(color: Colors.black) : Text(_isRegistering ? 'Register & Get Code' : 'Access App', style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                              ),
                            ),
                            const SizedBox(height: 16),
                            TextButton(
                              onPressed: () => setState(() => _isRegistering = !_isRegistering),
                              child: Text(_isRegistering ? 'Already have a code? Login' : 'New student? Register here', style: const TextStyle(color: Colors.grey)),
                            )
                          ]
                        )
                      )
                    )
                  )
                )
              );
            }
          }
          EOF

          cat > lib/screens/home.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'feed.dart';
          import 'study.dart';
          import 'hub.dart';
          import 'profile.dart';

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});
            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }
          class _HomeScreenState extends State<HomeScreen> {
            int _i = 0;
            String _code = '';
            @override
            void initState() {
              super.initState();
              _load();
            }
            void _load() async {
              final prefs = await SharedPreferences.getInstance();
              if (mounted) {
                setState(() {
                  _code = prefs.getString('unitCode') ?? '';
                });
              }
            }
            @override
            Widget build(BuildContext context) {
              if (_code.isEmpty) return const Scaffold(body: Center(child: CircularProgressIndicator(color: Color(0xFFD4AF37))));
              final p = [
                FeedScreen(name: _code),
                const StudyScreen(),
                HubScreen(name: _code),
                ProfileScreen(code: _code),
              ];
              return Scaffold(
                body: p[_i],
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: _i,
                  onTap: (v) => setState(() => _i = v),
                  type: BottomNavigationBarType.fixed,
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.home_filled), label: 'For You'),
                    BottomNavigationBarItem(icon: Icon(Icons.menu_book_rounded), label: 'Library'),
                    BottomNavigationBarItem(icon: Icon(Icons.forum_rounded), label: 'Messages'),
                    BottomNavigationBarItem(icon: Icon(Icons.person_rounded), label: 'Profile')
                  ]
                )
              );
            }
          }
          EOF

          cat > lib/screens/feed.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:timeago/timeago.dart' as timeago;
          import 'package:cached_network_image/cached_network_image.dart';
          import 'play.dart';

          class FeedScreen extends StatefulWidget {
            final String name;
            const FeedScreen({super.key, required this.name});
            @override
            State<FeedScreen> createState() => _FeedScreenState();
          }

          class _FeedScreenState extends State<FeedScreen> {
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Row(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      const Icon(Icons.auto_awesome, color: Color(0xFFD4AF37), size: 20),
                      const SizedBox(width: 8),
                      const Text('Platinum Feed', style: TextStyle(fontWeight: FontWeight.bold, color: Colors.black)),
                      const SizedBox(width: 8),
                      Container(
                        padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 2),
                        decoration: BoxDecoration(color: Colors.redAccent.withOpacity(0.1), borderRadius: BorderRadius.circular(8)),
                        child: const Text('LIVE', style: TextStyle(color: Colors.redAccent, fontSize: 10, fontWeight: FontWeight.bold)),
                      )
                    ],
                  ),
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.play_circle_fill, color: Color(0xFFD4AF37), size: 30), 
                      onPressed: () => Navigator.push(context, MaterialPageRoute(builder: (_) => const PlatinumPlayScreen()))
                    )
                  ],
                ),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    _buildPulse(),
                    const SizedBox(height: 16),
                    _buildUrgentTicker(),
                    const SizedBox(height: 16),
                    StreamBuilder<QuerySnapshot>(
                      stream: FirebaseFirestore.instance.collection('feed_posts').orderBy('time', descending: true).snapshots(),
                      builder: (c, s) {
                        if (!s.hasData) return const Center(child: CircularProgressIndicator(color: Color(0xFFD4AF37)));
                        if (s.data!.docs.isEmpty) return const Center(child: Text('No posts yet.', style: TextStyle(color: Colors.grey)));
                        return Column(
                          children: s.data!.docs.map((doc) {
                            final data = doc.data() as Map<String, dynamic>;
                            return _FeedCard(id: doc.id, data: data);
                          }).toList(),
                        );
                      },
                    )
                  ],
                ),
              );
            }

            Widget _buildPulse() {
              return Container(
                padding: const EdgeInsets.all(16),
                decoration: BoxDecoration(
                  gradient: const LinearGradient(colors: [Color(0xFFF9F1D8), Color(0xFFFFFFFF)], begin: Alignment.topLeft, end: Alignment.bottomRight),
                  borderRadius: BorderRadius.circular(20),
                  border: Border.all(color: const Color(0xFFD4AF37).withOpacity(0.3)),
                  boxShadow: [BoxShadow(color: const Color(0xFFD4AF37).withOpacity(0.1), blurRadius: 10, spreadRadius: 2)],
                ),
                child: Column(
                  children: [
                    const Row(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        Icon(Icons.workspace_premium, color: Color(0xFFD4AF37), size: 20),
                        SizedBox(width: 8),
                        Text('Platinum Pulse • LIVE DASHBOARD', style: TextStyle(color: Color(0xFFD4AF37), fontWeight: FontWeight.bold, fontSize: 12, letterSpacing: 0.5)),
                      ],
                    ),
                    const SizedBox(height: 16),
                    Row(
                      mainAxisAlignment: MainAxisAlignment.spaceAround,
                      children: [
                        _pulseStat(Icons.people, 'Students', FirebaseFirestore.instance.collection('students')),
                        Container(height: 30, width: 1, color: Colors.black12),
                        _pulseStat(Icons.forum, 'Posts', FirebaseFirestore.instance.collection('feed_posts')),
                        Container(height: 30, width: 1, color: Colors.black12),
                        _pulseStat(Icons.videocam, 'Live', FirebaseFirestore.instance.collection('live_classes')),
                      ],
                    ),
                  ],
                ),
              );
            }

            Widget _pulseStat(IconData icon, String label, CollectionReference col) {
              return StreamBuilder<QuerySnapshot>(
                stream: col.snapshots(),
                builder: (context, snap) {
                  final count = snap.data?.docs.length ?? 0;
                  return Column(
                    children: [
                      Icon(icon, color: Colors.black54, size: 24),
                      const SizedBox(height: 4),
                      Text('$count', style: const TextStyle(fontSize: 20, fontWeight: FontWeight.bold, color: Colors.black)),
                      Text(label, style: const TextStyle(fontSize: 11, color: Colors.grey)),
                    ],
                  );
                }
              );
            }

            Widget _buildUrgentTicker() {
              return StreamBuilder<QuerySnapshot>(
