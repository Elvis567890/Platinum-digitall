          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:flutter/material.dart';

          const _gold = Color(0xFFD4AF37);

          class EnterMarksScreen extends StatefulWidget {
            const EnterMarksScreen({super.key});
            @override
            State<EnterMarksScreen> createState() => _EnterMarksScreenState();
          }

          class _EnterMarksScreenState extends State<EnterMarksScreen> {
            String? _selectedStudentCode;
            String? _selectedStudentName;
            final _classLevel = TextEditingController();
            final _term = TextEditingController();
            final _math = TextEditingController();
            final _eng = TextEditingController();
            final _sci = TextEditingController();
            bool _loading = false;

            @override
            void dispose() {
              _classLevel.dispose(); _term.dispose(); _math.dispose(); _eng.dispose(); _sci.dispose();
              super.dispose();
            }

            Future<void> _submit() async {
              if (_selectedStudentCode == null || _selectedStudentName == null) { _toast('Please select a student.'); return; }
              final classLevel = _classLevel.text.trim().toUpperCase();
              if (classLevel.isEmpty) { _toast('Please enter the class (for example S4).'); return; }
              final mathScore = int.tryParse(_math.text.trim());
              final engScore = int.tryParse(_eng.text.trim());
              final sciScore = int.tryParse(_sci.text.trim());
              if ([mathScore, engScore, sciScore].any((v) => v == null || v < 0 || v > 100)) { _toast('All scores must be whole numbers from 0 to 100.'); return; }
              final math = mathScore!; final eng = engScore!; final sci = sciScore!;
              final total = math + eng + sci;
              final average = total ~/ 3;
              final nameParts = _selectedStudentName!.split(RegExp(r'\s+'));
              final firstName = nameParts.first;
              final lastName = nameParts.length > 1 ? nameParts.sublist(1).join(' ') : '';
              setState(() => _loading = true);
              try {
                await FirebaseFirestore.instance.collection('marks').add({
                  'unitCode': _selectedStudentCode,
                  'firstName': firstName,
                  'lastName': lastName,
                  'studentName': _selectedStudentName,
                  'classLevel': classLevel,
                  'term': _term.text.trim().isEmpty ? 'Term 1' : _term.text.trim(),
                  'subjects': [
                    {'name': 'Mathematics', 'score': math, 'grade': _grade(math)},
                    {'name': 'English', 'score': eng, 'grade': _grade(eng)},
                    {'name': 'Science', 'score': sci, 'grade': _grade(sci)},
                  ],
                  'total': total,
                  'average': average,
                  'time': FieldValue.serverTimestamp(),
                });
                if (!mounted) return;
                _toast('Marks saved successfully.', success: true);
                Navigator.pop(context);
              } catch (e) {
                if (mounted) _toast('Could not save marks: $e');
              } finally {
                if (mounted) setState(() => _loading = false);
              }
            }

            String _grade(int score) => score >= 80 ? 'A' : (score >= 60 ? 'B' : 'C');

            void _toast(String message, {bool success = false}) {
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(message), backgroundColor: success ? Colors.green : null));
            }

            @override
            Widget build(BuildContext context) => Scaffold(
              appBar: AppBar(title: const Text('Enter Student Marks')),
              body: SingleChildScrollView(
                padding: const EdgeInsets.all(16),
                child: Column(crossAxisAlignment: CrossAxisAlignment.stretch, children: [
                  _StudentPicker(selectedCode: _selectedStudentCode, onChanged: (code, name) => setState(() { _selectedStudentCode = code; _selectedStudentName = name; })),
                  const SizedBox(height: 12),
                  Row(children: [
                    Expanded(child: TextField(controller: _classLevel, textCapitalization: TextCapitalization.characters, decoration: const InputDecoration(labelText: 'Class (e.g. S4)'))),
                    const SizedBox(width: 10),
                    Expanded(child: TextField(controller: _term, decoration: const InputDecoration(labelText: 'Term (e.g. Term 1)'))),
                  ]),
                  const SizedBox(height: 20),
                  const Divider(),
                  const SizedBox(height: 10),
                  _scoreField(_math, 'Mathematics'),
                  const SizedBox(height: 10),
                  _scoreField(_eng, 'English'),
                  const SizedBox(height: 10),
                  _scoreField(_sci, 'Science'),
                  const SizedBox(height: 24),
                  SizedBox(height: 52, child: ElevatedButton(
                    onPressed: _loading ? null : _submit,
                    child: _loading ? const SizedBox(width: 22, height: 22, child: CircularProgressIndicator(color: Colors.black, strokeWidth: 2.5)) : const Text('Save Marks', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                  )),
                ]),
              ),
            );

            Widget _scoreField(TextEditingController controller, String label) => TextField(controller: controller, keyboardType: TextInputType.number, decoration: InputDecoration(labelText: '$label score (0-100)'));
          }

          class _StudentPicker extends StatelessWidget {
            final String? selectedCode;
            final void Function(String? code, String? name) onChanged;
            const _StudentPicker({required this.selectedCode, required this.onChanged});
            @override
            Widget build(BuildContext context) => StreamBuilder<QuerySnapshot<Map<String, dynamic>>>(
              stream: FirebaseFirestore.instance.collection('students').snapshots(),
              builder: (context, snap) {
                if (snap.hasError) return Text('Could not load students: ${snap.error}');
                if (!snap.hasData) return const LinearProgressIndicator(color: _gold);
                final students = <Map<String, String>>[];
                final seen = <String>{};
                for (final doc in snap.data!.docs) {
                  final data = doc.data();
                  final code = (data['unitCode'] ?? '').toString().trim();
                  if (code.isEmpty || !seen.add(code)) continue;
                  final first = (data['firstName'] ?? '').toString().trim();
                  final last = (data['lastName'] ?? '').toString().trim();
                  final name = [first, last].where((s) => s.isNotEmpty).join(' ');
                  students.add({'code': code, 'name': name.isEmpty ? code : name});
                }
                final exists = selectedCode != null && students.any((s) => s['code'] == selectedCode);
                if (!exists && selectedCode != null) {
                  WidgetsBinding.instance.addPostFrameCallback((_) => onChanged(null, null));
                }
                return DropdownButtonFormField<String>(
                  decoration: const InputDecoration(labelText: 'Select registered student'),
                  value: exists ? selectedCode : null,
                  isExpanded: true,
                  items: students.map((s) => DropdownMenuItem<String>(value: s['code'], child: Text('${s['name']}  ·  ${s['code']}', overflow: TextOverflow.ellipsis))).toList(),
                  onChanged: (code) {
                    if (code == null) { onChanged(null, null); return; }
                    onChanged(code, students.firstWhere((s) => s['code'] == code)['name']);
                  },
                );
              },
            );
          }
          EOF_MARKS

          cat > lib/screens/admin_chat.dart << 'EOF_CHAT'
          import 'dart:io';

          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:firebase_storage/firebase_storage.dart';
          import 'package:flutter/material.dart';
          import 'package:url_launcher/url_launcher.dart';

          const _gold = Color(0xFFD4AF37);
          const _card = Color(0xFF131A26);
          const _bubbleMe = Color(0xFF1A365D);

          class AdminChat extends StatefulWidget {
            const AdminChat({super.key});
            @override
            State<AdminChat> createState() => _AdminChatState();
          }

          class _AdminChatState extends State<AdminChat> {
            final _controller = TextEditingController();
            bool _uploading = false;
            bool _sending = false;

            @override
            void dispose() { _controller.dispose(); super.dispose(); }

            Future<void> _sendMedia() async {
              try {
                final picked = await FilePicker.platform.pickFiles(type: FileType.any);
                if (picked == null || picked.files.single.path == null) return;
                setState(() => _uploading = true);
                final file = picked.files.single;
                final ref = FirebaseStorage.instance.ref().child('chat/${DateTime.now().millisecondsSinceEpoch}_${file.name}');
                await ref.putFile(File(file.path!));
                final url = await ref.getDownloadURL();
                await FirebaseFirestore.instance.collection('chats').doc('All').collection('msgs').add({
                  'sender': 'Admin', 'text': file.name, 'type': 'file', 'url': url, 'fileName': file.name, 'time': FieldValue.serverTimestamp(),
                });
              } catch (e) {
                if (mounted) _toast('Upload failed: $e');
              } finally {
                if (mounted) setState(() => _uploading = false);
              }
            }

            Future<void> _sendText() async {
              final text = _controller.text.trim();
              if (text.isEmpty || _sending) return;
              _controller.clear();
              setState(() => _sending = true);
              try {
                await FirebaseFirestore.instance.collection('chats').doc('All').collection('msgs').add({
                  'sender': 'Admin', 'text': text, 'type': 'text', 'time': FieldValue.serverTimestamp(),
                });
              } catch (e) {
                if (mounted) _toast('Send failed: $e');
              } finally {
                if (mounted) setState(() => _sending = false);
              }
            }

            void _toast(String message) {
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(message)));
            }

            @override
            Widget build(BuildContext context) => Scaffold(
              appBar: AppBar(title: const Text('School Chat')),
              body: Column(children: [
                if (_uploading) const LinearProgressIndicator(color: _gold, minHeight: 2),
                Expanded(child: StreamBuilder<QuerySnapshot<Map<String, dynamic>>>(
                  stream: FirebaseFirestore.instance.collection('chats').doc('All').collection('msgs').orderBy('time', descending: false).snapshots(),
                  builder: (context, snapshot) {
                    if (snapshot.hasError) return Center(child: Padding(padding: const EdgeInsets.all(16), child: Text('Could not load messages: ${snapshot.error}', textAlign: TextAlign.center, style: const TextStyle(color: Colors.orangeAccent))));
                    if (!snapshot.hasData) return const Center(child: CircularProgressIndicator(color: _gold));
                    final docs = snapshot.data!.docs;
                    if (docs.isEmpty) return const Center(child: Text('No messages yet.', style: TextStyle(color: Colors.grey)));
                    return ListView.builder(
                      padding: const EdgeInsets.all(8),
                      itemCount: docs.length,
                      itemBuilder: (context, i) => _Bubble(data: docs[i].data(), isMe: (docs[i].data()['sender'] ?? '') == 'Admin'),
                    );
                  },
                )),
                SafeArea(child: Padding(
                  padding: const EdgeInsets.fromLTRB(8, 4, 8, 8),
                  child: Row(children: [
                    IconButton(icon: const Icon(Icons.attach_file, color: _gold), onPressed: _uploading ? null : _sendMedia),
                    Expanded(child: TextField(
                      controller: _controller,
                      textInputAction: TextInputAction.send,
                      onSubmitted: (_) => _sendText(),
                      decoration: InputDecoration(hintText: 'Broadcast...', hintStyle: const TextStyle(color: Colors.grey), filled: true, fillColor: _card, contentPadding: const EdgeInsets.symmetric(horizontal: 16, vertical: 10), border: OutlineInputBorder(borderRadius: BorderRadius.circular(24), borderSide: BorderSide.none)),
                    )),
                    const SizedBox(width: 8),
                    CircleAvatar(backgroundColor: _gold, child: IconButton(icon: const Icon(Icons.send, color: Colors.black, size: 20), onPressed: _sending ? null : _sendText)),
                  ]),
                )),
              ]),
            );
          }

          class _Bubble extends StatelessWidget {
            final Map<String, dynamic> data;
            final bool isMe;
            const _Bubble({required this.data, required this.isMe});

            @override
            Widget build(BuildContext context) {
              final rawText = (data['text'] ?? '').toString();
              final type = (data['type'] ?? 'text').toString();
              final url = (data['url'] ?? '').toString();
              final fileName = (data['fileName'] ?? '').toString();
              String body = rawText;
              if (body.isEmpty) {
                body = type == 'image' ? 'Image' : (type == 'video' ? 'Video' : (type == 'audio' ? 'Audio' : 'Attachment'));
              }
              Widget content;
              if (url.isNotEmpty && ['file','doc','image','video','audio'].contains(type)) {
                content = InkWell(
                  onTap: () async {
                    try {
                      await launchUrl(Uri.parse(url), mode: LaunchMode.externalApplication);
                    } catch (e) {
                      if (context.mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('Could not open attachment: $e')));
                    }
                  },
                  child: Row(mainAxisSize: MainAxisSize.min, children: [
                    const Icon(Icons.attachment, color: _gold, size: 18),
                    const SizedBox(width: 8),
                    Flexible(child: Text(fileName.isNotEmpty ? fileName : body, style: const TextStyle(color: Colors.lightBlueAccent, decoration: TextDecoration.underline), overflow: TextOverflow.ellipsis)),
                  ]),
                );
              } else {
                content = Text(body, style: const TextStyle(color: Colors.white));
              }
              return Align(
                alignment: isMe ? Alignment.centerRight : Alignment.centerLeft,
                child: Container(
                  margin: const EdgeInsets.symmetric(horizontal: 6, vertical: 4),
                  padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 10),
                  constraints: const BoxConstraints(maxWidth: 320),
                  decoration: BoxDecoration(
                    color: isMe ? _bubbleMe : _card,
                    borderRadius: BorderRadius.only(
                      topLeft: const Radius.circular(16),
                      topRight: const Radius.circular(16),
                      bottomLeft: isMe ? const Radius.circular(16) : Radius.zero,
                      bottomRight: isMe ? Radius.zero : const Radius.circular(16),
                    ),
                  ),
                  child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                    if (!isMe) Padding(padding: const EdgeInsets.only(bottom: 4), child: Text((data['sender'] ?? '?').toString(), style: const TextStyle(fontSize: 11, color: _gold, fontWeight: FontWeight.bold))),
                    content,
                    Padding(padding: const EdgeInsets.only(top: 4), child: Text(_formatTime(data['time']), style: const TextStyle(fontSize: 10, color: Colors.grey))),
                  ]),
                ),
              );
            }

            String _formatTime(dynamic t) {
              if (t is Timestamp) {
                final d = t.toDate();
                return '${d.hour.toString().padLeft(2, '0')}:${d.minute.toString().padLeft(2, '0')}';
              }
              return '';
            }
          }
          EOF_CHAT

      - name: Decode Google Services JSON (Admin)
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | tr -d '[:space:]' | base64 -d > admin_app/android/app/google-services.json

      - name: Build Admin APK
        run: |
          cd admin_app
          flutter clean
          flutter pub get
          rm -rf test
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter pub run flutter_launcher_icons
          flutter pub run flutter_native_splash:create
          flutter build apk --release --no-tree-shake-icons

      - name: Create Release (Staff OTA)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: staff-v1.0.${{ github.run_number }}
          name: Platinum Staff Hub v1.0.${{ github.run_number }}
          files: admin_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: platinum-staff-hub-apk
          path: admin_app/build/app/outputs/flutter-apk/app-release.apk
