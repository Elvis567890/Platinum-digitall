          cat > lib/screens/timetable.dart << 'EOF'
          import 'package:flutter/material.dart'; import 'package:cloud_firestore/cloud_firestore.dart';
          class TimetableScreen extends StatelessWidget {
            final String cls; const TimetableScreen({super.key, required this.cls});
            @override Widget build(BuildContext context) {
              return Scaffold(backgroundColor: const Color(0xFFF9F9F9), appBar: AppBar(title: const Text('My Class Timetable', style: TextStyle(fontWeight: FontWeight.bold)), backgroundColor: const Color(0xFFC62828), foregroundColor: Colors.white), body: StreamBuilder<QuerySnapshot>(stream: FirebaseFirestore.instance.collection('timetables').doc(cls).collection('periods').orderBy('order').snapshots(), builder: (context, snapshot) {
                if (!snapshot.hasData) return const Center(child: CircularProgressIndicator());
                if (snapshot.data!.docs.isEmpty) return const Center(child: Text('The timetable has not been released yet.', style: TextStyle(color: Colors.grey)));
                Map<String, List<Map<String, dynamic>>> grouped = {};
                for (var doc in snapshot.data!.docs) { final d = doc.data() as Map<String, dynamic>; String day = d['day'] ?? 'Unknown'; grouped.putIfAbsent(day, () => []).add(d); }
                List<String> daysOrder = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
                List<String> availableDays = grouped.keys.toList()..sort((a, b) => daysOrder.indexOf(a).compareTo(daysOrder.indexOf(b)));
                return ListView.builder(padding: const EdgeInsets.all(16), itemCount: availableDays.length, itemBuilder: (c, i) {
                  String day = availableDays[i]; List<Map<String, dynamic>> periods = grouped[day]!;
                  return Card(margin: const EdgeInsets.only(bottom: 16), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16), side: const BorderSide(color: Color(0xFFD4AF37), width: 1.5)), child: Padding(padding: const EdgeInsets.all(16), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                    Text(day, style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Color(0xFFC62828))), const Divider(),
                    ...periods.map((p) => Padding(padding: const EdgeInsets.symmetric(vertical: 8), child: Row(children: [SizedBox(width: 100, child: Text(p['time'] ?? '', style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.grey))), const Icon(Icons.arrow_right, color: Color(0xFFD4AF37)), const SizedBox(width: 8), Expanded(child: Text(p['subject'] ?? '', style: const TextStyle(fontWeight: FontWeight.w600, fontSize: 15)))]))),
                  ])));
                });
              }));
            }
          }
          EOF

          cat > lib/screens/feed.dart << 'EOF'
          import 'package:flutter/material.dart'; import 'package:cloud_firestore/cloud_firestore.dart'; import 'package:timeago/timeago.dart' as timeago; import 'package:cached_network_image/cached_network_image.dart'; import '../services/telegram_service.dart';
          class FeedScreen extends StatelessWidget { final String name; const FeedScreen({super.key, required this.name}); @override Widget build(BuildContext context) { return Scaffold(appBar: AppBar(title: const Text('Platinum Pulse')), body: ListView(children: [StreamBuilder<QuerySnapshot>(stream: FirebaseFirestore.instance.collection('feed_posts').orderBy('time', descending: true).limit(20).snapshots(), builder: (c, s) { if (!s.hasData) return const Center(child: CircularProgressIndicator()); return Column(children: s.data!.docs.map((doc) { final d = doc.data() as Map<String, dynamic>; return _FeedCard(id: doc.id, data: d, myName: name); }).toList()); })])); } }
          class _FeedCard extends StatefulWidget { final String id; final Map<String, dynamic> data; final String myName; const _FeedCard({required this.id, required this.data, required this.myName}); @override State<_FeedCard> createState() => _FeedCardState(); }
          class _FeedCardState extends State<_FeedCard> {
